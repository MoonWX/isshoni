<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share Audio Check</title>
<style>
  :root { --bg: #fff; --fg: #1b1b1f; --muted: #6b6b76; --line: #d9d9e0; --panel: #f6f6f9; --good: #1f7a3a; --bad: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16161a; --fg: #e8e8ee; --muted: #9a9aa6; --line: #33333b; --panel: #1f1f25; --good: #5cc37f; --bad: #ff8a80; }
  }
  body { margin: 0; padding: 16px; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); max-width: 820px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 12px 0; padding: 8px 14px; background: var(--panel); }
  legend { color: var(--muted); }
  label { display: block; margin: 2px 0; }
  button { font-size: 15px; margin: 4px 8px 4px 0; }
  .muted { color: var(--muted); }
  .big { font-size: 18px; font-weight: 600; }
  .good { color: var(--good); } .bad { color: var(--bad); }
  pre { white-space: pre-wrap; font-size: 13px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
// What does the browser put into a screen share's audio when the capturing page
// (standing in for Discord Web) plays a "voice" tone and another tab (standing
// in for YouTube) plays a "video" tone? Measured with a Goertzel filter.
const VOICE = 453, VIDEO = 1031;
const role = new URLSearchParams(location.search).get('role');
const app = document.getElementById('app');

function tone(freq) {
  const ctx = new AudioContext();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.frequency.value = freq;
  gain.gain.value = 0.2;
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  return ctx;
}

if (role === 'youtube') {
  document.title = 'YouTube stand-in';
  app.innerHTML = `<h1>"YouTube" stand-in tab</h1>
    <p>This tab plays a ${VIDEO} Hz tone, like a video playing in another tab of the same browser.</p>
    <button id="go">Start the ${VIDEO} Hz tone</button> <span id="st" class="muted"></span>
    <p class="muted">Leave this tab open and playing, then go back to the first tab.</p>`;
  document.getElementById('go').onclick = () => { tone(VIDEO); document.getElementById('st').textContent = 'playing…'; };
} else {
  document.title = 'Share Audio Check';
  app.innerHTML = `<h1>Share Audio Check</h1>
    <p class="muted">This tab stands in for <b>Discord Web</b>: it plays the call's voices (a ${VOICE} Hz tone) and does the screen share.
    A second tab stands in for <b>YouTube</b> (${VIDEO} Hz). The test shows which of them end up in the shared audio.</p>
    <fieldset><legend>1. Set up</legend>
      <button id="voice">Start "Discord voice" tone (${VOICE} Hz)</button>
      <button id="yt">Open "YouTube" tab</button> <span class="muted">(click Start in that tab, then come back)</span>
    </fieldset>
    <fieldset><legend>2. Options passed to getDisplayMedia</legend>
      <label><input type="radio" name="preset" value="discord" checked> Like Discord Web (see note below)</label>
      <label><input type="radio" name="preset" value="plain"> Plain: <code>{video: true, audio: true}</code></label>
      <label><input type="radio" name="preset" value="custom"> Custom:</label>
      <div id="custom" style="margin-left:24px">
        <label><input type="checkbox" id="sys" checked> systemAudio: "include"</label>
        <label><input type="checkbox" id="restrict"> restrictOwnAudio: true (keep this tab's own sound out)</label>
        <label><input type="checkbox" id="suppress"> suppressLocalAudioPlayback: true</label>
        <label><input type="checkbox" id="winaudio"> windowAudio: "window"</label>
      </div>
      <p class="muted" id="discordnote"></p>
    </fieldset>
    <fieldset><legend>3. Share and measure (about 8 s)</legend>
      <button id="share">Share…</button>
      <span class="muted">Pick <b>Entire screen</b> (tick "Also share system audio"), a <b>Tab</b> (e.g. the "YouTube" tab), or a <b>Window</b>.</span>
      <div id="result"></div>
    </fieldset>
    <fieldset><legend>Results so far (copy and send back)</legend>
      <button id="copy">Copy results</button>
      <pre id="log"></pre>
    </fieldset>`;
  const $ = (id) => document.getElementById(id);
  const results = [];
  // Exactly what Discord Web passes (discord.com/app build 622805, 2026-09-29):
  // no restrictOwnAudio / suppressLocalAudioPlayback / systemAudio / windowAudio.
  const DISCORD = { audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
    video: { width: 1920, height: 1080, frameRate: 30 } };
  $('discordnote').textContent = DISCORD
    ? 'Discord-like options: ' + JSON.stringify(DISCORD)
    : 'Discord-like options are unknown for this build; "Plain" is used instead.';
  $('voice').onclick = () => { tone(VOICE); $('voice').textContent = `"Discord voice" playing (${VOICE} Hz)`; };
  $('yt').onclick = () => window.open(location.pathname + '?role=youtube', '_blank');
  $('copy').onclick = () => navigator.clipboard.writeText($('log').textContent).catch(() => {});

  function constraints() {
    const preset = document.querySelector('input[name=preset]:checked').value;
    if (preset === 'discord' && DISCORD) return JSON.parse(JSON.stringify(DISCORD));
    if (preset !== 'custom') return { video: true, audio: true };
    const c = { video: true, audio: {} };
    if ($('restrict').checked) c.audio.restrictOwnAudio = true;
    if ($('suppress').checked) c.audio.suppressLocalAudioPlayback = true;
    if (!Object.keys(c.audio).length) c.audio = true;
    if ($('sys').checked) c.systemAudio = 'include';
    if ($('winaudio').checked) c.windowAudio = 'window';
    return c;
  }

  function levelDb(x, fs, f) {
    const n = x.length, coeff = 2 * Math.cos(2 * Math.PI * f / fs);
    let s1 = 0, s2 = 0, sumW = 0;
    for (let i = 0; i < n; i++) {
      const w = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (n - 1));
      sumW += w;
      const s0 = x[i] * w + coeff * s1 - s2; s2 = s1; s1 = s0;
    }
    const p = s1 * s1 + s2 * s2 - coeff * s1 * s2;
    return 20 * Math.log10(Math.max(2 * Math.sqrt(Math.max(p, 0)) / sumW, 1e-10));
  }

  $('share').onclick = async () => {
    const c = constraints();
    let stream;
    try {
      stream = await navigator.mediaDevices.getDisplayMedia(c);
    } catch (e) {
      $('result').innerHTML = `<p class="bad">Share failed: ${e.name}: ${e.message}</p>`;
      return;
    }
    const v = stream.getVideoTracks()[0];
    const a = stream.getAudioTracks()[0];
    const surface = v?.getSettings().displaySurface || '?';
    const entry = { browser: navigator.userAgent.match(/(Edg|Chrome|Firefox)\/[\d.]+/g)?.join(' ') || navigator.userAgent,
      constraints: c, surface, label: v?.label || '', audio: !!a, audioSettings: a ? a.getSettings() : null };
    if (!a) {
      entry.verdict = 'no audio track (the browser offered no audio for this choice)';
      finish(entry, stream);
      return;
    }
    const ctx = new AudioContext();
    const src = ctx.createMediaStreamSource(new MediaStream([a]));
    const an = ctx.createAnalyser();
    an.fftSize = 32768;
    src.connect(an);
    const buf = new Float32Array(an.fftSize);
    let maxVoice = -200, maxVideo = -200, ticks = 0;
    $('result').innerHTML = '<p>Measuring… keep both tones playing.</p>';
    const timer = setInterval(() => {
      an.getFloatTimeDomainData(buf);
      maxVoice = Math.max(maxVoice, levelDb(buf, ctx.sampleRate, VOICE));
      maxVideo = Math.max(maxVideo, levelDb(buf, ctx.sampleRate, VIDEO));
      if (++ticks >= 16) {
        clearInterval(timer);
        ctx.close();
        entry.voiceDb = Math.round(maxVoice); entry.videoDb = Math.round(maxVideo);
        const heard = (db) => db > -50;
        entry.verdict = `own voice (${VOICE} Hz) ${heard(maxVoice) ? 'HEARD → friends hear themselves (echo)' : 'not heard'}; ` +
          `other tab (${VIDEO} Hz) ${heard(maxVideo) ? 'HEARD' : 'not heard'}`;
        finish(entry, stream);
      }
    }, 500);
  };

  function finish(entry, stream) {
    stream.getTracks().forEach((t) => t.stop());
    results.push(entry);
    const echo = entry.voiceDb > -50, yt = entry.videoDb > -50;
    $('result').innerHTML = `<p class="big">You shared: ${entry.surface}${entry.label ? ' (' + entry.label + ')' : ''}</p>` +
      (entry.voiceDb === undefined ? `<p>${entry.verdict}</p>` :
        `<p class="${echo ? 'bad' : 'good'} big">Discord voices: ${echo ? 'friends WOULD hear themselves (echo)' : 'not in the shared audio'} (${entry.voiceDb} dB)</p>
         <p class="${yt ? 'good' : 'bad'} big">YouTube in the other tab: ${yt ? 'shared' : 'NOT shared'} (${entry.videoDb} dB)</p>`);
    $('log').textContent = JSON.stringify(results, null, 2);
  }
}
</script>
</body>
</html>
