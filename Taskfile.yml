# Developer tasks for isshoni (https://taskfile.dev). `task --list` shows them; the contract for each one is
# docs/m1/06-deploy-and-ci.md §7.2, and for the Windows app's tasks (desktop:*, native:*, ffmpeg:*, release:wails3,
# release:update-keys, lint:ps, test:ps, the Wails part of lint:pins) docs/m2/06-windows-release.md §17.
#
# Task runs every command through its built-in POSIX shell, so the tasks work on macOS, Linux and Windows (a few are
# Linux-only, Windows-only or Mac-and-Linux-only and say so). A task whose inputs do not exist yet (the web app, the
# installer, the site, ...) prints a note and exits 0. So does each M2 task that a later slice of docs/m2/README.md
# fills in: its note names that slice, and only that slice changes its body.
#
# No Task yet? Build the pinned one: `go -C tools build -o ../.bin/ github.com/go-task/task/v3/cmd/task`, then run
# `.bin/task setup` (see CONTRIBUTING.md).

# The guards below use `if:` on commands (Task 3.47, fixed in 3.48). An older Task stops here with a version error
# instead of running both sides of a guard.
version: '3.48'

set: [pipefail]

vars:
  # One version per build: the Go binary (ldflags) and the web app (env ISSHONI_VERSION, written into
  # web/dist/version.json) always get the same value. `task build VERSION=…` wins, then env ISSHONI_VERSION (CI),
  # then 0.0.0-dev+<12-char commit>, plus -dirty when the working tree has changes. Outside a git checkout the
  # commit is "unknown", so the tasks still run.
  COMMIT:
    sh: git rev-parse --short=12 HEAD 2>/dev/null || echo unknown
  DIRTY:
    sh: test -z "$(git status --porcelain 2>/dev/null)" || printf '%s' -dirty
  DEV_VERSION: '0.0.0-dev+{{.COMMIT}}{{.DIRTY}}'
  VERSION: '{{.ISSHONI_VERSION | default .DEV_VERSION}}'
  VERSION_PKG: github.com/MoonWX/isshoni/internal/version

  # The pinned Go tools of tools/go.mod, built into .bin/ by `task tools` (one tools:<name> task each).
  GOLANGCI_LINT: '.bin/golangci-lint{{exeExt}}'
  GO_LICENSES: '.bin/go-licenses{{exeExt}}'
  TYGO: '.bin/tygo{{exeExt}}'
  SHFMT: '.bin/shfmt{{exeExt}}'
  # The wails3 CLI, from its own module tools/wails3/go.mod (`task release:wails3`).
  WAILS3: '.bin/wails3{{exeExt}}'

tasks:
  # ---------------------------------------------------------------------------------------------------------------
  # Setup

  setup:
    desc: Install what a fresh clone needs (npm packages, Go modules, the pinned Go tools in .bin/)
    cmds:
      - cmd: "echo 'setup: note: web/package.json does not exist yet, skipping npm ci in web/'"
        silent: true
        if: '[ ! -f web/package.json ]'
      - cmd: npm --prefix web ci
        if: '[ -f web/package.json ]'
      - cmd: "echo 'setup: note: docs/package.json does not exist yet, skipping npm ci in docs/'"
        silent: true
        if: '[ ! -f docs/package.json ]'
      - cmd: npm --prefix docs ci
        if: '[ -f docs/package.json ]'
      - go mod download
      - task: tools

  setup:e2e:
    desc: Install Google Chrome for the Playwright e2e tests (only needed for `task e2e`)
    cmds:
      - cmd: "echo 'setup:e2e: skipped, web/package.json does not exist yet'"
        silent: true
        if: '[ ! -f web/package.json ]'
      - cmd: npx --prefix web playwright install chrome
        if: '[ -f web/package.json ]'

  tools:
    desc: >-
      Build the pinned Go tools of tools/go.mod into .bin/ (task, golangci-lint, tygo, go-licenses, govulncheck,
      shfmt)
    cmds:
      # One after the other, so the tools' shared dependencies are compiled once.
      - task: tools:task
      - task: tools:golangci-lint
      - task: tools:tygo
      - task: tools:go-licenses
      - task: tools:govulncheck
      - task: tools:shfmt

  # One task per tool, so a task that needs one tool (gen, licenses, lint:*) builds only that one on a cold cache.
  # Each rebuilds its binary when tools/go.mod or tools/go.sum changes (its toolchain line picks the Go version that
  # builds the tools) or the binary is missing. None of the tools needs cgo; without it no C toolchain is involved
  # (golangci-lint's plugin loader is off).
  tools:task:
    run: once
    env: {CGO_ENABLED: '0'}
    sources: [tools/go.mod, tools/go.sum]
    generates: ['.bin/task{{exeExt}}']
    cmds:
      - go -C tools build -o ../.bin/ github.com/go-task/task/v3/cmd/task

  tools:golangci-lint:
    run: once
    env: {CGO_ENABLED: '0'}
    sources: [tools/go.mod, tools/go.sum]
    generates: ['{{.GOLANGCI_LINT}}']
    cmds:
      - go -C tools build -o ../.bin/ github.com/golangci/golangci-lint/v2/cmd/golangci-lint

  tools:tygo:
    run: once
    env: {CGO_ENABLED: '0'}
    sources: [tools/go.mod, tools/go.sum]
    generates: ['{{.TYGO}}']
    cmds:
      - go -C tools build -o ../.bin/ github.com/gzuidhof/tygo

  tools:go-licenses:
    run: once
    env: {CGO_ENABLED: '0'}
    sources: [tools/go.mod, tools/go.sum]
    generates: ['{{.GO_LICENSES}}']
    cmds:
      - go -C tools build -o ../.bin/ github.com/google/go-licenses/v2

  tools:govulncheck:
    run: once
    env: {CGO_ENABLED: '0'}
    sources: [tools/go.mod, tools/go.sum]
    generates: ['.bin/govulncheck{{exeExt}}']
    cmds:
      - go -C tools build -o ../.bin/ golang.org/x/vuln/cmd/govulncheck

  tools:shfmt:
    run: once
    env: {CGO_ENABLED: '0'}
    sources: [tools/go.mod, tools/go.sum]
    generates: ['{{.SHFMT}}']
    cmds:
      - go -C tools build -o ../.bin/ mvdan.cc/sh/v3/cmd/shfmt

  # ---------------------------------------------------------------------------------------------------------------
  # Development

  dev:
    desc: Run the server (127.0.0.1:8080) and Vite (:5173) together, then open http://localhost:5173
    deps: [dev:server, dev:web]

  dev:server:
    desc: Run the server in off mode with deploy/dev/isshoni.dev.toml (restart it by hand after Go changes)
    cmds:
      - cmd: "echo 'dev:server: skipped, cmd/isshoni does not exist yet'"
        silent: true
        if: '[ ! -d cmd/isshoni ]'
      - cmd: go run -ldflags "-X {{.VERSION_PKG}}.version={{.VERSION}}" ./cmd/isshoni serve --config deploy/dev/isshoni.dev.toml
        if: '[ -d cmd/isshoni ]'

  dev:web:
    desc: Run Vite on :5173; it proxies /api and /ws to the dev server
    env:
      ISSHONI_VERSION: '{{.VERSION}}'
    cmds:
      - cmd: "echo 'dev:web: skipped, web/package.json does not exist yet'"
        silent: true
        if: '[ ! -f web/package.json ]'
      - cmd: npm --prefix web run dev
        if: '[ -f web/package.json ]'

  dev:setup-url:
    desc: Print the first-run admin link of the dev server (run it while `task dev` runs)
    cmds:
      - cmd: "echo 'dev:setup-url: skipped, cmd/isshoni does not exist yet'"
        silent: true
        if: '[ ! -d cmd/isshoni ]'
      - cmd: go run ./cmd/isshoni setup-url --config deploy/dev/isshoni.dev.toml
        if: '[ -d cmd/isshoni ]'

  # ---------------------------------------------------------------------------------------------------------------
  # Code generation

  gen:
    desc: Generate the TypeScript protocol types (tygo, tygo.yaml) and the message registry into web/src/protocol/
    deps: [tools:tygo]
    cmds:
      - cmd: "echo 'gen: note: internal/protocol and internal/protocol/api do not both exist yet, skipping tygo'"
        silent: true
        if: '! [ -d internal/protocol ] || ! [ -d internal/protocol/api ]'
      - cmd: '{{.TYGO}} generate'
        if: '[ -d internal/protocol ] && [ -d internal/protocol/api ]'
      - cmd: "echo 'gen: note: internal/protocol/gen/tsregistry does not exist yet, skipping the registry'"
        silent: true
        if: '[ ! -d internal/protocol/gen/tsregistry ]'
      - cmd: go run ./internal/protocol/gen/tsregistry -o web/src/protocol/registry.gen.ts
        if: '[ -d internal/protocol/gen/tsregistry ]'

  gen:check:
    desc: >-
      Fail when web/src/protocol/*.gen.ts or web/src/platform/desktop/*.gen.ts differs from what `task gen` writes (the
      CI drift check)
    cmds:
      - task: gen
      # Only the generated files: uncommitted hand-written files next to them (signal-client.ts, rest.ts, ...) are
      # not drift. tygo.yaml's desktop entry writes web/src/platform/desktop/codes.gen.ts (docs/m2/06 §10.1).
      - cmd: |
          drift=$(git status --porcelain -- 'web/src/protocol/*.gen.ts' 'web/src/platform/desktop/*.gen.ts')
          if [ -n "$drift" ]; then
            echo "$drift"
            echo 'gen:check: the generated TypeScript (web/src/protocol/*.gen.ts, web/src/platform/desktop/*.gen.ts) is out of date: run "task gen" and commit the result' >&2
            exit 1
          fi
        silent: true

  gen:bindings:
    desc: >-
      Generate the TypeScript bindings of the desktop app's bound services into web/src/platform/desktop/bindings/
      (GOOS=windows wails3 generate bindings; run it after a change to the services and commit the result)
    cmds:
      - cmd: "echo 'gen:bindings: note: cmd/isshoni-desktop does not exist yet, nothing to generate'"
        silent: true
        if: '[ ! -d cmd/isshoni-desktop ]'
      - task: release:wails3
        if: '[ -d cmd/isshoni-desktop ]'
      # GOOS=windows: on Linux the generator would see only the stub main of docs/m2/06 D18, so no services. -clean
      # (the default) empties the folder first, so a removed method leaves no stale file behind.
      - cmd: GOOS=windows {{.WAILS3}} generate bindings -ts -silent -d web/src/platform/desktop/bindings ./cmd/isshoni-desktop
        if: '[ -d cmd/isshoni-desktop ]'

  gen:bindings:check:
    desc: Fail when web/src/platform/desktop/bindings/ differs from what `task gen:bindings` writes (the CI drift check)
    cmds:
      - task: gen:bindings
      - cmd: |
          drift=$(git status --porcelain -- web/src/platform/desktop/bindings)
          if [ -n "$drift" ]; then
            echo "$drift"
            echo 'gen:bindings:check: the bindings in web/src/platform/desktop/bindings/ are out of date: run "task gen:bindings" and commit the result' >&2
            exit 1
          fi
        silent: true
        if: '[ -d cmd/isshoni-desktop ]'

  # ---------------------------------------------------------------------------------------------------------------
  # Tests

  test:
    desc: Run every test suite (test:go, test:web, test:sh, test:ps); native:test is separate (it fetches vcpkg)
    cmds:
      - task: test:go
      - task: test:web
      - task: test:sh
      - task: test:ps

  test:go:
    desc: >-
      Run the Go tests with the race detector (it needs cgo) for the main module and tools/; `task test:go -- ARGS`
      passes ARGS to the main module's run (CI: -coverprofile=coverage.out -covermode=atomic)
    env:
      CGO_ENABLED: '1'
    vars:
      # Empty only while the main module has no packages. When go list itself fails, the real command runs and
      # prints go's error.
      GO_PKGS:
        sh: go list -e ./... 2>/dev/null || echo 'go list failed'
    cmds:
      - cmd: "echo 'test:go: note: the main module has no Go packages yet'"
        silent: true
        if: '{{if .GO_PKGS}}false{{else}}true{{end}}'
      - cmd: go test -race -count=1 -timeout 15m {{.CLI_ARGS}} ./...
        if: '{{if .GO_PKGS}}true{{else}}false{{end}}'
      - go -C tools test -race -count=1 -timeout 15m ./...

  test:web:
    desc: Run the web unit tests (Vitest, and Node's test runner for the license script's tests)
    cmds:
      - cmd: "echo 'test:web: skipped, web/package.json does not exist yet'"
        silent: true
        if: '[ ! -f web/package.json ]'
      - cmd: npm --prefix web test -- --run
        if: '[ -f web/package.json ]'
      # Vitest covers src/ and build/ only; CI runs this file in its licenses job.
      - cmd: cd web && node --test scripts/licenses.test.mjs
        if: '[ -f web/scripts/licenses.test.mjs ]'

  test:sh:
    desc: >-
      Run the install.sh unit tests under dash, bash --posix and busybox sh (outside CI, a missing shell is skipped),
      check that deploy/test/vm/vm-test.sh still finds what it takes from distro-test.sh (`vm-test.sh -h`), and run
      the tests of release.yml's draft check (deploy/test/check-draft-test.sh) under dash and bash --posix
    cmds:
      - cmd: "echo 'test:sh: skipped, deploy/test/install_unit.sh does not exist yet'"
        silent: true
        if: '[ ! -f deploy/test/install_unit.sh ]'
      # A shell that is not installed (macOS has no busybox, Fedora no dash) is skipped with a note. In CI, where
      # the lint-deploy job installs busybox, a missing shell fails the task.
      - cmd: |
          for shell in dash 'bash --posix' 'busybox sh'; do
            cmd=${shell%% *}
            if ! command -v "$cmd" >/dev/null 2>&1; then
              if [ -n "${CI:-}" ]; then
                echo "test:sh: $cmd is not installed" >&2
                exit 1
              fi
              echo "test:sh: skipped $shell (not installed here; CI runs it)"
              continue
            fi
            echo "test:sh: $shell deploy/test/install_unit.sh"
            $shell deploy/test/install_unit.sh
            # The VM harness sources distro-test.sh and checks first that every name it takes is still there: a
            # rename there fails here, not only in the nightly (06 §4.13). It needs no VM, Linux or network.
            if [ -f deploy/test/vm/vm-test.sh ]; then
              echo "test:sh: $shell deploy/test/vm/vm-test.sh -h"
              $shell deploy/test/vm/vm-test.sh -h > /dev/null
            fi
            # release.yml's publish runs deploy/release/check-draft.sh with the runner's sh (dash); its test runs it
            # under the same shell as itself (06 §9.3). Not under busybox: busybox's own sha256sum, which a busybox
            # shell may run in place of the system's, has no --strict.
            if [ "$cmd" != busybox ] && [ -f deploy/test/check-draft-test.sh ]; then
              echo "test:sh: $shell deploy/test/check-draft-test.sh"
              CHECK_DRAFT_SHELL=$shell $shell deploy/test/check-draft-test.sh
            fi
          done
        silent: true
        if: '[ -f deploy/test/install_unit.sh ]'

  test:ps:
    desc: >-
      Run the Pester tests of install-desktop.ps1 under pwsh (deploy/test/install-desktop.Tests.ps1; Windows
      PowerShell 5.1 runs them in CI's windows-desktop job)
    cmds:
      - cmd: "echo 'test:ps: note: not implemented yet; README WA49 adds it with deploy/install-desktop.ps1 (docs/m2/06 §16). Nothing was run.'"
        silent: true

  # ---------------------------------------------------------------------------------------------------------------
  # Linters

  lint:
    desc: >-
      Run every linter (lint:go, lint:web, lint:sh, lint:actions, lint:keys, lint:pins, lint:unit, lint:native,
      lint:ps)
    cmds:
      - task: lint:go
      - task: lint:web
      - task: lint:sh
      - task: lint:actions
      - task: lint:keys
      - task: lint:pins
      - task: lint:unit
      - task: lint:native
      - task: lint:ps

  lint:go:
    desc: >-
      golangci-lint (also with GOOS=windows), go mod tidy -diff, go vet for GOOS darwin and windows, and the
      cross-builds of lint:go:cross (the main module; golangci-lint, vet (also with GOOS=windows) and tidy for tools/
      too)
    deps: [tools:golangci-lint]
    vars:
      # As in test:go: empty only while the main module has no packages.
      GO_PKGS:
        sh: go list -e ./... 2>/dev/null || echo 'go list failed'
    cmds:
      - cmd: "echo 'lint:go: note: the main module has no Go packages yet, skipping golangci-lint, go vet and the cross-builds for it'"
        silent: true
        if: '{{if .GO_PKGS}}false{{else}}true{{end}}'
      - cmd: '{{.GOLANGCI_LINT}} run'
        if: '{{if .GO_PKGS}}true{{else}}false{{end}}'
      # The Windows-only files (the x/sys/windows loader of internal/media/native, the updater's apply_windows.go,
      # the app's winos) are linted only with GOOS=windows (docs/m2/06 §10.1).
      - cmd: GOOS=windows {{.GOLANGCI_LINT}} run
        if: '{{if .GO_PKGS}}true{{else}}false{{end}}'
      - cmd: GOOS=darwin go vet ./...
        if: '{{if .GO_PKGS}}true{{else}}false{{end}}'
      - cmd: GOOS=windows go vet ./...
        if: '{{if .GO_PKGS}}true{{else}}false{{end}}'
      - task: lint:go:cross
        if: '{{if .GO_PKGS}}true{{else}}false{{end}}'
      - go mod tidy -diff
      - cd tools && ../{{.GOLANGCI_LINT}} run ./...
      - go -C tools vet ./...
      # tools/ has Windows-only files too (g2g's GDI capture, docs/m2/01 §12.2).
      - GOOS=windows go -C tools vet ./...
      - go -C tools mod tidy -diff

  lint:go:cross:
    desc: >-
      Cross-builds without cgo: GOOS=windows go build ./internal/... ./cmd/... (the Windows app needs no cgo), and the
      gomobile check, package builds of ./internal/client/... and ./internal/media for android and ios on arm64
    env:
      CGO_ENABLED: '0'
    vars:
      # ./internal/media joins once its root package exists (README WA02); a directory without Go files would fail
      # go build. Only shell builtins, so this works in Task's shell on Windows too.
      MOBILE_PKGS:
        sh: |
          pkgs=./internal/client/...
          for f in internal/media/*.go; do
            case $f in
            *_test.go) ;;
            *) if [ -f "$f" ]; then pkgs="$pkgs ./internal/media"; break; fi ;;
            esac
          done
          echo "$pkgs"
    cmds:
      # docs/m1/01 §14 and docs/m2/06 §10.1: whatever the app links must stay buildable for Windows from any host.
      - GOOS=windows GOARCH=amd64 go build ./internal/... ./cmd/...
      # The gomobile check of docs/m2/01 §4: package builds only (no linking), so no mobile toolchain is needed.
      - for: [android, ios]
        cmd: GOOS={{.ITEM}} GOARCH=arm64 go build {{.MOBILE_PKGS}}

  lint:web:
    desc: Lint and type-check the web app
    cmds:
      - cmd: "echo 'lint:web: skipped, web/package.json does not exist yet'"
        silent: true
        if: '[ ! -f web/package.json ]'
      - cmd: npm --prefix web run lint
        if: '[ -f web/package.json ]'
      - cmd: npm --prefix web run typecheck
        if: '[ -f web/package.json ]'

  lint:sh:
    desc: Check the shell scripts under deploy/ with shellcheck (POSIX sh) and shfmt (.bin/shfmt)
    deps: [tools:shfmt]
    cmds:
      - cmd: |
          set -- deploy/**/*.sh
          if [ $# -eq 0 ]; then
            echo 'lint:sh: skipped, there are no shell scripts under deploy/ yet'
            exit 0
          fi
          # ShellCheck is not a Go program, so it comes from mise or a package manager, not from tools/go.mod.
          command -v shellcheck >/dev/null || { echo 'lint:sh: shellcheck is not installed: run "mise install" or install ShellCheck (see .tool-versions)' >&2; exit 1; }
          echo "lint:sh: shellcheck --shell=sh and shfmt -p -i 2 -d over $# scripts"
          status=0
          shellcheck --shell=sh "$@" || status=1
          {{.SHFMT}} -p -i 2 -d "$@" || status=1
          exit $status
        silent: true
        shopt: [globstar, nullglob]

  lint:actions:
    desc: Check the GitHub Actions workflows with actionlint
    cmds:
      - cmd: "echo 'lint:actions: skipped, .github/workflows does not exist yet'"
        silent: true
        if: '[ ! -d .github/workflows ]'
      # actionlint comes from mise or a package manager (tools/go.mod says why it is not built into .bin/).
      - cmd: |
          command -v actionlint >/dev/null || { echo 'lint:actions: actionlint is not installed: run "mise install" or install actionlint (see .tool-versions)' >&2; exit 1; }
          echo 'lint:actions: actionlint over .github/workflows'
          actionlint
        silent: true
        if: '[ -d .github/workflows ]'

  lint:keys:
    desc: >-
      Check that the key block embedded in deploy/install.sh equals deploy/keys/allowed_signers, and that README.md's
      "Release signing keys" section lists the fingerprint of each key in it and no other one
    cmds:
      - go -C tools run ./repocheck -root .. keys

  lint:pins:
    desc: >-
      Check that .tool-versions, the go.mod toolchain and the versions of tools/go.mod, tools/goreleaser/go.mod and
      tools/wails3/go.mod agree, and that Wails is one version in go.mod, tools/wails3/go.mod and (exactly, without the
      "v") @wailsio/runtime in web/package.json and web/package-lock.json
    cmds:
      - go -C tools run ./repocheck -root .. pins

  lint:native:
    desc: >-
      Check the format of the C and C++ files under native/ with clang-format --dry-run --Werror and
      native/.clang-format (CLANG_FORMAT=<binary> picks the binary; outside CI a missing clang-format is skipped)
    vars:
      CLANG_FORMAT: '{{.CLANG_FORMAT | default "clang-format"}}'
    cmds:
      - cmd: "echo 'lint:native: note: native/.clang-format does not exist yet, nothing to check'"
        silent: true
        if: '[ ! -f native/.clang-format ]'
      # Tracked files only: build trees under native/ (CMake's compiler-id sources, vcpkg_installed/) are not ours.
      # clang-format takes the nearest .clang-format above each file, which is native/.clang-format.
      - cmd: |
          cf='{{.CLANG_FORMAT}}'
          if ! command -v "$cf" >/dev/null 2>&1; then
            if [ -n "${CI:-}" ]; then
              echo "lint:native: $cf is not installed" >&2
              exit 1
            fi
            echo "lint:native: skipped, $cf is not installed here (CI runs clang-format-18; CLANG_FORMAT=<binary> picks another one, on a Mac with Xcode CLANG_FORMAT=\$(xcrun --find clang-format))"
            exit 0
          fi
          set -- $(git ls-files -- 'native/*.h' 'native/*.c' 'native/*.cpp')
          if [ $# -eq 0 ]; then
            echo 'lint:native: note: there are no C or C++ files under native/ yet'
            exit 0
          fi
          echo "lint:native: $("$cf" --version) --dry-run --Werror over $# files"
          "$cf" --dry-run --Werror --style=file "$@"
        silent: true
        if: '[ -f native/.clang-format ]'

  lint:ps:
    desc: >-
      PSScriptAnalyzer (Warning and Error) and the ASCII check over deploy/install-desktop.ps1, deploy/test/windows/*.ps1,
      deploy/windows/msvc-env.ps1 and native/windows/tools/*.ps1
    cmds:
      - cmd: "echo 'lint:ps: note: not implemented yet; README WA49 adds it with deploy/install-desktop.ps1 (docs/m2/06 §10.1). Nothing was checked.'"
        silent: true

  lint:unit:
    desc: Verify the systemd unit with systemd-analyze (Linux only; skipped elsewhere)
    cmds:
      - cmd: "echo 'lint:unit: skipped, systemd-analyze runs on Linux only'"
        silent: true
        if: '{{if eq OS "linux"}}false{{else}}true{{end}}'
      - cmd: "echo 'lint:unit: skipped, deploy/systemd/isshoni.service does not exist yet'"
        silent: true
        if: '{{if eq OS "linux"}}[ ! -f deploy/systemd/isshoni.service ]{{else}}false{{end}}'
      - cmd: |
          # ExecStart=isshoni is resolved in systemd's fixed search path when the unit loads, so verify rejects the
          # unit on a machine where isshoni is not installed. Verify a copy that starts it through /usr/bin/env.
          # verify only warns about values it ignores ("Failed to parse ..., ignoring"): any message about the
          # unit fails the check as well.
          dir=$(mktemp -d)
          sed 's|^ExecStart=isshoni |ExecStart=/usr/bin/env isshoni |' deploy/systemd/isshoni.service > "$dir/isshoni.service"
          echo 'lint:unit: systemd-analyze verify deploy/systemd/isshoni.service'
          status=0
          out=$(systemd-analyze verify "$dir/isshoni.service" 2>&1) || status=$?
          rm -rf "$dir"
          if [ -n "$out" ]; then
            printf '%s\n' "$out" | sed "s|$dir/|deploy/systemd/|g"
            case $out in *isshoni.service*) [ "$status" -ne 0 ] || status=1 ;; esac
          fi
          exit $status
        silent: true
        if: '{{if eq OS "linux"}}[ -f deploy/systemd/isshoni.service ]{{else}}false{{end}}'

  # ---------------------------------------------------------------------------------------------------------------
  # Build

  build:
    desc: Build the web app, then the server binary, both stamped with the same VERSION
    cmds:
      - task: build:web
        vars: {VERSION: '{{.VERSION}}'}
      - task: build:go
        vars: {VERSION: '{{.VERSION}}'}

  build:web:
    desc: Build the web app into web/dist/ (a no-op when nothing changed and web/dist is for this VERSION)
    env:
      ISSHONI_VERSION: '{{.VERSION}}'
    sources:
      - web/package.json
      - web/package-lock.json
      - web/index.html
      - web/*.config.*
      - web/tsconfig*.json
      - web/licenses.overrides.json
      - web/src/**/*
      - web/public/**/*
      - web/build/**/*
      - web/scripts/**/*
    generates:
      - web/dist/index.html
      - web/dist/version.json
    status:
      - test "$(node -p "require('./web/dist/version.json').version")" = '{{.VERSION}}'
    cmds:
      - cmd: "echo 'build:web: skipped, web/package.json does not exist yet'"
        silent: true
        if: '[ ! -f web/package.json ]'
      - cmd: npm --prefix web run build
        if: '[ -f web/package.json ]'

  build:go:
    desc: Build bin/isshoni (CGO_ENABLED=0, no Node needed) with the web app of web/dist/ embedded
    preconditions:
      - sh: '[ -f web/dist/index.html ]'
        msg: >-
          web/dist/index.html is missing, and the binary embeds the web app from web/dist/.
          Run "task build:web" first, or "task build" for both (CI downloads the web job's artifact).
    env:
      CGO_ENABLED: '0'
    cmds:
      - cmd: "echo 'build:go: skipped, cmd/isshoni does not exist yet'"
        silent: true
        if: '[ ! -d cmd/isshoni ]'
      - cmd: >-
          go build -trimpath
          -ldflags "-s -w
          -X {{.VERSION_PKG}}.version={{.VERSION}}
          -X {{.VERSION_PKG}}.commit=$(git rev-parse HEAD)
          -X {{.VERSION_PKG}}.date=$(TZ=UTC0 git log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd)"
          -o bin/isshoni{{exeExt}} ./cmd/isshoni
        if: '[ -d cmd/isshoni ]'

  e2e:
    desc: Build with a non-dev version (0.0.0-e2e.local unless ISSHONI_VERSION is set), then run the Playwright tests
    vars:
      E2E_VERSION: '{{.ISSHONI_VERSION | default "0.0.0-e2e.local"}}'
    env:
      ISSHONI_BIN: '{{.ROOT_DIR}}/bin/isshoni{{exeExt}}'
    cmds:
      - cmd: "echo 'e2e: skipped, web/playwright.config.ts does not exist yet'"
        silent: true
        if: '[ ! -f web/playwright.config.ts ]'
      - task: build
        vars: {VERSION: '{{.E2E_VERSION}}'}
        if: '[ -f web/playwright.config.ts ]'
      - cmd: npm --prefix web run e2e
        if: '[ -f web/playwright.config.ts ]'

  # ---------------------------------------------------------------------------------------------------------------
  # Desktop app (docs/m2/03-desktop-app.md, docs/m2/06-windows-release.md §5.2-§5.4)

  desktop:dev:
    desc: Run the desktop app on this machine with the fake engine and Vite's live reload (docs/m2/03 D3)
    # macOS only (the dev build of 03 D3; Windows builds with desktop:exe:windows). A -tags dev build of
    # cmd/isshoni-desktop whose asset handler takes the SPA from Vite on :5173 (ISSHONI_DESKTOP_DEV_URL, 03 §5.3):
    # edits in web/src show in the window at once. A Vite already running on :5173 (task dev:web) is used as it is;
    # otherwise this starts one and stops it when the app quits. The engine is the fake from README WA41 on.
    # Task's own shell gives a background job no real PID, so the script runs in sh. cgo on a Mac whose Command Line
    # Tools are older than the SDK needs SDKROOT (CONTRIBUTING.md).
    env:
      ISSHONI_VERSION: '{{.VERSION}}'
      DESKTOP_DEV_SH: |
        set -eu
        vite=http://localhost:5173
        up() { curl -fsS -o /dev/null --max-time 2 "$vite/@vite/client" 2>/dev/null; }
        if up; then
          echo "desktop:dev: using the Vite dev server already on $vite"
        else
          (cd web && exec node node_modules/vite/bin/vite.js --clearScreen false) &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT INT TERM
          n=0
          until up; do
            n=$((n + 1))
            if [ "$n" -gt 120 ] || ! kill -0 "$pid" 2>/dev/null; then
              echo "desktop:dev: Vite did not start on $vite" >&2
              exit 1
            fi
            sleep 0.5
          done
        fi
        ISSHONI_DESKTOP_DEV_URL=$vite go run -tags dev -ldflags "-X $VERSION_PKG.version=$ISSHONI_VERSION" ./cmd/isshoni-desktop "$@"
      VERSION_PKG: '{{.VERSION_PKG}}'
    cmds:
      - cmd: "echo 'desktop:dev: note: the dev build runs on macOS; on Windows build the app with task desktop:exe:windows. Nothing was started.'"
        silent: true
        if: '{{if eq OS "darwin"}}false{{else}}true{{end}}'
      - cmd: "echo 'desktop:dev: note: web/node_modules is missing; run task setup first.' >&2; exit 1"
        silent: true
        if: '{{if eq OS "darwin"}}[ ! -d web/node_modules/vite ]{{else}}false{{end}}'
      - cmd: sh -c "$DESKTOP_DEV_SH" desktop-dev {{.CLI_ARGS}}
        if: '{{if eq OS "darwin"}}[ -d web/node_modules/vite ]{{else}}false{{end}}'

  desktop:exe:windows:
    desc: >-
      Cross-build isshoni.exe (GOOS=windows, no cgo) into dist-desktop/windows_amd64/, stamped with VERSION; TAGS
      defaults to production, and other tags build into dist-desktop/windows_amd64-test/ (docs/m2/06 §5.2)
    # 06 §5.2 steps 1 and 2 (README WA67 adds step 3's checks): the exe's resources (icon, manifest, version info),
    # then the cross-build, then a check that the exe carries app.manifest unchanged. The resources come from
    # cmd/isshoni-desktop/build/windows/syso.go, built in the tools/wails3 module (its graph pins tc-hib/winres for
    # wails3's own syso step), not from `wails3 generate syso`: that one parses the manifest and writes it back
    # without <activeCodePage> and with a System instead of a PerMonitor DPI fallback. The .syso exists only during
    # the build and is git-ignored (cmd/isshoni-desktop/.gitignore), so the exe's vcs.modified stays false on a clean
    # checkout. The version resource's four-part number follows 06 §5.3 (WA67 moves it to tools/desktoppkg winver).
    preconditions:
      - sh: '[ -f web/dist/index.html ]'
        msg: >-
          web/dist/index.html is missing, and isshoni.exe embeds the web app from web/dist/.
          Run "task build:web" first (CI downloads the web job's artifact).
    vars:
      TAGS: '{{.TAGS | default "production"}}'
      OUT: '{{if eq .TAGS "production"}}dist-desktop/windows_amd64{{else}}dist-desktop/windows_amd64-test{{end}}'
      SYSO: cmd/isshoni-desktop/rsrc_windows_amd64.syso
      MANIFEST: cmd/isshoni-desktop/build/windows/app.manifest
      SYSO_TOOL: 'dist-desktop/.build/syso{{exeExt}}'
    cmds:
      - cmd: |
          set -e
          v='{{.VERSION}}'
          bad() { echo "desktop:exe:windows: VERSION $v is not X.Y.Z[-pre][+build]" >&2; exit 1; }
          case $v in *-|*-+*|*+|*-.*|*.) bad ;; esac
          core=${v%%+*}
          pre=
          case $core in *-*) pre=${core#*-}; core=${core%%-*} ;; esac
          x=${core%%.*}; rest=${core#*.}
          case $rest in *.*) ;; *) bad ;; esac
          y=${rest%%.*}; z=${rest#*.}
          for n in "$x" "$y" "$z"; do
            case $n in ''|*[!0-9]*) bad ;; esac
            if [ "$n" -gt 65535 ]; then echo "desktop:exe:windows: VERSION $v has a part above 65535" >&2; exit 1; fi
          done
          w=65000
          if [ -n "$pre" ]; then
            last=${pre##*.}
            case $last in ''|*[!0-9]*) w=0 ;; *) w=$((last % 65000)) ;; esac
          fi
          winver="$x.$y.$z.$w"
          mkdir -p dist-desktop/.build '{{.OUT}}'
          cat > dist-desktop/.build/info.json <<EOF
          {"fixed": {"file_version": "$winver", "product_version": "$winver"},
           "info": {"0000": {"ProductVersion": "$v", "FileVersion": "$winver", "ProductName": "isshoni",
            "FileDescription": "isshoni", "CompanyName": "isshoni project",
            "LegalCopyright": "Copyright the isshoni authors. Apache-2.0.", "OriginalFilename": "isshoni.exe",
            "InternalName": "isshoni"}}}
          EOF
          CGO_ENABLED=0 go build -C tools/wails3 -o '../../{{.SYSO_TOOL}}' ../../cmd/isshoni-desktop/build/windows/syso.go
          '{{.SYSO_TOOL}}' -arch amd64 -icon cmd/isshoni-desktop/build/windows/icon.ico -manifest '{{.MANIFEST}}' \
            -info dist-desktop/.build/info.json -out '{{.SYSO}}'
          commit=$(git rev-parse HEAD)
          date=$(TZ=UTC0 git log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd)
          ldflags="-s -w -H windowsgui -X {{.VERSION_PKG}}.version=$v -X {{.VERSION_PKG}}.commit=$commit"
          ldflags="$ldflags -X {{.VERSION_PKG}}.date=$date"
          status=0
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -tags '{{.TAGS}}' -ldflags "$ldflags" \
            -o '{{.OUT}}/isshoni.exe' ./cmd/isshoni-desktop || status=$?
          rm -f '{{.SYSO}}'
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          '{{.SYSO_TOOL}}' -check '{{.OUT}}/isshoni.exe' -manifest '{{.MANIFEST}}'
          echo "desktop:exe:windows: {{.OUT}}/isshoni.exe ($v, file version $winver, tags {{.TAGS}})"

  desktop:build:e2e:
    desc: Build the e2e isshoni.exe for the CDP spec (desktop:exe:windows TAGS=e2e; never shipped, docs/m2/03 §22.4)
    cmds:
      - task: desktop:exe:windows
        vars: {TAGS: e2e, VERSION: '{{.VERSION}}'}

  desktop:package:windows:
    desc: >-
      Build the NSIS installer from dist-desktop/ and the engine DLLs in NATIVE_DIR (on the Mac with Homebrew's
      makensis and a plain WriteUninstaller; never released, docs/m2/06 §5.4, §6)
    cmds:
      - cmd: "echo 'desktop:package:windows: note: not implemented yet; README WA67 adds it with deploy/windows/nsis/. Nothing was built.'"
        silent: true

  # ---------------------------------------------------------------------------------------------------------------
  # Native engine and FFmpeg (docs/m2/04-windows-engine.md §13, docs/m2/06-windows-release.md §4, §5.1, §17)
  #
  # Fetched dependencies (vcpkg, the FFmpeg zip, the FFmpeg build's sources) live in .deps/, which these tasks keep
  # out of git with a .deps/.gitignore of their own. Delete .deps/ to fetch them again.

  native:test:
    desc: >-
      Build and test native/common on macOS or Linux - vcpkg at native/vcpkg.json's baseline in .deps/vcpkg
      (VCPKG_DIR=<dir> elsewhere), then CMake preset host-debug (PRESET=host-tsan, host-asan for the sanitizers)
    vars:
      PRESET: '{{.PRESET | default "host-debug"}}'
      VCPKG_DIR: '{{.VCPKG_DIR | default (print .ROOT_DIR "/.deps/vcpkg")}}'
    env:
      VCPKG_DISABLE_METRICS: '1'
    cmds:
      - cmd: "echo 'native:test: skipped, the host presets build on macOS and Linux; on Windows run task native:build'"
        silent: true
        if: '{{if eq OS "windows"}}true{{else}}false{{end}}'
      - cmd: "echo 'native:test: note: native/CMakePresets.json and native/vcpkg.json do not both exist yet, nothing to build'"
        silent: true
        if: '{{if eq OS "windows"}}false{{else}}! [ -f native/CMakePresets.json ] || ! [ -f native/vcpkg.json ]{{end}}'
      - cmd: |
          set -eu
          die() {
            printf 'native:test: %s\n' "$@" >&2
            exit 1
          }
          preset='{{.PRESET}}'
          case $preset in
          host-*) ;;
          *) die "PRESET=$preset is not a host preset (host-debug, host-tsan, host-asan): this task builds native/common only" ;;
          esac
          # The vcpkg commit that native/vcpkg.json's builtin-baseline names (docs/m2/04 §13.1).
          baseline=$(sed -n 's/.*"builtin-baseline"[[:space:]]*:[[:space:]]*"\([0-9a-f]\{40\}\)".*/\1/p' native/vcpkg.json)
          [ -n "$baseline" ] || die 'native/vcpkg.json has no "builtin-baseline" with a 40-hex vcpkg commit'
          deps() {
            mkdir -p .deps
            [ -f .deps/.gitignore ] || printf '%s\n' '# Fetched by the native and ffmpeg tasks (Taskfile.yml).' '*' >.deps/.gitignore
          }
          dir='{{.VCPKG_DIR}}'
          # A relative VCPKG_DIR is the repository's: the presets read $VCPKG_ROOT from native/ and its build tree.
          case $dir in
          /*) ;;
          *) dir='{{.ROOT_DIR}}'/${dir#./} ;;
          esac
          case $dir in '{{.ROOT_DIR}}/.deps/'*) deps ;; esac
          # vcpkg's binary packages go to .deps/ too, not to ~/.cache/vcpkg, unless the caller chose a binary cache
          # (CI's native-host does).
          if [ -z "${VCPKG_BINARY_SOURCES:-}" ] && [ -z "${VCPKG_DEFAULT_BINARY_CACHE:-}" ]; then
            deps
            mkdir -p .deps/vcpkg-cache
            export VCPKG_DEFAULT_BINARY_CACHE='{{.ROOT_DIR}}/.deps/vcpkg-cache'
          fi
          # A shallow fetch of exactly the baseline: vcpkg resolves every port at that commit, whose trees are in it.
          if [ "$(git -C "$dir" rev-parse -q --verify HEAD 2>/dev/null || :)" != "$baseline" ]; then
            echo "native:test: fetching vcpkg $baseline into $dir"
            if [ ! -d "$dir/.git" ]; then
              mkdir -p "$dir"
              git -C "$dir" init -q
              git -C "$dir" remote add origin https://github.com/microsoft/vcpkg.git
            fi
            git -C "$dir" fetch -q --depth 1 origin "$baseline"
            git -C "$dir" checkout -q --detach FETCH_HEAD
            # The vcpkg tool is pinned by the checkout (scripts/vcpkg-tool-metadata.txt): fetch it again.
            rm -f "$dir/vcpkg"
          fi
          if [ ! -x "$dir/vcpkg" ]; then
            # Downloads the vcpkg tool release that the checkout pins and checks its SHA-512.
            "$dir/bootstrap-vcpkg.sh" -disableMetrics
          fi
          # CMake 3.28 or newer and Ninja (the presets' generator): the ones on PATH, else the copies vcpkg pins and
          # verifies by SHA-512 (vcpkg fetch), so no global install is needed.
          if command -v cmake >/dev/null 2>&1; then cmake=$(command -v cmake); else cmake=$("$dir/vcpkg" fetch cmake | tail -n 1); fi
          if command -v ninja >/dev/null 2>&1; then ninja=$(command -v ninja); else ninja=$("$dir/vcpkg" fetch ninja | tail -n 1); fi
          [ -x "$cmake" ] || die "no cmake: vcpkg fetch cmake gave '$cmake'"
          [ -x "$ninja" ] || die "no ninja: vcpkg fetch ninja gave '$ninja'"
          ctest=$(dirname "$cmake")/ctest
          echo "native:test: $preset with vcpkg $baseline, $("$cmake" --version | sed -n 1p), ninja $("$ninja" --version)"
          export VCPKG_ROOT="$dir"
          export PATH="$(dirname "$ninja"):$PATH"
          cd native
          "$cmake" --preset "$preset" -DCMAKE_MAKE_PROGRAM="$ninja"
          "$cmake" --build --preset "$preset"
          "$ctest" --preset "$preset" --output-on-failure
        silent: true
        if: '{{if eq OS "windows"}}false{{else}}[ -f native/CMakePresets.json ] && [ -f native/vcpkg.json ]{{end}}'

  native:build:
    desc: >-
      Build isshoni-media.dll on a Windows PC - the MSVC environment of deploy/windows/msvc-env.ps1, vcpkg at
      native/vcpkg.json's baseline in .deps/vcpkg (VCPKG_DIR=<dir> elsewhere), then presets win-x64-release and
      win-x64-ci (PRESETS=<names>; TEST=true also runs their ctest) with IM_FFMPEG_ROOT = the ffmpeg:fetch output in
      .deps/ffmpeg/ when it is there (FFMPEG_ROOT=<dir> picks another)
    vars:
      PRESETS: '{{.PRESETS | default "win-x64-release win-x64-ci"}}'
      TEST: '{{.TEST | default "false"}}'
    env:
      VCPKG_DISABLE_METRICS: '1'
      ISSHONI_NATIVE_PRESETS: '{{.PRESETS}}'
      ISSHONI_NATIVE_TEST: '{{.TEST}}'
      # In Windows PowerShell 5.1 (every Windows 10 and 11 has it), as ffmpeg:build: vcpkg fetched at the
      # baseline (shallow) and bootstrapped, its binary packages in .deps/vcpkg-cache unless VCPKG_BINARY_SOURCES
      # or VCPKG_DEFAULT_BINARY_CACHE is set; the MSVC environment step (docs/m2/06 section 3), run as a script so
      # its variables are this process's; CMake and Ninja from PATH (Visual Studio's, once the step ran) or the
      # copies vcpkg pins; then each preset. Native programs run with ErrorActionPreference Continue and their exit
      # codes decide: Windows PowerShell 5.1 can turn a native program's stderr into errors under 'Stop'.
      ISSHONI_NATIVE_BUILD_PS1: |
        $ErrorActionPreference = 'Stop'
        Set-StrictMode -Version 3.0
        $root = (Get-Location).Path
        function Invoke-Native([string]$What, [string]$Exe, [string[]]$Arguments) {
          $ErrorActionPreference = 'Continue'
          & $Exe @Arguments
          if ($LASTEXITCODE -ne 0) { throw "native:build: $What failed (exit code $LASTEXITCODE)" }
        }
        $deps = Join-Path $root '.deps'
        New-Item -ItemType Directory -Force -Path $deps | Out-Null
        $ignore = Join-Path $deps '.gitignore'
        if (-not (Test-Path -LiteralPath $ignore)) {
          Set-Content -LiteralPath $ignore -Encoding Ascii -Value @('# Fetched by the native and ffmpeg tasks (Taskfile.yml).', '*')
        }

        $baseline = [string](Get-Content -Raw -Path (Join-Path $root 'native\vcpkg.json') | ConvertFrom-Json).'builtin-baseline'
        if ($baseline -notmatch '^[0-9a-f]{40}$') { throw 'native:build: native/vcpkg.json has no 40-hex builtin-baseline' }
        $vcpkg = Join-Path $deps 'vcpkg'
        if ($env:VCPKG_DIR) { $vcpkg = [IO.Path]::GetFullPath((Join-Path $root $env:VCPKG_DIR)) }
        $head = ''
        if (Test-Path -LiteralPath (Join-Path $vcpkg '.git')) {
          $ErrorActionPreference = 'Continue'
          $head = [string](& git -C $vcpkg rev-parse -q --verify HEAD 2>$null)
          $ErrorActionPreference = 'Stop'
        }
        if ($head.Trim() -ne $baseline) {
          Write-Host "native:build: fetching vcpkg $baseline into $vcpkg"
          if (-not (Test-Path -LiteralPath (Join-Path $vcpkg '.git'))) {
            New-Item -ItemType Directory -Force -Path $vcpkg | Out-Null
            Invoke-Native 'git init' 'git' @('-C', $vcpkg, 'init', '-q')
            Invoke-Native 'git remote add' 'git' @('-C', $vcpkg, 'remote', 'add', 'origin', 'https://github.com/microsoft/vcpkg.git')
          }
          Invoke-Native 'git fetch' 'git' @('-C', $vcpkg, 'fetch', '-q', '--depth', '1', 'origin', $baseline)
          Invoke-Native 'git checkout' 'git' @('-C', $vcpkg, 'checkout', '-q', '--detach', 'FETCH_HEAD')
          # The vcpkg tool is pinned by the checkout: fetch it again.
          Remove-Item -LiteralPath (Join-Path $vcpkg 'vcpkg.exe') -Force -ErrorAction SilentlyContinue
        }
        if (-not (Test-Path -LiteralPath (Join-Path $vcpkg 'vcpkg.exe'))) {
          Invoke-Native 'bootstrap-vcpkg.bat' (Join-Path $vcpkg 'bootstrap-vcpkg.bat') @('-disableMetrics')
        }
        $env:VCPKG_ROOT = $vcpkg
        if (-not $env:VCPKG_BINARY_SOURCES -and -not $env:VCPKG_DEFAULT_BINARY_CACHE) {
          $cache = Join-Path $deps 'vcpkg-cache'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE = $cache
        }

        $global:LASTEXITCODE = 0
        & (Join-Path $root 'deploy\windows\msvc-env.ps1')
        if ($LASTEXITCODE -ne 0) { throw "native:build: deploy/windows/msvc-env.ps1 failed (exit code $LASTEXITCODE)" }

        $tools = @{}
        foreach ($tool in 'cmake', 'ninja') {
          $cmd = Get-Command $tool -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($cmd) {
            $tools[$tool] = $cmd.Source
          } else {
            $ErrorActionPreference = 'Continue'
            $fetched = [string](& (Join-Path $vcpkg 'vcpkg.exe') fetch $tool | Select-Object -Last 1)
            $ErrorActionPreference = 'Stop'
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $fetched.Trim())) { throw "native:build: vcpkg fetch $tool failed" }
            $tools[$tool] = $fetched.Trim()
          }
        }
        $ctest = Join-Path (Split-Path -Parent $tools['cmake']) 'ctest.exe'

        $ffmpeg = ''
        if ($env:FFMPEG_ROOT) {
          $ffmpeg = [IO.Path]::GetFullPath((Join-Path $root $env:FFMPEG_ROOT))
        } else {
          $found = @(Get-ChildItem -Path (Join-Path $deps 'ffmpeg') -Directory -Filter '*-win-x64' -ErrorAction SilentlyContinue |
            Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName 'include\libavcodec\avcodec.h') } |
            Sort-Object Name)
          if ($found.Count -gt 0) { $ffmpeg = $found[-1].FullName }
        }
        if ($ffmpeg) {
          Write-Host "native:build: IM_FFMPEG_ROOT=$ffmpeg"
        } else {
          Write-Host 'native:build: no FFmpeg build in .deps/ffmpeg (task ffmpeg:fetch): building without IM_FFMPEG_ROOT'
        }

        Push-Location (Join-Path $root 'native')
        try {
          foreach ($preset in ($env:ISSHONI_NATIVE_PRESETS -split '\s+' | Where-Object { $_ })) {
            if ($preset -notmatch '^win-x64-') { throw "native:build: PRESETS: $preset is not a Windows preset (win-x64-*)" }
            $configure = @('--preset', $preset, "-DCMAKE_MAKE_PROGRAM=$($tools['ninja'])")
            if ($ffmpeg) { $configure += "-DIM_FFMPEG_ROOT=$ffmpeg" }
            Invoke-Native "cmake --preset $preset" $tools['cmake'] $configure
            Invoke-Native "cmake --build --preset $preset" $tools['cmake'] @('--build', '--preset', $preset)
            if ($env:ISSHONI_NATIVE_TEST -eq 'true' -and $preset -ne 'win-x64-release') {
              Invoke-Native "ctest --preset $preset" $ctest @('--preset', $preset, '--output-on-failure')
            }
            Write-Host "native:build: $(Join-Path $root "native\build\$preset\windows\isshoni-media.dll")"
          }
        } finally {
          Pop-Location
        }
    cmds:
      - cmd: "echo 'native:build: skipped, isshoni-media.dll builds with MSVC on Windows only (on macOS and Linux, task native:test builds native/common)'"
        silent: true
        if: '{{if eq OS "windows"}}false{{else}}true{{end}}'
      - cmd: "echo 'native:build: note: native/windows/CMakeLists.txt or deploy/windows/msvc-env.ps1 does not exist yet, nothing to build'"
        silent: true
        if: '{{if eq OS "windows"}}! [ -f native/windows/CMakeLists.txt ] || ! [ -f deploy/windows/msvc-env.ps1 ]{{else}}false{{end}}'
      - cmd: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command '& ([scriptblock]::Create($env:ISSHONI_NATIVE_BUILD_PS1))'
        if: '{{if eq OS "windows"}}[ -f native/windows/CMakeLists.txt ] && [ -f deploy/windows/msvc-env.ps1 ]{{else}}false{{end}}'

  native:dist:
    desc: >-
      Zip the Windows test tools for the owner's PC - isshoni-enginetest.exe, g2g.exe, hwcheck.ps1, the release
      isshoni-media.dll and the FFmpeg DLLs (docs/m2/06 §17)
    cmds:
      - cmd: "echo 'native:dist: note: not implemented yet; README WA24 adds it (WA76 adds hwcheck.ps1 and g2g.exe). Nothing was built.'"
        silent: true

  ffmpeg:fetch:
    desc: >-
      Download the locked FFmpeg build (native/ffmpeg/lock.json) from its deps release into .deps/ffmpeg/ and check
      its SHA-256 (works on the Mac too)
    cmds:
      - cmd: "echo 'ffmpeg:fetch: note: not implemented yet; README WA24 adds it (go -C tools run ./desktoppkg ffmpeg-fetch). Nothing was fetched.'"
        silent: true

  ffmpeg:build:
    desc: >-
      Build the LGPL FFmpeg zip on a Windows PC as ffmpeg.yml does (docs/m2/06 §4.3) - the pins.json sources checked
      by SHA-256, the MSVC environment, native/ffmpeg/build.sh under MSYS2 (MSYS2_ROOT, default C:/msys64) - in
      .deps/ffmpeg-build/
    vars:
      MSYS2_ROOT: '{{.MSYS2_ROOT | default "C:/msys64"}}'
    env:
      MSYS2_ROOT: '{{.MSYS2_ROOT}}'
      # Step 1 of docs/m2/06 §4.3, in Windows PowerShell 5.1 (every Windows 10 and 11 has it): download each
      # pins.json URL into .deps/ffmpeg-build/src/ (3 tries) under the name native/ffmpeg/build.sh gives it there
      # (<project>-<version or tag>.tar.*, so build.sh reuses the file and downloads nothing twice) and fail unless its
      # SHA-256 matches; then the MSVC environment step (docs/m2/06 §3), run as a script, not dot-sourced, and failing
      # the task on a nonzero exit code; the variables it sets are process-wide, so build.sh in MSYS2's bash inherits
      # them (steps 2-7) and gets the same work directory with -w. Passed through the environment, so no file is
      # written.
      ISSHONI_FFMPEG_BUILD_PS1: |
        $ErrorActionPreference = 'Stop'
        Set-StrictMode -Version 3.0
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        $ProgressPreference = 'SilentlyContinue'
        $root = (Get-Location).Path
        $work = Join-Path $root '.deps\ffmpeg-build'
        $src = Join-Path $work 'src'
        New-Item -ItemType Directory -Force -Path $src | Out-Null
        $ignore = Join-Path $root '.deps\.gitignore'
        if (-not (Test-Path -LiteralPath $ignore)) {
          Set-Content -LiteralPath $ignore -Encoding Ascii -Value @('# Fetched by the native and ffmpeg tasks (Taskfile.yml).', '*')
        }
        $pins = Get-Content -Raw -Path (Join-Path $root 'native\ffmpeg\pins.json') | ConvertFrom-Json
        # Each pins.json entry: the field that names its release and build.sh's file name for its tarball.
        $tarballs = [ordered]@{
          ffmpeg         = @('version', 'ffmpeg-{0}.tar.xz')
          nvCodecHeaders = @('tag', 'nv-codec-headers-{0}.tar.gz')
          amfHeaders     = @('tag', 'AMF-headers-{0}.tar.gz')
          libvpl         = @('tag', 'libvpl-{0}.tar.gz')
        }
        foreach ($name in $tarballs.Keys) {
          $entry = $pins.PSObject.Properties[$name]
          if ($null -eq $entry) { throw "ffmpeg:build: native/ffmpeg/pins.json has no $name entry" }
          $field, $format = $tarballs[$name]
          $release = $entry.Value.PSObject.Properties[$field]
          if ($null -eq $release -or [string]::IsNullOrEmpty([string]$release.Value)) {
            throw "ffmpeg:build: native/ffmpeg/pins.json has no $name.$field"
          }
          $url = [string]$entry.Value.url
          $want = ([string]$entry.Value.sha256).ToLowerInvariant()
          $file = Join-Path $src ($format -f [string]$release.Value)
          for ($try = 1; $true; $try++) {
            if (Test-Path -LiteralPath $file) {
              $got = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
              if ($got -eq $want) { break }
              Remove-Item -LiteralPath $file
              if ($try -gt 3) { throw "ffmpeg:build: $url has SHA-256 $got, but native/ffmpeg/pins.json pins $want" }
            } elseif ($try -gt 3) {
              throw "ffmpeg:build: could not download $url"
            }
            Write-Host "ffmpeg:build: downloading $url"
            try { Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $file } catch { Write-Host "ffmpeg:build: $($_.Exception.Message)" }
          }
        }
        # The script reports a missing VS instance, toolset or SDK with a nonzero exit code, not an exception.
        $global:LASTEXITCODE = 0
        & (Join-Path $root 'deploy\windows\msvc-env.ps1')
        if ($LASTEXITCODE -ne 0) { throw "ffmpeg:build: deploy/windows/msvc-env.ps1 failed (exit code $LASTEXITCODE)" }
        $bash = Join-Path $env:MSYS2_ROOT 'usr\bin\bash.exe'
        if (-not (Test-Path -LiteralPath $bash)) { throw "ffmpeg:build: no MSYS2 bash at $bash (install MSYS2, or set MSYS2_ROOT)" }
        $env:MSYS2_PATH_TYPE = 'inherit'
        $env:CHERE_INVOKING = '1'
        $env:SOURCE_DATE_EPOCH = (& git log -1 --format=%ct).Trim()
        # The exit code decides: Windows PowerShell 5.1 can turn a native program's stderr into errors under 'Stop'.
        $ErrorActionPreference = 'Continue'
        & $bash -lc 'native/ffmpeg/build.sh -w .deps/ffmpeg-build'
        if ($LASTEXITCODE -ne 0) { throw "ffmpeg:build: native/ffmpeg/build.sh failed (exit code $LASTEXITCODE)" }
    cmds:
      - cmd: "echo 'ffmpeg:build: skipped, FFmpeg builds with MSVC on Windows only: run it on a Windows PC, or use ffmpeg.yml (task ffmpeg:fetch downloads the locked build)'"
        silent: true
        if: '{{if eq OS "windows"}}false{{else}}true{{end}}'
      - cmd: "echo 'ffmpeg:build: note: native/ffmpeg/build.sh, native/ffmpeg/pins.json and deploy/windows/msvc-env.ps1 do not all exist yet, nothing to build'"
        silent: true
        if: '{{if eq OS "windows"}}! [ -f native/ffmpeg/build.sh ] || ! [ -f native/ffmpeg/pins.json ] || ! [ -f deploy/windows/msvc-env.ps1 ]{{else}}false{{end}}'
      - cmd: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command '& ([scriptblock]::Create($env:ISSHONI_FFMPEG_BUILD_PS1))'
        if: '{{if eq OS "windows"}}[ -f native/ffmpeg/build.sh ] && [ -f native/ffmpeg/pins.json ] && [ -f deploy/windows/msvc-env.ps1 ]{{else}}false{{end}}'

  # ---------------------------------------------------------------------------------------------------------------
  # Licenses

  licenses:
    desc: The license gate - go-licenses for linux, darwin and windows, and the npm license check of web/ and docs/
    deps: [tools:go-licenses]
    cmds:
      - cmd: "echo 'licenses: note: cmd/ does not exist yet, skipping go-licenses'"
        silent: true
        if: '[ ! -d cmd ]'
      - for: [linux, darwin, windows]
        cmd: GOOS={{.ITEM}} {{.GO_LICENSES}} check ./cmd/... --ignore github.com/MoonWX/isshoni --disallowed_types=forbidden,restricted,unknown
        if: '[ -d cmd ]'
      - cmd: "echo 'licenses: note: web/scripts/licenses.mjs does not exist yet, skipping the npm check'"
        silent: true
        if: '[ ! -f web/scripts/licenses.mjs ]'
      - cmd: node web/scripts/licenses.mjs check --dir web
        if: '[ -f web/scripts/licenses.mjs ] && [ -f web/package.json ]'
      - cmd: node web/scripts/licenses.mjs check --dir docs
        if: '[ -f web/scripts/licenses.mjs ] && [ -f docs/package.json ]'

  notices:
    desc: Write THIRD_PARTY_NOTICES for bin/isshoni (Go modules, the Go runtime, the bundled npm packages)
    cmds:
      - cmd: "echo 'notices: skipped, tools/notices does not exist yet'"
        silent: true
        if: '[ ! -d tools/notices ]'
      - cmd: >-
          go -C tools run ./notices -root .. -pkg ./cmd/isshoni -goos linux,darwin,windows
          -npm ../web/dist/licenses.txt -extra ../deploy/notices/extra.txt -version {{.VERSION}}
          -o ../THIRD_PARTY_NOTICES
        if: '[ -d tools/notices ]'

  # ---------------------------------------------------------------------------------------------------------------
  # Release

  release:prepare:
    desc: goreleaser's before hook, no npm - check web/dist is for VERSION, write THIRD_PARTY_NOTICES, stamp install.sh
    cmds:
      - cmd: "echo 'release:prepare: note: web/package.json does not exist yet, skipping the web/dist check'"
        silent: true
        if: '[ ! -f web/package.json ]'
      - cmd: |
          want='{{.VERSION}}'
          if [ ! -f web/dist/version.json ]; then
            echo "release:prepare: web/dist/version.json is missing: run task build:web VERSION=$want" >&2
            exit 1
          fi
          got=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' web/dist/version.json)
          if [ "$got" != "$want" ]; then
            echo "release:prepare: web/dist was built for ${got:-an unknown version}, not $want: run task build:web VERSION=$want" >&2
            exit 1
          fi
        silent: true
        if: '[ -f web/package.json ]'
      - task: notices
        vars: {VERSION: '{{.VERSION}}'}
      - cmd: "echo 'release:prepare: note: deploy/install.sh does not exist yet, nothing to stamp'"
        silent: true
        if: '[ ! -f deploy/install.sh ]'
      - cmd: |
          mkdir -p dist-extra
          sed 's/^ISSHONI_INSTALLER_VERSION="@VERSION@"/ISSHONI_INSTALLER_VERSION="{{.VERSION}}"/' deploy/install.sh > dist-extra/install.sh
          if ! grep -q '^ISSHONI_INSTALLER_VERSION="{{.VERSION}}"$' dist-extra/install.sh; then
            echo 'release:prepare: deploy/install.sh has no ISSHONI_INSTALLER_VERSION="@VERSION@" line to stamp' >&2
            exit 1
          fi
          echo 'release:prepare: stamped dist-extra/install.sh with {{.VERSION}}'
        silent: true
        if: '[ -f deploy/install.sh ]'

  release:goreleaser:
    desc: Build the pinned goreleaser (.tool-versions, tools/goreleaser/go.mod) into .bin/; the release tasks run it
    # A module of its own, not tools/go.mod: goreleaser needs a newer go directive than the repository's, and its
    # dependency graph (cloud SDKs, sigstore, ...) would raise versions that the other tools share. Rebuilt when
    # tools/goreleaser/go.mod or go.sum changes, like the tools:* tasks.
    run: once
    env: {CGO_ENABLED: '0'}
    sources: [tools/goreleaser/go.mod, tools/goreleaser/go.sum]
    generates: ['.bin/goreleaser{{exeExt}}']
    cmds:
      - go -C tools/goreleaser build -o ../../.bin/ github.com/goreleaser/goreleaser/v2

  release:wails3:
    desc: >-
      Build the pinned wails3 CLI (tools/wails3/go.mod, the Wails version of go.mod) into .bin/; the bindings generator
      and the Windows resource step run it
    # A module of its own, like tools/goreleaser (docs/m2/06 §3): the CLI's dependency graph stays out of tools/go.mod,
    # and Dependabot's /tools entry never bumps it. lint:pins keeps its Wails version equal to go.mod's. Rebuilt when
    # tools/wails3/go.mod or go.sum changes, like the tools:* tasks; it builds without cgo on every OS.
    run: once
    env: {CGO_ENABLED: '0'}
    sources: [tools/wails3/go.mod, tools/wails3/go.sum]
    generates: ['{{.WAILS3}}']
    cmds:
      - go -C tools/wails3 build -o ../../.bin/ github.com/wailsapp/wails/v3/cmd/wails3

  release:update-keys:
    desc: >-
      Write deploy/keys/update_signers into internal/update/signers.go, print the update keys' fingerprints and run
      lint:keys (docs/m2/06 §8.12, §11.5)
    cmds:
      - cmd: "echo 'release:update-keys: note: not implemented yet; README WA25 adds it with internal/update. Nothing was written.'"
        silent: true

  release:snapshot:
    desc: >-
      Local release dry run - the web app, then goreleaser --snapshot without signing, SBOMs or publishing, then
      release:assets and the image's version, then removes the two images (KEEP_IMAGES=true keeps them).
      `task release:snapshot -- --skip=docker` leaves out the images (they need Docker)
    vars:
      SNAPSHOT_VERSION: '{{.ISSHONI_SNAPSHOT_VERSION | default (print "0.0.0-dev." .COMMIT)}}'
      KEEP_IMAGES: '{{.KEEP_IMAGES | default "false"}}'
    env:
      ISSHONI_SNAPSHOT_VERSION: '{{.SNAPSHOT_VERSION}}'
    cmds:
      - cmd: "echo 'release:snapshot: skipped, .goreleaser.yaml does not exist yet'"
        silent: true
        if: '[ ! -f .goreleaser.yaml ]'
      - task: release:goreleaser
        if: '[ -f .goreleaser.yaml ]'
      - task: build:web
        vars: {VERSION: '{{.SNAPSHOT_VERSION}}'}
        if: '[ -f .goreleaser.yaml ]'
      - cmd: .bin/goreleaser{{exeExt}} check
        if: '[ -f .goreleaser.yaml ]'
      # A snapshot builds each image for one platform, tags it <version>-<arch>, loads it into the local Docker and
      # pushes nothing. Both images go again when the task ends, whether it passed or not: every commit has its own
      # version and would leave two more behind. KEEP_IMAGES=true keeps them (for docker:smoke, say).
      - defer: |
          command -v docker >/dev/null 2>&1 || exit 0
          for image in ghcr.io/moonwx/isshoni:{{.SNAPSHOT_VERSION}}-amd64 ghcr.io/moonwx/isshoni:{{.SNAPSHOT_VERSION}}-arm64; do
            docker image inspect "$image" >/dev/null 2>&1 || continue
            if [ '{{.KEEP_IMAGES}}' = true ]; then
              echo "release:snapshot: KEEP_IMAGES=true: keeping $image"
            elif docker image rm "$image" >/dev/null; then
              echo "release:snapshot: removed the snapshot image $image (KEEP_IMAGES=true keeps it)"
            fi
          done
        silent: true
      # The before hook runs `task release:prepare`: with .bin/ first in PATH, it finds the pinned Task there too.
      - cmd: PATH="$PWD/.bin:$PATH" .bin/goreleaser{{exeExt}} release --snapshot --clean --skip=sign,sbom {{.CLI_ARGS}}
        if: '[ -f .goreleaser.yaml ]'
      - task: release:assets
        vars: {VERSION: '{{.SNAPSHOT_VERSION}}'}
        if: '[ -f .goreleaser.yaml ]'
      # The image for this machine's CPU starts and has the version: the build context goreleaser made held the
      # binary where deploy/docker/Dockerfile copies it from.
      - cmd: |
          image='ghcr.io/moonwx/isshoni:{{.SNAPSHOT_VERSION}}-{{ARCH}}'
          if ! docker image inspect "$image" >/dev/null 2>&1; then
            echo "release:snapshot: note: there is no image $image (--skip=docker, or no Docker here), so no image was checked"
            exit 0
          fi
          got=$(docker run --rm --name "isshoni-release-snapshot-$$" "$image" version --short)
          if [ "$got" != '{{.SNAPSHOT_VERSION}}' ]; then
            echo "release:snapshot: the image $image reports version ${got:-(none)}, not {{.SNAPSHOT_VERSION}}" >&2
            exit 1
          fi
          echo "release:snapshot: the image $image starts and reports version $got"
        silent: true
        if: '[ -f .goreleaser.yaml ] && command -v docker >/dev/null 2>&1'

  release:assets:
    desc: >-
      Check dist/ after a goreleaser run against the release assets of docs/m1/06-deploy-and-ci.md §3 (VERSION=<v>;
      FULL=true for a real release, which also has SBOMs and the cosign bundle)
    vars:
      FULL: '{{.FULL | default "false"}}'
    cmds:
      - cmd: |
          set -eu
          v='{{.VERSION}}'
          full='{{.FULL}}'
          # The packages' own version puts "~" before a prerelease, so that it sorts before the release: 0.1.0-rc.1
          # is the deb and rpm version 0.1.0~rc.1. Their file names have "-" there (.goreleaser.yaml): GitHub
          # renames an asset with a "~" in its name.
          pv=$(printf '%s' "$v" | sed 's/-/~/')
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          status=0
          problem() {
            printf 'release:assets: %s\n' "$@" >&2
            status=1
          }
          # same_set WHAT WANT GOT reports the lines of the file WANT that GOT lacks, and the other way round.
          same_set() {
            LC_ALL=C sort -u "$2" >"$tmp/want.sorted"
            LC_ALL=C sort -u "$3" >"$tmp/got.sorted"
            LC_ALL=C comm -23 "$tmp/want.sorted" "$tmp/got.sorted" | while IFS= read -r line; do
              printf 'release:assets: %s lacks %s\n' "$1" "$line" >&2
            done
            LC_ALL=C comm -13 "$tmp/want.sorted" "$tmp/got.sorted" | while IFS= read -r line; do
              printf 'release:assets: %s has %s, which it should not\n' "$1" "$line" >&2
            done
            cmp -s "$tmp/want.sorted" "$tmp/got.sorted" || status=1
          }
          sha256() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | cut -d' ' -f1
            else
              shasum -a 256 "$1" | cut -d' ' -f1
            fi
          }

          if [ ! -d dist ]; then
            echo 'release:assets: there is no dist/: run task release:snapshot' >&2
            exit 1
          fi
          echo "release:assets: checking dist/ for isshoni $v (full release: $full)"

          # The assets of 06 §3. install.sh and the compose files are uploaded from where they are
          # (dist-extra/install.sh, deploy/), so dist/ has the others.
          : >"$tmp/archives"
          for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            echo "isshoni_${v}_$target.tar.gz" >>"$tmp/archives"
          done
          for target in windows_amd64 windows_arm64; do
            echo "isshoni_${v}_$target.zip" >>"$tmp/archives"
          done
          printf '%s\n' "isshoni_${v}_amd64.deb" "isshoni_${v}_arm64.deb" \
            "isshoni-$v-1.x86_64.rpm" "isshoni-$v-1.aarch64.rpm" >"$tmp/packages"
          sed 's/$/.sbom.json/' "$tmp/archives" >"$tmp/sboms"
          # checksums.txt: every archive, package, install.sh and compose file, and in a full release the SBOMs.
          cat "$tmp/archives" "$tmp/packages" >"$tmp/summed"
          printf '%s\n' install.sh compose.yaml compose.host.yaml >>"$tmp/summed"
          cat "$tmp/archives" "$tmp/packages" >"$tmp/dist.want"
          echo checksums.txt >>"$tmp/dist.want"
          if [ "$full" = true ]; then
            cat "$tmp/sboms" >>"$tmp/summed"
            cat "$tmp/sboms" >>"$tmp/dist.want"
            echo checksums.txt.sigstore.json >>"$tmp/dist.want"
          fi
          # checksums.txt.sig never comes from goreleaser: release.yml's sign job adds it to the draft.
          : >"$tmp/dist.got"
          for f in dist/*; do
            [ -f "$f" ] || continue
            case ${f#dist/} in
            # goreleaser's own records; a real release also writes the notes and the image digests
            artifacts.json | metadata.json | config.yaml | CHANGELOG.md | digests.txt) ;;
            *) echo "${f#dist/}" >>"$tmp/dist.got" ;;
            esac
          done
          same_set dist/ "$tmp/dist.want" "$tmp/dist.got"
          for f in dist-extra/install.sh deploy/compose.yaml deploy/compose.host.yaml; do
            [ -f "$f" ] || problem "$f is missing (a release uploads it)"
          done
          if ! grep -qx "ISSHONI_INSTALLER_VERSION=\"$v\"" dist-extra/install.sh 2>/dev/null; then
            problem "dist-extra/install.sh is not stamped with $v"
          fi

          # checksums.txt: "<sha256>  <name>" for exactly those files, each with the hash the file has.
          if [ -f dist/checksums.txt ]; then
            sed 's/^[0-9a-f]\{64\}  //' dist/checksums.txt >"$tmp/summed.got"
            same_set dist/checksums.txt "$tmp/summed" "$tmp/summed.got"
            # install.sh refuses a name that is listed twice (06 §4.3).
            LC_ALL=C sort "$tmp/summed.got" | uniq -d >"$tmp/summed.twice"
            while read -r name; do
              problem "checksums.txt lists $name more than once"
            done <"$tmp/summed.twice"
            while read -r sum name; do
              case $name in
              install.sh) file=dist-extra/install.sh ;;
              compose.yaml | compose.host.yaml) file=deploy/$name ;;
              *) file=dist/$name ;;
              esac
              [ -f "$file" ] || continue
              [ "$(sha256 "$file")" = "$sum" ] || problem "checksums.txt has the wrong SHA-256 for $name"
            done <dist/checksums.txt
          fi

          # Every name is one that GitHub keeps as it is. It renames a release asset whose name has any other
          # character ("~" becomes ".") or starts or ends with ".", and the draft would then no longer match
          # checksums.txt: release.yml's sign job would fail on it, after the owner's approval.
          cat "$tmp/dist.want" "$tmp/dist.got" "$tmp/summed" >"$tmp/names"
          [ ! -f "$tmp/summed.got" ] || cat "$tmp/summed.got" >>"$tmp/names"
          LC_ALL=C grep -Evx '[A-Za-z0-9_-]([A-Za-z0-9._-]*[A-Za-z0-9_-])?' "$tmp/names" >"$tmp/names.bad" || :
          LC_ALL=C sort -u "$tmp/names.bad" | while IFS= read -r name; do
            printf 'release:assets: %s is not a name GitHub keeps for a release asset: use only A-Z a-z 0-9 . _ -\n' \
              "$name" >&2
          done
          [ ! -s "$tmp/names.bad" ] || status=1

          # The archives: the binary, the license files, README.md and the files install.sh installs (06 §3), at
          # the root. .goreleaser.yaml names README.md plainly, so goreleaser fails without it, snapshots too.
          printf '%s\n' LICENSE NOTICE THIRD_PARTY_NOTICES README.md deploy/systemd/isshoni.service \
            deploy/sysctl/60-isshoni.conf deploy/firewall/ufw-isshoni deploy/firewall/firewalld-isshoni.xml \
            >"$tmp/content"
          while read -r archive; do
            [ -f "dist/$archive" ] || continue
            cp "$tmp/content" "$tmp/content.want"
            case $archive in
            *.zip)
              echo isshoni.exe >>"$tmp/content.want"
              unzip -Z1 "dist/$archive" >"$tmp/content.got"
              ;;
            *)
              echo isshoni >>"$tmp/content.want"
              tar -tzf "dist/$archive" >"$tmp/content.got"
              ;;
            esac
            same_set "$archive" "$tmp/content.want" "$tmp/content.got"
          done <"$tmp/archives"

          # The binary for this machine starts and has the version (the ldflags of 06 §9.2).
          host=$(go env GOOS)_$(go env GOARCH)
          case $host in
          linux_* | darwin_*)
            if [ -f "dist/isshoni_${v}_$host.tar.gz" ]; then
              mkdir "$tmp/bin"
              tar -xzf "dist/isshoni_${v}_$host.tar.gz" -C "$tmp/bin" isshoni
              got=$("$tmp/bin/isshoni" version --short) || got=''
              [ "$got" = "$v" ] || problem "the $host binary reports version ${got:-(none)}, not $v"
            fi
            ;;
          esac

          # The packages (06 §5): the same files in the system's paths, and the tools preinstall.sh needs.
          printf '%s\n' usr/bin/isshoni usr/lib/systemd/system/isshoni.service usr/lib/sysctl.d/60-isshoni.conf \
            etc/ufw/applications.d/isshoni usr/lib/firewalld/services/isshoni.xml etc/isshoni \
            usr/share/doc/isshoni/LICENSE usr/share/doc/isshoni/NOTICE usr/share/doc/isshoni/THIRD_PARTY_NOTICES \
            >"$tmp/package.want"
          # (Each listing goes to a file first: Task's shell has pipefail on, and grep -q ending a pipe early
          # would fail the command that writes into it.)
          for arch in amd64 arm64; do
            deb=dist/isshoni_${v}_$arch.deb
            [ -f "$deb" ] || continue
            ar p "$deb" data.tar.gz | tar -tzf - | sed 's|^\./||' >"$tmp/deb.list"
            # data.tar.gz lists the parent directories as well; of those only /etc/isshoni is the package's own.
            grep -v -e '/$' -e '^$' "$tmp/deb.list" >"$tmp/package.got" || :
            if grep -qx 'etc/isshoni/' "$tmp/deb.list"; then
              echo etc/isshoni >>"$tmp/package.got"
            fi
            same_set "${deb#dist/}" "$tmp/package.want" "$tmp/package.got"
            ar p "$deb" control.tar.gz | tar -xzOf - ./control >"$tmp/control"
            for field in "Version: $pv" "Architecture: $arch" 'Pre-Depends: passwd'; do
              grep -qx "$field" "$tmp/control" || problem "${deb#dist/}: the control file lacks \"$field\""
            done
          done
          # rpm lists the files the package owns, without implicit parent directories.
          if command -v rpm >/dev/null 2>&1; then
            rpm_list() { rpm -qlp "$1" 2>/dev/null; }
          elif command -v bsdtar >/dev/null 2>&1; then
            rpm_list() { bsdtar -tf "$1"; }
          else
            case $(tar --version 2>/dev/null) in
            *bsdtar*) rpm_list() { tar -tf "$1"; } ;; # macOS
            *) rpm_list() { return 1; } ;;
            esac
          fi
          for arch in x86_64 aarch64; do
            rpm=dist/isshoni-$v-1.$arch.rpm
            [ -f "$rpm" ] || continue
            if ! rpm_list "$rpm" >"$tmp/rpm.list"; then
              problem "can't list ${rpm#dist/}: install rpm (or bsdtar, from libarchive)"
              continue
            fi
            sed -e 's|^\./||' -e 's|^/||' "$tmp/rpm.list" >"$tmp/package.got"
            same_set "${rpm#dist/}" "$tmp/package.want" "$tmp/package.got"
            if command -v rpm >/dev/null 2>&1; then
              rpm -qpR "$rpm" >"$tmp/rpm.requires" 2>/dev/null || :
              grep -qx shadow-utils "$tmp/rpm.requires" || problem "${rpm#dist/} does not require shadow-utils"
              got=$(rpm -qp --queryformat '%{VERSION} %{ARCH}' "$rpm" 2>/dev/null) || got=''
              [ "$got" = "$pv $arch" ] || problem "${rpm#dist/}: version and architecture are \"$got\", not \"$pv $arch\""
            fi
          done
          if ! command -v rpm >/dev/null 2>&1; then
            echo "release:assets: note: rpm is not installed here, so the rpm packages' Requires and version were not checked"
          fi

          if [ "$status" = 0 ]; then
            echo "release:assets: dist/ has the release assets of isshoni $v"
          fi
          exit "$status"
        silent: true

  release:keys:
    desc: >-
      Write deploy/keys/allowed_signers into the key block of deploy/install.sh, check it (lint:keys) and print the
      keys' fingerprints (deploy/keys/README.md)
    cmds:
      - cmd: |
          set -eu
          keys=deploy/keys/allowed_signers
          die() {
            printf 'release:keys: %s\n' "$@" >&2
            exit 1
          }
          [ -s "$keys" ] || die "$keys is missing or empty: put the public halves of the release keys there first" \
            '(deploy/keys/README.md)'
          if grep -q 'PRIVATE KEY' "$keys"; then
            die "$keys holds a PRIVATE key. Do not commit it: delete the file, and use the .pub files' contents"
          fi
          # What lint:keys rejects in the key file is checked before install.sh is written, so that a failed run
          # leaves it as it was. Its README.md check runs after the write: until README.md lists the fingerprints
          # printed below, this task ends with that error (deploy/keys/README.md step 2).
          if grep -q "'" "$keys"; then
            die "$keys contains a single quote (comments count too), which install.sh's key block cannot hold"
          fi
          [ -z "$(tail -c 1 "$keys")" ] || die "$keys must end with a newline"
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          # Each line: the principal install.sh asks for, the namespace it verifies, an ed25519 key (06 §4.3, §9.4).
          # Rotation adds options (valid-before="YYYYMMDD") to the namespaces field; comments and blank lines pass.
          n=0
          while IFS= read -r line || [ -n "$line" ]; do
            n=$((n + 1))
            line=${line%"$(printf '\r')"}
            case $line in '' | '#'*) continue ;; esac
            case $line in
            'isshoni-release namespaces="isshoni-checksums"'*' ssh-ed25519 AAAA'*) ;;
            *) die "$keys line $n is not 'isshoni-release namespaces=\"isshoni-checksums\" ssh-ed25519 AAAA… <name>'" ;;
            esac
            key=$(printf '%s\n' "$line" | sed 's/.*\(ssh-ed25519 [A-Za-z0-9+/=]*\).*/\1/')
            printf '%s\n' "$key" >"$tmp/key.pub"
            fp=$(ssh-keygen -l -f "$tmp/key.pub") || die "$keys line $n: ssh-keygen does not read the key"
            printf 'release:keys: line %d: %s %s\n' "$n" "$(printf '%s' "$fp" | cut -d' ' -f2)" "${line##* }"
          done <"$keys"
          # The block holds the file's lines in single quotes; install.sh writes the value plus a newline back to a
          # file for ssh-keygen, so a file that ends with its newline round-trips byte for byte.
          tr -d '\r' <"$keys" >"$tmp/signers"
          awk -v q="'" '
            FNR == NR { value = value (FNR > 1 ? "\n" : "") $0; next }
            /^# BEGIN ALLOWED SIGNERS/ { print; print "ALLOWED_SIGNERS=" q value q; skip = 1; next }
            /^# END ALLOWED SIGNERS/ { skip = 0 }
            !skip { print }' "$tmp/signers" deploy/install.sh >"$tmp/install.sh"
          # cat, not mv: install.sh keeps its mode.
          cat "$tmp/install.sh" >deploy/install.sh
          echo "release:keys: wrote $keys into deploy/install.sh"
        silent: true
      - task: lint:keys

  release:compat:
    desc: >-
      Snapshot the protocol fixtures for the final release VERSION=X.Y.Z into internal/protocol/testdata/compat/ and
      keep the two newest snapshots (run it in the release-prep PR and commit the result)
    # 01 §14.3, 06 §9.1: the compat test (internal/protocol/compat_test.go) decodes every snapshot with the current
    # code from then on, and release.yml refuses a final release whose snapshot is missing or differs from
    # testdata/v1. Plain sh, cp and rm: no Go, no Node, no sort (versions are compared in the shell).
    cmds:
      - cmd: |
          set -eu
          die() {
            printf 'release:compat: %s\n' "$@" >&2
            exit 1
          }
          src=internal/protocol/testdata/v1
          compat=internal/protocol/testdata/compat
          v='{{.VERSION}}'
          # A final release X.Y.Z without leading zeros, as release.yml takes a tag (06 §9.1). A prerelease (-rc.N)
          # gets no snapshot, and a forgotten VERSION= leaves the dev version (0.0.0-dev+<commit>), which fails too.
          is_release() {
            case $1 in
            '' | *[!0-9.]* | .* | *. | *..* | *.*.*.* | 0[0-9]* | *.0[0-9]*) return 1 ;;
            *.*.*) return 0 ;;
            *) return 1 ;;
            esac
          }
          is_release "$v" || die "VERSION=$v is not a final X.Y.Z release: run task release:compat VERSION=X.Y.Z" \
            '(a prerelease -rc.N gets no snapshot: docs/m1/06-deploy-and-ci.md §9.1)'
          [ -d "$src" ] || die "there is no $src to take a snapshot of"
          # newer A B: release A comes after release B in SemVer order (numbers, so 0.0.10 comes after 0.0.9). The
          # returns are explicit: in Task's shell a bare `return` returns 0, even right after a failing command.
          newer() {
            a=$1 b=$2
            for _part in 1 2 3; do
              x=${a%%.*} y=${b%%.*}
              if [ "$x" -gt "$y" ]; then
                return 0
              elif [ "$x" -lt "$y" ]; then
                return 1
              fi
              a=${a#*.} b=${b#*.}
            done
            return 1
          }
          # The two newest releases among the snapshots there and this one. Every entry of compat/ must be a
          # snapshot directory, as the compat test requires; hidden files (.DS_Store) don't match the pattern.
          first=$v second=
          for d in "$compat"/*; do
            [ -e "$d" ] || [ -L "$d" ] || continue
            name=${d##*/}
            [ "$name" != "$v" ] || continue
            if [ -L "$d" ] || [ ! -d "$d" ] || ! is_release "$name"; then
              die "$d is not a snapshot (a directory named after a final release X.Y.Z): remove it, then run this again"
            fi
            if newer "$name" "$first"; then
              second=$first first=$name
            elif [ -z "$second" ] || newer "$name" "$second"; then
              second=$name
            fi
          done
          # Only the two newest stay: a snapshot for an older release would be deleted as soon as it was made.
          if [ "$v" != "$first" ] && [ "$v" != "$second" ]; then
            die "$v is older than the snapshots $second and $first: only the two newest releases keep a snapshot," \
              'so this one would be deleted at once (docs/m1/06-deploy-and-ci.md §7.2)'
          fi
          # A fresh copy: a snapshot taken again (testdata/v1 changed after the first run) drops what is gone.
          rm -rf "${compat:?}/$v"
          mkdir -p "$compat/$v"
          cp -R "$src/." "$compat/$v/"
          echo "release:compat: copied $src to $compat/$v"
          for d in "$compat"/*; do
            [ -e "$d" ] || [ -L "$d" ] || continue
            case ${d##*/} in "$first" | "$second") continue ;; esac
            rm -rf "$d"
            echo "release:compat: removed $d (only the two newest releases keep a snapshot)"
          done
          echo "release:compat: the snapshots are now ${second:+$second and }$first. Commit $compat/ in the" \
            'release-prep PR and merge it before you tag (docs/m1/06-deploy-and-ci.md §9.1)'
        silent: true

  # ---------------------------------------------------------------------------------------------------------------
  # Deployment tests

  deploy:test:
    desc: Run the installer scenarios in distro containers (DISTRO=debian-12 selects one; needs podman or Docker)
    cmds:
      - cmd: "echo 'deploy:test: skipped, deploy/test/distro-test.sh does not exist yet'"
        silent: true
        if: '[ ! -f deploy/test/distro-test.sh ]'
      - cmd: sh deploy/test/distro-test.sh {{.DISTRO}}
        if: '[ -f deploy/test/distro-test.sh ]'

  docker:smoke:
    desc: Run the Docker smoke test (bridge and host networking, backup and restore, no volume, no .env)
    cmds:
      # The image holds the server binary, which embeds the web app, and THIRD_PARTY_NOTICES: all three are made
      # for one VERSION. `task docker:smoke -- -k` passes flags on to the script (-h lists them).
      - task: build:web
        vars: {VERSION: '{{.VERSION}}'}
      - task: notices
        vars: {VERSION: '{{.VERSION}}'}
      - sh deploy/docker/test/docker-smoke.sh -v '{{.VERSION}}' {{.CLI_ARGS}}

  # ---------------------------------------------------------------------------------------------------------------
  # Project site

  site:dev:
    desc: Serve the project site (VitePress) with live reload
    cmds:
      - cmd: "echo 'site:dev: skipped, docs/package.json does not exist yet'"
        silent: true
        if: '[ ! -f docs/package.json ]'
      - cmd: npx --prefix docs vitepress dev docs
        if: '[ -f docs/package.json ]'

  site:build:
    desc: Build the project site (VitePress) into docs/.vitepress/dist/
    cmds:
      - cmd: "echo 'site:build: skipped, docs/package.json does not exist yet'"
        silent: true
        if: '[ ! -f docs/package.json ]'
      - cmd: npx --prefix docs vitepress build docs
        if: '[ -f docs/package.json ]'

  # ---------------------------------------------------------------------------------------------------------------

  clean:
    desc: >-
      Remove build output (bin/, dist/, dist-extra/, dist-desktop/, web/dist/* except .gitkeep), .dev/, and the pinned
      tools in .bin/ except task; the fetched dependencies in .deps/ stay (delete the folder to fetch them again)
    cmds:
      # .bin/task stays (06 §7.2 says .bin/): it is often the Task running this command, and deleting it would leave
      # a contributor without the go-built Task (Windows cannot delete a running .exe anyway). `task tools` builds
      # the others again.
      - rm -rf bin dist dist-extra dist-desktop .dev .task
      - >-
        rm -rf {{.GOLANGCI_LINT}} {{.TYGO}} {{.GO_LICENSES}} .bin/govulncheck{{exeExt}} {{.SHFMT}}
        .bin/goreleaser{{exeExt}} {{.WAILS3}}
      - rm -rf web/dist/*
