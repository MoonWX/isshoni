# Nightly: the slow and flaky-prone checks that do not gate a pull request (docs/m1/06-deploy-and-ci.md §8.5,
# "06" below).
#
#   distro-vm          the install.sh scenarios in a VM of each of the six distros of 06 §4.13, including the
#                      VM-only ones of 06 §11.2: V1 (C1-C10 on a real kernel and systemd, and the sysctl values),
#                      V2 (SELinux on Fedora), V3 (a running ufw or firewalld), V4 (iptables with
#                      netfilter-persistent, the Oracle Cloud pattern), V5 (ACME with Pebble) and V6 (the exposure
#                      score of systemd-analyze security). QEMU with KVM; without /dev/kvm the job is skipped with
#                      a warning, and the scenarios are run by hand before a release (06 §4.13, §9.1).
#   docker-multiarch   `task docker:smoke` (06 §11.3) on ubuntu-24.04 and on the native arm64 runner
#   go-cross-os        `go test -race ./...` on macOS and Windows, whose server builds are shipped (experimental);
#                      the Windows leg also runs the desktop packages as the app ships (CGO_ENABLED=0), the macOS
#                      leg builds cmd/isshoni-desktop (M2 06 §10.3)
#   govulncheck        fails on a reachable vulnerability; npm audit of the web app's shipped packages
#   web                web/dist of this run's version 0.0.0-nightly.<run>, for windows-full
#   windows-full       the Windows app (M2 06 §10.3): ci.yml's windows-native (here windows-full-native) and
#                      windows-desktop without caches, every check on every night, the updater e2e always (README
#                      WA88), and the desktop release files of release.yml's desktop-pkg for goreleaser-full
#   windows-asan       the engine's tests under MSVC's AddressSanitizer (preset win-x64-asan)
#   native-fuzz        each libFuzzer target of native/ for 60 s on its corpus (preset host-fuzz)
#   goreleaser-full    `goreleaser release --snapshot --clean` with the images, the SBOMs and windows-full's real
#                      desktop files, then the asset list of 06 §3 and M2 06 §2.1 (release:assets FULL=true
#                      DESKTOP=true): catches drift of the dockers_v2, nfpm and desktop config
#   compat-servers     the client core against the last two final server releases (M2 06 §10.3, §11.6); skips with
#                      a note while fewer than two exist
#   site-links         lychee over the built project site, external links included
#
# GitHub e-mails the owner when a scheduled run fails. It also disables a scheduled workflow after 60 days without
# activity in the repository; CONTRIBUTING.md says how to turn it on again.
#
# Locally: the jobs run tasks and scripts of the repository, and their steps run as they are elsewhere. distro-vm
# is `sh deploy/test/vm/vm-test.sh`, which needs Linux with QEMU and KVM; without KVM, VM_ACCEL=tcg runs it
# emulated (in a Linux container on an arm64 Mac, say), much slower. docker-multiarch is `task docker:smoke` on the
# machine's own architecture. native-fuzz is `task native:test PRESET=host-fuzz` (a clang with libFuzzer, not
# Apple's), then each target with -max_total_time=60; windows-asan and windows-full need a Windows PC (task
# native:build PRESETS=win-x64-asan TEST=true; task desktop:package:windows).
#
# Rules for every workflow (06 §8.1): a read-only token, and no job here needs more; third-party actions pinned by
# full commit SHA with a version comment; checkout without persisted credentials; timeout-minutes on every job. No
# caches: like a release, the nightly builds from the module proxy, npm and vcpkg's sources alone, and leaves the
# repository's cache space to ci.yml (M2 06 §10.2). Every job runs on every night, whatever changed.

name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run at a time; a scheduled run is never cancelled by a manual one.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  vm-release:
    # The two test releases of the install.sh scenarios (06 §11.2), as ci.yml's distro-release job builds them:
    # `task release:snapshot` without the images as 0.0.1-ci.1 and 0.0.1-ci.2. Unsigned: each distro-vm job signs
    # them with a key of its own.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node (version from .tool-versions)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      - name: Read Task's pin from .tool-versions
        id: pins
        run: |
          task=$(awk '$1 == "task" { sub(/^v/, "", $2); print $2; exit }' .tool-versions)
          if [ -z "$task" ]; then
            echo "::error file=.tool-versions::.tool-versions needs a task pin, a line 'task <version>' (06 §7.1)"
            exit 1
          fi
          echo "task=$task" >> "$GITHUB_OUTPUT"

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ steps.pins.outputs.task }}

      - name: npm ci
        run: npm ci --prefix web --no-audit --no-fund

      - name: Install rpm (release:snapshot's asset check lists the rpm packages with it)
        run: |
          if ! command -v rpm > /dev/null; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y -qq --no-install-recommends rpm
          fi

      - name: Build the releases 0.0.1-ci.1 and 0.0.1-ci.2
        run: sh deploy/test/distro-test.sh -b "$RUNNER_TEMP/distro-releases"

      - name: Upload the releases
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-releases
          path: ${{ runner.temp }}/distro-releases
          if-no-files-found: error
          retention-days: 1

  distro-vm:
    # One VM after the other, each booted fresh from the distro's official cloud image with a cloud-init seed, and
    # reached over SSH. The scenarios are deploy/test/distro-test.sh's, run in the VM instead of a container by
    # deploy/test/vm/vm-test.sh, which sources it, plus the VM-only ones of 06 §11.2. Parts (vm-test.sh -o; a
    # matrix row lists those of vm-test.sh's default that apply to its distro), each in a VM of its own:
    #   main  C12, C1, then V1's sysctl values, C2, C3, C6, C4, C5, C8, C9, C10, then V6 and, on Fedora, V2
    #   c7    C7, a port taken by another program          c13  C13, a server that does not start
    #   v3    V3: the firewall offer with ufw (Ubuntu 24.04) or firewalld (Fedora) running, and SSH still reachable
    #   v4    V4: iptables with netfilter-persistent and a REJECT rule, IPv4 and IPv6; the rules survive a reboot
    #         (Ubuntu 24.04)
    #   v5    V5: --domain isshoni.test against Pebble on this runner, ready within 60 s, a certificate from Pebble
    # C11 (no systemd) has no VM form: it stays in ci.yml's distro job.
    needs: vm-release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian-12
            parts: main c7 c13 v5
          - distro: debian-13
            parts: main c7 c13 v5
          - distro: ubuntu-22.04
            parts: main c7 c13 v5
          - distro: ubuntu-24.04
            parts: main c7 c13 v3 v4 v5
          - distro: ubuntu-26.04
            parts: main c7 c13 v5
          - distro: fedora-44
            parts: main c7 c13 v3 v5
    env:
      DISTRO: ${{ matrix.distro }}
      PARTS: ${{ matrix.parts }}
    steps:
      - name: /dev/kvm
        id: kvm
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::warning title=distro-vm skipped on $DISTRO::this runner has no /dev/kvm, so the VM scenarios of 06 §11.2 did not run. Run them by hand before a release (06 §4.13, §9.1)."
            echo "### distro-vm $DISTRO: skipped, the runner has no /dev/kvm" >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The runner's user may use KVM once a udev rule opens the device (GitHub's documented way).
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-isshoni-kvm.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          for _ in $(seq 1 20); do
            if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
              ls -l /dev/kvm
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 0.5
          done
          ls -l /dev/kvm
          echo "::error::/dev/kvm exists, but the udev rule did not make it usable"
          exit 1

      - name: Check out
        if: steps.kvm.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod; for tools/relserve)
        if: steps.kvm.outputs.ok == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Download the releases
        if: steps.kvm.outputs.ok == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vm-releases
          path: ${{ runner.temp }}/distro-releases

      - name: Install QEMU and cloud-image-utils
        if: steps.kvm.outputs.ok == 'true'
        run: |
          case $(uname -m) in
          x86_64) qemu='qemu-system-x86' ;;
          aarch64) qemu='qemu-system-arm qemu-efi-aarch64' ;;
          *)
            echo "::error::no VMs on $(uname -m)"
            exit 1
            ;;
          esac
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          # shellcheck disable=SC2086 # one or two package names
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y -qq --no-install-recommends $qemu qemu-utils cloud-image-utils
          "qemu-system-$(uname -m)" --version | sed -n 1p

      - name: Download the ${{ matrix.distro }} cloud image
        if: steps.kvm.outputs.ok == 'true'
        env:
          VM_DIR: ${{ runner.temp }}/vm
        run: |
          # The distro's own cloud image, checked against the checksum file next to it, where vm-test.sh looks for
          # it.
          sh deploy/test/vm/cloud-image.sh "$DISTRO" "$VM_DIR/images/$DISTRO.qcow2"
          qemu-img info "$VM_DIR/images/$DISTRO.qcow2" | sed -n '1,3p'

      - name: The scenarios in ${{ matrix.distro }} VMs
        if: steps.kvm.outputs.ok == 'true'
        # Less than the job's 90 minutes, which also hold the steps above (about 5 minutes): a hang fails this
        # step before the job times out, so the steps below still have the time to save Pebble's logs and upload
        # the VMs' consoles.
        timeout-minutes: 75
        env:
          VM_DIR: ${{ runner.temp }}/vm
          VM_ACCEL: kvm
        # deploy/test/vm/vm-test.sh: the scenarios of deploy/test/distro-test.sh, which it sources, run in VMs, the
        # VM-only ones of 06 §11.2, and Pebble for V5. The same script runs by hand before a release (06 §4.13).
        run: sh deploy/test/vm/vm-test.sh -r "$RUNNER_TEMP/distro-releases" -o "$PARTS" "$DISTRO"

      - name: The logs of Pebble and pebble-challtestsrv, if the scenarios were stopped before they saved them
        if: (failure() || cancelled()) && steps.kvm.outputs.ok == 'true' && contains(matrix.parts, 'v5')
        env:
          VM_DIR: ${{ runner.temp }}/vm
        run: |
          # vm-test.sh saves them in VM_DIR (and prints them) when it ends; a step timeout can stop it first.
          for name in pebble challtestsrv; do
            if [ ! -e "$VM_DIR/$name.log" ] && docker container inspect "isshoni-vm-$name" > /dev/null 2>&1; then
              docker logs "isshoni-vm-$name" > "$VM_DIR/$name.log" 2>&1 || true
              echo "The log of $name:"
              cat "$VM_DIR/$name.log"
            fi
          done

      - name: Upload the VMs' console logs and Pebble's logs
        if: (failure() || cancelled()) && steps.kvm.outputs.ok == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distro-vm-${{ matrix.distro }}-consoles
          path: |
            ${{ runner.temp }}/vm/*/console.log
            ${{ runner.temp }}/vm/*.log
          if-no-files-found: ignore
          retention-days: 7

  docker-multiarch:
    # The Docker smoke test of 06 §11.3 (`task docker:smoke`) on both architectures of the image, each on a
    # native runner: the image is built from the working tree for the runner's own CPU, then every part runs, the
    # host-network ones included. ci.yml's docker-smoke job runs only linux/amd64.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node (version from .tool-versions)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      - name: Read Task's pin from .tool-versions
        id: pins
        run: |
          task=$(awk '$1 == "task" { sub(/^v/, "", $2); print $2; exit }' .tool-versions)
          if [ -z "$task" ]; then
            echo "::error file=.tool-versions::.tool-versions needs a task pin, a line 'task <version>' (06 §7.1)"
            exit 1
          fi
          echo "task=$task" >> "$GITHUB_OUTPUT"

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ steps.pins.outputs.task }}

      - name: npm ci
        run: npm ci --prefix web --no-audit --no-fund

      - name: Show the Docker versions
        run: |
          docker version
          docker compose version
          docker buildx version

      - name: task docker:smoke (${{ runner.arch }})
        run: task docker:smoke

  go-cross-os:
    # The Go tests on the two other systems the server is built for (06 §3: experimental macOS and Windows
    # archives). The race detector needs cgo, so a C compiler: Xcode's on macOS, MinGW-w64's gcc on Windows.
    # `./...` holds the desktop app's packages too (the client core, the updater, the media packages with the fake
    # engine, internal/desktop, cmd/isshoni-desktop; M2 06 §10.3): the Windows leg also runs them with
    # CGO_ENABLED=0, the mode the app ships in, and the macOS leg builds the darwin app (cgo, the fake engine).
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    env:
      CGO_ENABLED: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: gcc for cgo (Windows)
        if: runner.os == 'Windows'
        run: |
          if command -v gcc > /dev/null; then
            gcc --version | sed -n 1p
            exit 0
          fi
          # The runner images keep MinGW-w64 in one of these places; Chocolatey is the fallback.
          for dir in /c/mingw64/bin /c/msys64/ucrt64/bin /c/msys64/mingw64/bin; do
            if [ -x "$dir/gcc.exe" ]; then
              cygpath -w "$dir" >> "$GITHUB_PATH"
              "$dir/gcc.exe" --version | sed -n 1p
              exit 0
            fi
          done
          echo "::notice::no gcc on this runner image; installing MinGW-w64 with Chocolatey"
          choco install mingw --no-progress -y
          cygpath -w /c/ProgramData/mingw64/mingw64/bin >> "$GITHUB_PATH"

      - name: go env
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED CC

      - name: go test -race (internal/server/ops and cmd/isshoni, the backup, restore and re-exec code)
        run: go test -race -count=1 -timeout 30m ./internal/server/ops/ ./cmd/isshoni/

      - name: go test -race (every other package)
        run: |
          pkgs=$(go list ./... | grep -v -x \
            -e github.com/MoonWX/isshoni/internal/server/ops \
            -e github.com/MoonWX/isshoni/cmd/isshoni)
          # shellcheck disable=SC2086 # one word per package
          go test -race -count=1 -timeout 30m $pkgs

      - name: go test (CGO_ENABLED=0, the desktop packages as the app ships; Windows)
        # Also after a failed -race run: the shipped mode reports its own failures in the same night. The packages
        # of ci.yml's windows-go, on every night.
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        env:
          CGO_ENABLED: '0'
        run: go test -count=1 -timeout 15m ./internal/client/... ./internal/update/... ./internal/desktop/... ./cmd/isshoni-desktop/...

      - name: go build ./cmd/isshoni-desktop (darwin, cgo)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: go build -o "$RUNNER_TEMP/isshoni-desktop" ./cmd/isshoni-desktop

  govulncheck:
    # Gating here, as in release.yml (ci.yml's job only warns: a new CVE must not block unrelated pull requests).
    # govulncheck fails on a vulnerability that the code reaches; npm audit on a high or critical one in a package
    # the web app ships (devDependencies left out).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node (version from .tool-versions)
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      - name: Read Task's pin from .tool-versions
        id: pins
        run: |
          task=$(awk '$1 == "task" { sub(/^v/, "", $2); print $2; exit }' .tool-versions)
          if [ -z "$task" ]; then
            echo "::error file=.tool-versions::.tool-versions needs a task pin, a line 'task <version>' (06 §7.1)"
            exit 1
          fi
          echo "task=$task" >> "$GITHUB_OUTPUT"

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ steps.pins.outputs.task }}

      - name: The pinned govulncheck (task tools:govulncheck)
        run: task tools:govulncheck

      - name: govulncheck ./...
        run: .bin/govulncheck ./...

      - name: npm audit --omit=dev --audit-level=high (web)
        # Also when govulncheck failed, so that one run reports both.
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  web:
    # web/dist for windows-full (the SPA that isshoni.exe and the CDP spec's server embed, and licenses.txt for the
    # desktop notices), built for this run's version 0.0.0-nightly.<run> as release.yml's web job builds it.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from .tool-versions)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      - name: npm ci
        run: npm ci --prefix web --no-audit --no-fund

      - name: npm run build (writes web/dist/version.json and licenses.txt)
        env:
          ISSHONI_VERSION: 0.0.0-nightly.${{ github.run_number }}
        run: npm --prefix web run build

      - name: Upload web/dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  windows-full-native:
    # The first half of windows-full (M2 06 §10.3, R16): ci.yml's windows-native job without its caches (no Go,
    # vcpkg or openh264_test cache: vcpkg builds every port from source, as in a release), for this run's version
    # 0.0.0-nightly.<run>, and the same steps otherwise: the FFmpeg lock check and the locked zip (here with its
    # source tar, which goreleaser-full ships as isshoni-desktop_<v>_ffmpeg-source.tar), the MSVC environment,
    # win-x64-ci (build, ctest, the skipped tests listed, the DEPENDENTLOADFLAG verdict), win-x64-release (build,
    # dll-check), the WebView2 bootstrapper with its signature checked, the windows-native artifact (release\ and
    # ci\, kept 1 day) and task native:dist. Uploads windows-native, ffmpeg-source and isshoni-native-tools. Keep it
    # in step with ci.yml's windows-native: a change there belongs here too.
    runs-on: windows-2025
    timeout-minutes: 60 # ci.yml's 30, plus vcpkg's ports built from source
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      ISSHONI_VERSION: 0.0.0-nightly.${{ github.run_number }}
      VCPKG_DISABLE_METRICS: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Read Task's pin from .tool-versions
        id: pins
        shell: bash
        run: |
          task=$(awk '$1 == "task" { sub(/^v/, "", $2); print $2; exit }' .tool-versions)
          if [ -z "$task" ]; then
            echo "::error file=.tool-versions::.tool-versions needs a task pin, a line 'task <version>' (06 §7.1)"
            exit 1
          fi
          echo "task=$task" >> "$GITHUB_OUTPUT"

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ steps.pins.outputs.task }}

      - name: The FFmpeg lock is current
        # M2 06 §4.1: inputsSha256 over pins.json, build.sh, ffcheck.c and the libvpl patches must
        # equal lock.json's, so a pin or build change can't merge without its published build.
        run: |
          go -C tools run ./desktoppkg ffmpeg-inputs -check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: FFmpeg from the lock (and its source)
        id: ffmpeg
        run: |
          # M2 06 §4.5, §5.1: the locked zip and source tar from the deps release, each checked against
          # lock.json's SHA-256 by tools/desktoppkg ffmpeg-fetch, which unpacks the zip to $RUNNER_TEMP\ffmpeg
          # and checks it (both DLLs with the lock's names and SHA-256s, ffmpeg-config.json's LGPL checks).
          $out = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          $root = [string](go -C tools run ./desktoppkg ffmpeg-fetch -source -out $out | Select-Object -Last 1)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = $root.Trim()
          if (-not (Test-Path -LiteralPath (Join-Path $root 'include/libavcodec/avcodec.h'))) {
            throw "ffmpeg-fetch printed '$root', which has no include/libavcodec/avcodec.h"
          }
          $lock = Get-Content -Raw -LiteralPath native/ffmpeg/lock.json | ConvertFrom-Json
          $src = @($lock.assets.PSObject.Properties.Name | Where-Object { $_ -like '*-source.tar' })
          if ($src.Count -ne 1) { throw 'native/ffmpeg/lock.json does not name one source tar' }
          if (-not (Test-Path -LiteralPath (Join-Path $out $src[0]) -PathType Leaf)) { throw "ffmpeg-fetch left no $($src[0]) in $out" }
          "IM_FFMPEG_ROOT=$root ($($lock.tag))"
          "root=$root" >> $env:GITHUB_OUTPUT
          "source=$(Join-Path $out $src[0])" >> $env:GITHUB_OUTPUT
          "bin=$(Join-Path $root 'bin')" >> $env:GITHUB_OUTPUT

      - name: MSVC environment
        id: msvc
        run: ./deploy/windows/msvc-env.ps1

      - name: vcpkg at native/vcpkg.json's baseline (no binary cache)
        id: vcpkg
        run: |
          $baseline = [string](Get-Content -Raw -LiteralPath native/vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          if ($baseline -notmatch '^[0-9a-f]{40}$') { throw 'native/vcpkg.json has no 40-hex builtin-baseline' }
          $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git init -q $root
          git -C $root remote add origin https://github.com/microsoft/vcpkg.git
          git -C $root fetch -q --depth 1 origin $baseline
          if ($LASTEXITCODE -ne 0) { throw "git fetch of vcpkg $baseline failed" }
          git -C $root checkout -q --detach FETCH_HEAD
          # Downloads the vcpkg tool release the checkout pins and checks its SHA-512.
          & (Join-Path $root 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "bootstrap-vcpkg.bat failed (exit code $LASTEXITCODE)" }
          # The nightly builds every port from source, as a release does: no binary cache, not even vcpkg's default
          # one (06 §9.3, M2 06 §10.2).
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear" >> $env:GITHUB_ENV
          "baseline=$baseline" >> $env:GITHUB_OUTPUT

      - name: CMake and Ninja
        id: tools
        run: |
          # The ones on PATH (the image's, or Visual Studio's once msvc-env.ps1 ran), else the copies vcpkg
          # pins and verifies by SHA-512.
          foreach ($tool in 'cmake', 'ninja') {
            $cmd = Get-Command $tool -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($cmd) {
              $path = $cmd.Source
            } else {
              $path = [string](& (Join-Path $env:VCPKG_ROOT 'vcpkg.exe') fetch $tool | Select-Object -Last 1)
              if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $path.Trim())) { throw "vcpkg fetch $tool failed" }
              $path = $path.Trim()
            }
            "${tool}: $path ($(& $path --version | Select-Object -First 1))"
            "$tool=$path" >> $env:GITHUB_OUTPUT
            if ($tool -eq 'cmake') { "ctest=$(Join-Path (Split-Path -Parent $path) 'ctest.exe')" >> $env:GITHUB_OUTPUT }
          }

      - name: win-x64-ci - configure, build and test
        working-directory: native
        env:
          CMAKE: ${{ steps.tools.outputs.cmake }}
          CTEST: ${{ steps.tools.outputs.ctest }}
          NINJA: ${{ steps.tools.outputs.ninja }}
          FFMPEG_ROOT: ${{ steps.ffmpeg.outputs.root }}
          # README WA44: ffmpeg_load_test and mf_sw_test load the locked FFmpeg DLLs from here
          # (im_init_params.ffmpeg_dir); in CI they fail rather than skip without it. The test
          # executables' own folder holds no FFmpeg, so every other test runs as without it.
          ISSHONI_TEST_FFMPEG_DIR: ${{ steps.ffmpeg.outputs.bin }}
        run: |
          & $env:CMAKE --preset win-x64-ci "-DCMAKE_MAKE_PROGRAM=$env:NINJA" "-DIM_FFMPEG_ROOT=$env:FFMPEG_ROOT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CMAKE --build --preset win-x64-ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CTEST --preset win-x64-ci --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: The native tests that skipped, and why
        # ctest counts a binary whose cases all call GTEST_SKIP as passed and prints nothing of it: each test writes
        # gtest's XML (native/windows/CMakeLists.txt, GTEST_OUTPUT), and this lists every skipped case with its
        # reason. The skips this runner is known to take (no GPU, no audio device, Windows Server, a test's own
        # child-process case) are notices; any other is a warning to look at.
        if: always()
        run: |
          Set-StrictMode -Version 3
          $expected = @(
            # Windows Server: the H.264 encoder MFT refuses, or gives its AUs only on drain.
            '^MfSoftware\.',
            # No Desktop Duplication output on the runner's session.
            '^Protect\.DesktopDuplicationLeavesTheWindowOut$',
            # No process loopback (no audio device), or a kept-out app runs.
            '^AudioLive\.TheFastPathRunsFromTheFirstPlan$',
            # No render or capture endpoint.
            '^AudioWatcher\.(OwnSessionKeptOutBeforeAnyRules|MicRootSurvivesUnwatch)$',
            # A test's own child-process case, skipped when run directly.
            '^(AudioWatcherChild|AudioProcessChild|DllSearchChild|FfmpegLoadChild)\.',
            # Opt-in (IM_GPU_TEST_HARDWARE=1).
            '^GpuHardware\.'
          )
          $files = @(Get-ChildItem -Path 'native/build/win-x64-ci' -Recurse -Filter '*.xml' -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'gtest-xml' })
          if ($files.Count -eq 0) {
            '::warning::no gtest XML report was written (native/build/win-x64-ci/**/gtest-xml)'
            exit 0
          }
          $lines = [System.Collections.Generic.List[string]]::new()
          foreach ($f in $files) {
            $doc = [xml](Get-Content -Raw -LiteralPath $f.FullName)
            foreach ($tc in @($doc.SelectNodes('//testcase'))) {
              $skip = $tc.SelectSingleNode('skipped')
              if ($tc.GetAttribute('result') -ne 'skipped' -and $null -eq $skip) { continue }
              $name = '{0}.{1}' -f $tc.GetAttribute('classname'), $tc.GetAttribute('name')
              $why = if ($null -ne $skip) { ($skip.GetAttribute('message') -replace '\s+', ' ').Trim() } else { '' }
              $line = '{0} / {1}: {2}' -f $f.BaseName, $name, $why
              $known = @($expected | Where-Object { $name -match $_ }).Count -gt 0
              if ($known) { "::notice::skipped $line" } else { "::warning::skipped (not one this runner is known to take) $line" }
              $lines.Add("- $(if ($known) { '' } else { '**unexpected** ' })$line")
            }
          }
          "### Skipped native tests ($($lines.Count))`n" >> $env:GITHUB_STEP_SUMMARY
          if ($lines.Count -gt 0) { ($lines -join "`n") + "`n" >> $env:GITHUB_STEP_SUMMARY }

      - name: The delay-load helper and /DEPENDENTLOADFLAG (README WA11's verdict)
        if: always()
        run: |
          # Written by dll_search_test; it decides M2 06 §5.1's conditional load-config check.
          $file = 'native/build/win-x64-ci/windows/dependentloadflag-verdict.txt'
          if (-not (Test-Path -LiteralPath $file)) {
            '::warning::dll_search_test wrote no DEPENDENTLOADFLAG verdict'
            exit 0
          }
          $verdict = (Get-Content -Raw -LiteralPath $file).Trim()
          "DEPENDENTLOADFLAG verdict: $verdict"
          "### /DEPENDENTLOADFLAG:0x800 and the delay-load helper`n`n$verdict`n" >> $env:GITHUB_STEP_SUMMARY

      - name: win-x64-release - configure and build
        id: release
        working-directory: native
        env:
          CMAKE: ${{ steps.tools.outputs.cmake }}
          NINJA: ${{ steps.tools.outputs.ninja }}
          VERSION: ${{ env.ISSHONI_VERSION }}
          FFMPEG_ROOT: ${{ steps.ffmpeg.outputs.root }}
        run: |
          # The four-part version of M2 06 §5.3 (0.0.0-nightly.<run> is 0.0.0.<run mod 65000>), from
          # tools/desktoppkg winver, the rule isshoni.exe's version resource uses too (README WA67, WA72).
          $winver = [string](go -C (Join-Path $env:GITHUB_WORKSPACE 'tools') run ./desktoppkg winver $env:VERSION | Select-Object -Last 1)
          if ($LASTEXITCODE -ne 0) { throw "desktoppkg winver refused ISSHONI_VERSION '$env:VERSION'" }
          $winver = $winver.Trim()
          if ($winver -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "desktoppkg winver printed '$winver', not a four-part version" }
          $commit = [string](git rev-parse --short=7 HEAD)
          & $env:CMAKE --preset win-x64-release "-DCMAKE_MAKE_PROGRAM=$env:NINJA" "-DIM_VERSION=$env:VERSION" `
            "-DIM_WINVER=$winver" "-DIM_COMMIT=$($commit.Trim())" "-DIM_FFMPEG_ROOT=$env:FFMPEG_ROOT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CMAKE --build --preset win-x64-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "winver=$winver" >> $env:GITHUB_OUTPUT

      - name: dumpbin of the release DLL (for the log)
        run: |
          $dll = 'native/build/win-x64-release/windows/isshoni-media.dll'
          dumpbin /nologo /dependents /exports $dll
          dumpbin /nologo /loadconfig $dll | Select-String -Pattern 'Dependent Load' -SimpleMatch
          exit 0

      - name: dll-check (the release DLL and the FFmpeg DLLs)
        env:
          VERSION: ${{ env.ISSHONI_VERSION }}
          WINVER: ${{ steps.release.outputs.winver }}
          FFMPEG_BIN: ${{ steps.ffmpeg.outputs.bin }}
        run: |
          # -ffmpeg (README WA24): exactly the two DLLs lock.json names after its majors, with its
          # SHA-256s, importing neither Media Foundation nor a C runtime DLL (06 §4.4, §5.1).
          $dll = Join-Path $env:GITHUB_WORKSPACE 'native/build/win-x64-release/windows/isshoni-media.dll'
          go -C tools run ./desktoppkg dll-check -dll $dll -version $env:VERSION -winver $env:WINVER -ffmpeg $env:FFMPEG_BIN
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: The WebView2 bootstrapper (signature checked)
        id: webview2
        run: |
          # M2 06 §5.1: downloaded from tools.json's URL; Authenticode Valid with exactly the pinned signer.
          $pin = (Get-Content -Raw -LiteralPath deploy/windows/tools.json | ConvertFrom-Json).webview2Bootstrapper
          $file = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          $ProgressPreference = 'SilentlyContinue'
          for ($try = 1; ; $try++) {
            try {
              Invoke-WebRequest -UseBasicParsing -Uri $pin.url -OutFile $file
              break
            } catch {
              if ($try -ge 3) { throw }
              "download failed ($($_.Exception.Message)); trying again"
              Start-Sleep -Seconds (5 * $try)
            }
          }
          $sig = Get-AuthenticodeSignature -LiteralPath $file
          if ($sig.Status -ne 'Valid') { throw "the bootstrapper's signature is $($sig.Status): $($sig.StatusMessage)" }
          $subject = $sig.SignerCertificate.Subject
          if ($subject -cne $pin.signer) { throw "the bootstrapper is signed by '$subject', not '$($pin.signer)'" }
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
          "WebView2 bootstrapper: SHA-256 $sha, signed by $subject"
          "path=$file" >> $env:GITHUB_OUTPUT
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          "signer=$subject" >> $env:GITHUB_OUTPUT

      - name: The windows-native artifact
        env:
          VERSION: ${{ env.ISSHONI_VERSION }}
          WINVER: ${{ steps.release.outputs.winver }}
          BASELINE: ${{ steps.vcpkg.outputs.baseline }}
          TOOLSET: ${{ steps.msvc.outputs.toolset }}
          VS_VERSION: ${{ steps.msvc.outputs.vs-version }}
          WINDOWS_SDK: ${{ steps.msvc.outputs.windows-sdk }}
          WEBVIEW2: ${{ steps.webview2.outputs.path }}
          WEBVIEW2_SHA256: ${{ steps.webview2.outputs.sha256 }}
          WEBVIEW2_SIGNER: ${{ steps.webview2.outputs.signer }}
          FFMPEG_ROOT: ${{ steps.ffmpeg.outputs.root }}
        run: |
          # M2 06 §5.1: release\ is the win-x64-release output only; ci\ holds the test-hooks DLL.
          # The FFmpeg DLLs (checked by dll-check -ffmpeg) sit next to isshoni-media.dll in both,
          # since the engine loads them from its own folder (04 §9.2).
          $out = Join-Path $env:RUNNER_TEMP 'windows-native'
          $rel = Join-Path $out 'release'
          $ci = Join-Path $out 'ci'
          New-Item -ItemType Directory -Force -Path $rel, $ci | Out-Null
          $build = 'native/build/win-x64-release'
          Copy-Item -LiteralPath "$build/windows/isshoni-media.dll", "$build/windows/isshoni-media.pdb" -Destination $rel
          Copy-Item -LiteralPath 'native/build/win-x64-ci/windows/isshoni-media.dll' -Destination $ci
          $lock = Get-Content -Raw -LiteralPath native/ffmpeg/lock.json | ConvertFrom-Json
          $ffmpegDlls = [ordered]@{}
          foreach ($name in @("avcodec-$($lock.avcodecMajor)", "avutil-$($lock.avutilMajor)")) {
            $file = Join-Path $env:FFMPEG_ROOT "bin/$name.dll"
            $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
            if ($sha -ne [string]$lock.dlls."$name.dll") { throw "$name.dll is not the one lock.json names" }
            $ffmpegDlls["$name.dll"] = $sha
            Copy-Item -LiteralPath $file -Destination $rel
            Copy-Item -LiteralPath $file -Destination $ci
            Copy-Item -LiteralPath (Join-Path $env:FFMPEG_ROOT "pdb/$name.pdb") -Destination $rel
          }
          # FFmpeg's license files (FFmpeg's own and those of the headers it was built with), beside
          # the vcpkg ones below.
          $licenses = Join-Path $rel 'licenses'
          New-Item -ItemType Directory -Force -Path $licenses | Out-Null
          Copy-Item -Path (Join-Path $env:FFMPEG_ROOT 'licenses/*') -Destination $licenses -Recurse

          # The vcpkg ports of the release tree (built without the tests feature, so no gtest): their
          # copyright files and their versions from vcpkg's status database.
          $installed = "$build/vcpkg_installed"
          $ports = [ordered]@{}
          $stanzas = (Get-Content -Raw -LiteralPath "$installed/vcpkg/status") -split "(?:\r?\n){2,}"
          foreach ($stanza in $stanzas) {
            $f = @{}
            foreach ($line in $stanza -split "\r?\n") {
              if ($line -match '^([A-Za-z-]+): (.*)$') { $f[$Matches[1]] = $Matches[2] }
            }
            if ($f['Package'] -and -not $f['Feature'] -and $f['Status'] -eq 'install ok installed' -and
                $f['Architecture'] -eq 'x64-windows-static') {
              $v = $f['Version']
              if ($f['Port-Version'] -and $f['Port-Version'] -ne '0') { $v = "$v#$($f['Port-Version'])" }
              $ports[$f['Package']] = $v
            }
          }
          foreach ($port in $ports.Keys) {
            $copyright = "$installed/x64-windows-static/share/$port/copyright"
            if (-not (Test-Path -LiteralPath $copyright)) { throw "vcpkg port $port has no copyright file" }
            $dest = Join-Path $rel "licenses/vcpkg/$port"
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Copy-Item -LiteralPath $copyright -Destination $dest
          }
          # License files the native slices commit (README WA51: OpenH264's headers; WA50: C++/WinRT).
          foreach ($pair in @(@('native/windows/third_party/openh264/LICENSE', 'licenses/openh264'),
                              @('native/windows/third_party/cppwinrt/LICENSE', 'licenses/cppwinrt'))) {
            if (Test-Path -LiteralPath $pair[0]) {
              $dest = Join-Path $rel $pair[1]
              New-Item -ItemType Directory -Force -Path $dest | Out-Null
              Copy-Item -LiteralPath $pair[0] -Destination $dest
            }
          }
          Copy-Item -LiteralPath $env:WEBVIEW2 -Destination $rel

          $header = Get-Content -Raw -LiteralPath native/include/isshoni_media.h
          if ($header -notmatch '#define IM_ABI_MAJOR\s+(\d+)u' ) { throw 'no IM_ABI_MAJOR in the header' }
          $major = [int]$Matches[1]
          if ($header -notmatch '#define IM_ABI_MINOR\s+(\d+)u' ) { throw 'no IM_ABI_MINOR in the header' }
          $minor = [int]$Matches[1]
          $dllSha = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $rel 'isshoni-media.dll')).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version              = $env:VERSION
            winver               = $env:WINVER
            dll                  = [ordered]@{ name = 'isshoni-media.dll'; sha256 = $dllSha; abi = ($major * 65536 + $minor) }
            ffmpeg               = [ordered]@{ tag = [string]$lock.tag; dlls = $ffmpegDlls }
            vcpkg                = [ordered]@{ baseline = $env:BASELINE; ports = $ports }
            msvcToolset          = $env:TOOLSET
            vsInstance           = $env:VS_VERSION
            windowsSdk           = $env:WINDOWS_SDK
            webview2Bootstrapper = [ordered]@{ sha256 = $env:WEBVIEW2_SHA256; signer = $env:WEBVIEW2_SIGNER }
          }
          $json = $manifest | ConvertTo-Json -Depth 6
          [IO.File]::WriteAllText((Join-Path $rel 'native-manifest.json'), $json + "`n", (New-Object Text.UTF8Encoding($false)))
          $json
          Get-ChildItem -LiteralPath $out -Recurse -File | ForEach-Object { $_.FullName.Substring($out.Length + 1) }

      - name: The ffmpeg-source artifact (the locked source tar)
        env:
          FFMPEG_SOURCE: ${{ steps.ffmpeg.outputs.source }}
        run: |
          # M2 06 §4.5, as release.yml's windows-native: windows-full checks it against lock.json again and hands it
          # to goreleaser-full as isshoni-desktop_<v>_ffmpeg-source.tar.
          $src = Join-Path $env:RUNNER_TEMP 'ffmpeg-source'
          New-Item -ItemType Directory -Force -Path $src | Out-Null
          Copy-Item -LiteralPath $env:FFMPEG_SOURCE -Destination $src

      - name: Upload windows-native
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-native
          path: ${{ runner.temp }}/windows-native/
          retention-days: 1
          if-no-files-found: error

      - name: Upload ffmpeg-source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-source
          path: ${{ runner.temp }}/ffmpeg-source/
          retention-days: 1
          if-no-files-found: error

      - name: task native:dist (isshoni-native-tools)
        env:
          FFMPEG_ROOT: ${{ steps.ffmpeg.outputs.root }}
        run: |
          # M2 06 §5.1, §17: the native:dist zip of the release DLL, the FFmpeg DLLs and the test
          # tools for the owner's PC and the hwcheck suite, plus ci\ (the win-x64-ci DLL with the
          # FFmpeg DLLs next to it) for the checks that need 04's luma tap
          # (`isshoni-enginetest avsync -dll ci`). Never staged.
          $out = Join-Path $env:RUNNER_TEMP 'isshoni-native-tools'
          task native:dist "FFMPEG_ROOT=$env:FFMPEG_ROOT" "OUT=$(Join-Path $out 'isshoni-native-tools.zip')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'windows-native/ci') -Destination $out -Recurse
          Get-ChildItem -LiteralPath $out -Recurse -File | ForEach-Object { $_.FullName.Substring($out.Length + 1) }

      - name: Upload isshoni-native-tools
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isshoni-native-tools
          path: ${{ runner.temp }}/isshoni-native-tools/
          retention-days: 7
          if-no-files-found: error

  windows-full:
    # windows-full (M2 06 §10.3, R16): ci.yml's windows-desktop job without its caches (no Go, NSIS or npm cache),
    # every check on every night whatever changed, against windows-full-native's artifacts and the web job's
    # web/dist of this run's version 0.0.0-nightly.<run>: the desktop notices and the native license gate,
    # isshoni.exe, the stage and the installer, the smoke's installers and smoke.ps1 -Mode ci, the DLL-dependent Go
    # tests and isshoni-audiotest selfcheck, Pester and the grammar check under Windows PowerShell 5.1,
    # install-desktop.ps1 against relserve, the server-rendered ps1 test, the WebView2 runtime, the -tags e2e tests,
    # the autostart round trip (README WA84), the updater e2e on every night (06 §16, README WA88: two updatetest
    # builds 0.0.1-ci.1 and ci.2 served by relserve, --update-now, smoke.ps1 -Mode update) and 03's CDP spec.
    # From the installer that passed the smoke it also makes the desktop release files of release.yml's desktop-pkg
    # (M2 06 §2.1): the update manifest, the symbols zip, the FFmpeg source tar and the stamped install-desktop.ps1
    # (artifact desktop-release, with the stage as desktop-stage), so that goreleaser-full's snapshot carries real
    # desktop files rather than release:desktop-stubs' stand-ins. Keep it in step with ci.yml's windows-desktop.
    needs: [web, windows-full-native]
    runs-on: windows-2025
    timeout-minutes: 90 # ci.yml's 65 without its caches, plus the desktop release files
    outputs:
      # true once desktop-release and desktop-stage are uploaded: goreleaser-full's input, also when a later check
      # of this job fails (each check reports on its own, as in ci.yml).
      desktop-files: ${{ steps.desktop-handover.outputs.ready }}
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      ISSHONI_VERSION: 0.0.0-nightly.${{ github.run_number }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Read Task's pin from .tool-versions
        id: pins
        shell: bash
        run: |
          task=$(awk '$1 == "task" { sub(/^v/, "", $2); print $2; exit }' .tool-versions)
          if [ -z "$task" ]; then
            echo "::error file=.tool-versions::.tool-versions needs a task pin, a line 'task <version>' (06 §7.1)"
            exit 1
          fi
          echo "task=$task" >> "$GITHUB_OUTPUT"

      - name: Set up Task
        id: task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ steps.pins.outputs.task }}

      - name: Download web/dist
        id: webdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist

      - name: Download windows-native
        id: native
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-native
          path: ${{ runner.temp }}/windows-native

      - name: Download ffmpeg-source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-source
          path: ${{ runner.temp }}/ffmpeg-source

      - name: The NSIS pin
        id: nsis-pin
        run: |
          $pin = (Get-Content -Raw -LiteralPath deploy/windows/tools.json | ConvertFrom-Json).nsis
          if ($pin.sha256 -notmatch '^[0-9a-f]{64}$') { throw 'deploy/windows/tools.json has no nsis.sha256' }
          "version=$($pin.version)" >> $env:GITHUB_OUTPUT
          "url=$($pin.url)" >> $env:GITHUB_OUTPUT
          "sha256=$($pin.sha256)" >> $env:GITHUB_OUTPUT

      - name: NSIS (makensis from the pinned portable zip)
        id: nsis
        env:
          NSIS_VERSION: ${{ steps.nsis-pin.outputs.version }}
          NSIS_URL: ${{ steps.nsis-pin.outputs.url }}
          NSIS_SHA256: ${{ steps.nsis-pin.outputs.sha256 }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'nsis-zip'
          $zip = Join-Path $dir "nsis-$env:NSIS_VERSION.zip"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          if (-not (Test-Path -LiteralPath $zip)) {
            $ProgressPreference = 'SilentlyContinue'
            for ($try = 1; ; $try++) {
              try {
                Invoke-WebRequest -UseBasicParsing -Uri $env:NSIS_URL -OutFile $zip -UserAgent 'Wget'
                break
              } catch {
                if ($try -ge 3) { throw }
                "download failed ($($_.Exception.Message)); trying again"
                Start-Sleep -Seconds (5 * $try)
              }
            }
          }
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($sha -ne $env:NSIS_SHA256) {
            Remove-Item -LiteralPath $zip -Force
            throw "nsis-$env:NSIS_VERSION.zip has the SHA-256 $sha, not deploy/windows/tools.json's $env:NSIS_SHA256"
          }
          $out = Join-Path $env:RUNNER_TEMP 'nsis'
          Expand-Archive -LiteralPath $zip -DestinationPath $out -Force
          $makensis = Join-Path $out "nsis-$env:NSIS_VERSION\makensis.exe"
          if (-not (Test-Path -LiteralPath $makensis)) { throw "the NSIS zip has no nsis-$env:NSIS_VERSION\makensis.exe" }
          & $makensis -VERSION
          ''
          "makensis=$makensis" >> $env:GITHUB_OUTPUT

      - name: Desktop notices and the native license gate (tools/notices -native)
        env:
          VERSION: ${{ env.ISSHONI_VERSION }}
          NATIVE: ${{ runner.temp }}\windows-native\release
        run: |
          # M2 06 §9.2-§9.3 (README WA78), on its own so a gate failure is the step's: the Go modules of
          # cmd/isshoni-desktop for windows (Wails' among them), the web client's packages and the native section from
          # deploy/notices/native-windows.json with the windows-native artifact's release\licenses\. The gate fails on
          # a native license that is neither allowlisted, nor FFmpeg's LGPL-2.1-or-later linked dynamically with the
          # LGPL files present, nor a LicenseRef-* excepted in deploy/notices/exceptions.md; on a missing license
          # file; and when the artifact's vcpkg ports differ from the entries'. task desktop:package:windows writes
          # the same file again for the stage.
          $out = Join-Path $env:RUNNER_TEMP 'THIRD_PARTY_NOTICES-desktop.txt'
          go -C tools run ./notices -root .. -pkg ./cmd/isshoni-desktop -goos windows -goarch amd64 `
            -npm ../web/dist/licenses.txt -extra ../deploy/notices/extra.txt `
            -native ../deploy/notices/native-windows.json -native-root $env:NATIVE -version $env:VERSION -o $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: isshoni.exe, the stage and the installer (task desktop:package:windows)
        id: package
        env:
          VERSION: ${{ env.ISSHONI_VERSION }}
          MAKENSIS: ${{ steps.nsis.outputs.makensis }}
          NATIVE: ${{ runner.temp }}\windows-native\release
        run: |
          # M2 06 §5.2 (the exe and its step 3 checks), §6.2 (stage -release: on Windows it runs the staged
          # isshoni.exe --self-check and requires ok and testHooks false), §6.9 (the prebuilt uninstaller), §6.10
          # and §9.3 (desktoppkg check).
          task desktop:package:windows "VERSION=$env:VERSION" "NATIVE_DIR=$env:NATIVE" "MAKENSIS=$env:MAKENSIS" `
            RELEASE=true PREBUILT_UNINSTALLER=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Join-Path $env:GITHUB_WORKSPACE "dist-desktop/isshoni-desktop_$($env:VERSION)_windows_amd64_setup.exe"
          if (-not (Test-Path -LiteralPath $setup)) { throw "no $setup" }
          "setup=$setup" >> $env:GITHUB_OUTPUT

      - name: The installed notices and the LGPL files (the stage)
        run: |
          # README WA78's acceptance, on the stage that the installer packs and smoke.ps1 compares byte for byte with
          # the installed tree: licenses\THIRD_PARTY_NOTICES.txt lists Wails' modules, the web client's packages and
          # the native section, and licenses\ffmpeg\ holds 06 §9.1's three files, all in install-files.txt.
          $stage = Join-Path $env:GITHUB_WORKSPACE 'dist-desktop/stage'
          $text = [IO.File]::ReadAllText((Join-Path $stage 'licenses/THIRD_PARTY_NOTICES.txt')) -replace "`r`n", "`n"
          $want = @(
            "`n1. Go modules and the Go runtime (", "`ngithub.com/wailsapp/wails/v3 v",
            "`n2. Web client (bundled JavaScript)`n", "`n@wailsio/runtime ", "`nreact ",
            "`n3. Native components`n", "`nFFmpeg (libavcodec, libavutil) ", "`nLicense: LGPL-2.1-or-later`nLinking: dynamic`n",
            "`nMicrosoft Edge WebView2 Runtime bootstrapper`n", "`n4. Adapted source code and data`n")
          $last = -1
          foreach ($w in $want) {
            $i = $text.IndexOf($w, [StringComparison]::Ordinal)
            if ($i -lt 0) { throw "licenses\THIRD_PARTY_NOTICES.txt has no $($w.Trim())" }
            if ($i -lt $last) { throw "licenses\THIRD_PARTY_NOTICES.txt has $($w.Trim()) out of order" }
            $last = $i
          }
          $listed = [IO.File]::ReadAllLines((Join-Path $stage 'install-files.txt'))
          foreach ($name in 'COPYING.LGPLv2.1.txt', 'LICENSE.md', 'README-LGPL.txt') {
            $rel = "licenses\ffmpeg\$name"
            if (-not (Test-Path -LiteralPath (Join-Path $stage $rel) -PathType Leaf)) { throw "the stage has no $rel" }
            if ($listed -notcontains $rel) { throw "install-files.txt doesn't list $rel" }
          }
          'the stage has the desktop notices with the native section and the LGPL files'

      - name: The smoke's older and newer installers
        id: smoke-builds
        env:
          MAKENSIS: ${{ steps.nsis.outputs.makensis }}
          NATIVE: ${{ runner.temp }}\windows-native\release
        run: |
          # 06 §16: an older build whose install-files.txt lists an extra (fake) avcodec-00.dll, for the stale-file
          # case, and a newer one, for the downgrade cases. Both pack the same stage otherwise, with the same
          # prebuilt uninstaller. 0.0.0-smoke's last identifier is no number, so its winver is 0.0.0.0, never above
          # CI's 0.0.0.<run_number mod 65000> (desktoppkg winver, 06 §5.3); 0.0.1-smoke.1 has 0.0.1.1, above it.
          $stage = Join-Path $env:GITHUB_WORKSPACE 'dist-desktop/stage'
          $uninstaller = Join-Path $env:GITHUB_WORKSPACE 'dist-desktop/.build/uninst/uninstall.exe'
          $webview2 = Join-Path $env:NATIVE 'MicrosoftEdgeWebview2Setup.exe'
          $out = Join-Path $env:RUNNER_TEMP 'smoke-builds'
          $old = Join-Path $out 'stage-old'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -LiteralPath $stage -Destination $old -Recurse
          [IO.File]::WriteAllText((Join-Path $old 'avcodec-00.dll'), "fake avcodec-00.dll for the smoke`r`n")
          [IO.File]::AppendAllText((Join-Path $old 'install-files.txt'), "avcodec-00.dll`r`n")
          foreach ($b in @(@('0.0.0-smoke', $old, 'old.exe'), @('0.0.1-smoke.1', $stage, 'newer.exe'))) {
            go -C tools run ./desktoppkg nsis -version $b[0] -stage $b[1] -out (Join-Path $out $b[2]) `
              -webview2 $webview2 -prebuilt-uninstaller $uninstaller -makensis $env:MAKENSIS
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          "old=$(Join-Path $out 'old.exe')" >> $env:GITHUB_OUTPUT
          "newer=$(Join-Path $out 'newer.exe')" >> $env:GITHUB_OUTPUT

      - name: smoke.ps1 -Mode ci
        env:
          VERSION: ${{ env.ISSHONI_VERSION }}
          SETUP: ${{ steps.package.outputs.setup }}
          OLD_SETUP: ${{ steps.smoke-builds.outputs.old }}
          NEWER_SETUP: ${{ steps.smoke-builds.outputs.newer }}
        run: |
          ./deploy/test/windows/smoke.ps1 -Mode ci -Setup $env:SETUP -Version $env:VERSION -OldSetup $env:OLD_SETUP `
            -NewerSetup $env:NEWER_SETUP -Stage (Join-Path $env:GITHUB_WORKSPACE 'dist-desktop/stage')

      - name: The isshoni-desktop-windows-pr folder (the installer and its symbols)
        env:
          SETUP: ${{ steps.package.outputs.setup }}
          NATIVE: ${{ runner.temp }}\windows-native\release
        run: |
          # M2 06 §10.1: the installer that just passed the smoke, for manual tests on the owner's PC (M-APP-PICK, 04
          # §18.4), and the symbols of the native DLLs it carries (isshoni.exe is built with -s -w and has none).
          $out = Join-Path $env:RUNNER_TEMP 'isshoni-desktop-windows-pr'
          $symbols = Join-Path $out 'symbols'
          New-Item -ItemType Directory -Force -Path $symbols | Out-Null
          Copy-Item -LiteralPath $env:SETUP -Destination $out
          $pdbs = @(Get-ChildItem -LiteralPath $env:NATIVE -Filter '*.pdb' -File)
          if (-not ($pdbs.Name -contains 'isshoni-media.pdb')) { throw "the windows-native artifact has no isshoni-media.pdb" }
          $pdbs | Copy-Item -Destination $symbols
          Get-ChildItem -LiteralPath $out -Recurse -File | ForEach-Object { $_.FullName.Substring($out.Length + 1) }

      - name: Upload isshoni-desktop-windows-pr
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isshoni-desktop-windows-pr
          path: ${{ runner.temp }}/isshoni-desktop-windows-pr/
          retention-days: 7
          if-no-files-found: error

      - name: The desktop release files (as release.yml's desktop-pkg makes them)
        env:
          SETUP: ${{ steps.package.outputs.setup }}
          NATIVE: ${{ runner.temp }}\windows-native\release
          SOURCE_DIR: ${{ runner.temp }}\ffmpeg-source
          VERSION: ${{ env.ISSHONI_VERSION }}
        run: |
          # M2 06 §2.1, §10.3: the files of release.yml's desktop-pkg step of the same name, from the installer that
          # passed the smoke: everything but the SBOM (goreleaser-full's syft writes it from the stage) and the
          # manifest's signature (a release's sign job). Into desktop-release\, which goreleaser-full downloads into
          # dist-desktop/. The manifest of 0.0.0-nightly.<run> is in the channel ci (tools/desktoppkg), which no
          # release build installs from.
          $out = Join-Path $env:RUNNER_TEMP 'desktop-release'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $utf8 = New-Object Text.UTF8Encoding($false)
          Copy-Item -LiteralPath $env:SETUP -Destination $out

          # The update manifest (06 §8.2), from the installer, the commit's date, deploy/desktop/min-version and
          # deploy/keys/update_revoked.
          go -C tools run ./desktoppkg manifest -version $env:VERSION -installer $env:SETUP `
            -out (Join-Path $out 'isshoni-desktop-update.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # The symbols: isshoni-media.pdb, the FFmpeg PDBs and native-manifest.json (06 §2.1, §5.1).
          $lock = Get-Content -Raw -LiteralPath native/ffmpeg/lock.json | ConvertFrom-Json
          $symbols = @('isshoni-media.pdb', "avcodec-$($lock.avcodecMajor).pdb", "avutil-$($lock.avutilMajor).pdb",
            'native-manifest.json') | ForEach-Object {
            $f = Join-Path $env:NATIVE $_
            if (-not (Test-Path -LiteralPath $f -PathType Leaf)) { throw "the windows-native artifact has no $_" }
            $f
          }
          Compress-Archive -LiteralPath $symbols -DestinationPath (Join-Path $out "isshoni-desktop_$($env:VERSION)_windows_amd64_symbols.zip")

          # The LGPL corresponding source, byte for byte the deps release's (06 §4.5), checked against lock.json.
          $srcName = @($lock.assets.PSObject.Properties.Name | Where-Object { $_ -like '*-source.tar' })
          if ($srcName.Count -ne 1) { throw 'native/ffmpeg/lock.json does not name one source tar' }
          $src = Join-Path $env:SOURCE_DIR $srcName[0]
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $src).Hash.ToLowerInvariant()
          if ($sha -ne [string]$lock.assets.($srcName[0])) { throw "$($srcName[0]) has the SHA-256 $sha, not lock.json's" }
          Copy-Item -LiteralPath $src -Destination (Join-Path $out "isshoni-desktop_$($env:VERSION)_ffmpeg-source.tar")

          # install-desktop.ps1 stamped with the version, as task release:prepare stamps it in goreleaser-full
          # (06 §11.2; release:assets compares the two): exactly one line $IsshoniVersion = '@VERSION@'. The file is
          # LF (.gitattributes), and stays so.
          $text = [IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'deploy/install-desktop.ps1'))
          $placeholder = "`$IsshoniVersion = '@VERSION@'"
          $lines = $text -split "`n"
          if (@($lines | Where-Object { $_ -ceq $placeholder }).Count -ne 1) {
            throw "deploy/install-desktop.ps1 has no single line $placeholder to stamp"
          }
          $stamped = ($lines | ForEach-Object { if ($_ -ceq $placeholder) { "`$IsshoniVersion = '$($env:VERSION)'" } else { $_ } }) -join "`n"
          [IO.File]::WriteAllText((Join-Path $out 'install-desktop.ps1'), $stamped, $utf8)

          Get-ChildItem -LiteralPath $out -File | Sort-Object Name | ForEach-Object { '{0,12}  {1}' -f $_.Length, $_.Name }

      - name: Upload desktop-release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release
          path: ${{ runner.temp }}/desktop-release/
          retention-days: 1
          if-no-files-found: error

      - name: Upload desktop-stage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-stage
          path: dist-desktop/stage/
          retention-days: 1
          if-no-files-found: error

      - name: Hand the desktop files to goreleaser-full
        # The job's desktop-files output: goreleaser-full runs on these files also when a check below fails.
        id: desktop-handover
        run: '"ready=true" >> $env:GITHUB_OUTPUT'


      # From here on the checks that don't need each other run each on its own prerequisites (not on every step
      # before them), so one round reports every independent failure; the job still fails on any of them.
      - name: gcc for cgo (MinGW-w64, for the race detector)
        id: gcc
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        run: |
          if (Get-Command gcc -ErrorAction SilentlyContinue) {
            gcc --version | Select-Object -First 1
            exit 0
          }
          foreach ($dir in 'C:\mingw64\bin', 'C:\msys64\ucrt64\bin', 'C:\msys64\mingw64\bin') {
            if (Test-Path (Join-Path $dir 'gcc.exe')) {
              $dir >> $env:GITHUB_PATH
              & (Join-Path $dir 'gcc.exe') --version | Select-Object -First 1
              exit 0
            }
          }
          "::notice::no gcc on this runner image; installing MinGW-w64 with Chocolatey"
          choco install mingw --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C:\ProgramData\mingw64\mingw64\bin' >> $env:GITHUB_PATH

      - name: go test -race ./internal/media/... ./cmd/isshoni-enginetest/... with the engine DLL (win-x64-ci)
        # The DLL-dependent Go tests (04 §18.2, 06 §16); they skip without ISSHONI_TEST_ENGINE_DLL, so they run here
        # and nowhere else (windows-go runs the rest without the DLL). They use the windows-native artifact's ci\
        # folder (06 §5.1): the win-x64-ci DLL with the lock-checked FFmpeg DLLs next to it, since the engine loads
        # them from its own folder (04 §9.2). README WA44 adds isshoni-enginetest: its startup's process default (04
        # §13.3 layer 2, with the marker DLL built by the gcc above) and its probe against that DLL. 06 R5: the run
        # must contain TestNativeIntoPublisher's PASS (04 §18.2's milestone), not a skip.
        if: ${{ !cancelled() && steps.gcc.outcome == 'success' && steps.native.outcome == 'success' }}
        env:
          CGO_ENABLED: '1'
          ISSHONI_TEST_ENGINE_DLL: ${{ runner.temp }}\windows-native\ci\isshoni-media.dll
        run: |
          if (-not (Test-Path -LiteralPath $env:ISSHONI_TEST_ENGINE_DLL -PathType Leaf)) {
            throw "no $env:ISSHONI_TEST_ENGINE_DLL in the windows-native artifact"
          }
          $log = Join-Path $env:RUNNER_TEMP 'go-test-dll.log'
          go test -race -count=1 -timeout 15m -v ./internal/media/... ./cmd/isshoni-enginetest/... 2>&1 |
            Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
          $lines = Get-Content -LiteralPath $log
          if ($lines -match '^\s*--- SKIP: TestNativeIntoPublisher\b') { throw 'TestNativeIntoPublisher was skipped' }
          if (-not ($lines -match '^\s*--- PASS: TestNativeIntoPublisher\b')) {
            throw 'TestNativeIntoPublisher did not run (no PASS line in the go test output)'
          }
          "TestNativeIntoPublisher: $(@($lines -match '^\s*--- PASS: TestNativeIntoPublisher\b')[0].Trim())"

      - name: isshoni-audiotest selfcheck (the win-x64-ci DLL)
        if: ${{ !cancelled() && steps.go.outcome == 'success' && steps.native.outcome == 'success' }}
        run: |
          # 05 §18.2 (CI Windows runs it): the analyzer on synthetic signals, then native.Open of the DLL next to the
          # exe (im_version, every export, the im_test_* hooks of the ci\ build), the probe and a watcher start and
          # stop. No sound: the hosted runner has no audio endpoint. Built as the app is (CGO_ENABLED=0).
          $dir = Join-Path $env:RUNNER_TEMP 'audiotest'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item -Path (Join-Path $env:RUNNER_TEMP 'windows-native\ci\*') -Destination $dir
          $exe = Join-Path $dir 'isshoni-audiotest.exe'
          $env:CGO_ENABLED = '0'
          go build -trimpath -o $exe ./cmd/isshoni-audiotest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe selfcheck
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "isshoni-audiotest selfcheck exited $code" }

      - name: Pester under Windows PowerShell 5.1 (task test:ps PWSH=powershell)
        # M2 06 §16: deploy/test/install-desktop.Tests.ps1 under Windows PowerShell 5.1 (lint-deploy runs it under
        # pwsh). This step's shell is Windows PowerShell, and PSModulePath is the machine's: a powershell.exe started
        # from pwsh would inherit pwsh's module path and load PowerShell 7's modules.
        if: ${{ !cancelled() && steps.task.outcome == 'success' }}
        shell: powershell
        run: |
          $env:PSModulePath = [Environment]::GetEnvironmentVariable('PSModulePath', 'Machine')
          "Windows PowerShell $($PSVersionTable.PSVersion)"
          task test:ps PWSH=powershell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: The PowerShell 5.1 grammar check
        # M2 06 §10.1, §16: every script that runs under Windows PowerShell 5.1 parses with its parser
        # ([System.Management.Automation.Language.Parser]::ParseFile under powershell.exe); lint:ps (PSScriptAnalyzer
        # with PSUseCompatibleSyntax) runs under pwsh in lint-deploy.
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw "this is PowerShell $($PSVersionTable.PSVersion), not 5.1" }
          $files = @(Get-Item -LiteralPath 'deploy/install-desktop.ps1', 'deploy/test/install-desktop.Tests.ps1',
            'deploy/windows/msvc-env.ps1') + @(Get-ChildItem -Path 'deploy/test/windows/*.ps1', 'native/windows/tools/*.ps1' -File)
          $bad = 0
          foreach ($f in $files) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $bad++
              foreach ($e in $errors) {
                $rel = Resolve-Path -LiteralPath $f.FullName -Relative
                "::error file=$($rel.TrimStart('.\').Replace('\', '/')),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              }
            }
          }
          if ($bad -gt 0) { throw "$bad of $($files.Count) scripts don't parse under Windows PowerShell $($PSVersionTable.PSVersion)" }
          "$($files.Count) scripts parse under Windows PowerShell $($PSVersionTable.PSVersion)"

      - name: install-desktop.ps1 under Windows PowerShell 5.1 against relserve
        # M2 06 R10's Windows run (§7.1, §7.2): tools/relserve serves the CI installer as a release, with a
        # checksums.txt signed by a key made for this run, whose public key replaces the script's key block (as M1's
        # distro test does for install.sh). Windows PowerShell 5.1 runs the script as `irm | iex` does
        # (ISSHONI_DOWNLOAD_BASE, ISSHONI_NO_LAUNCH=1; ISSHONI_VERSION is this workflow's), verifying with the inbox
        # ssh-keygen. A mirror with a changed installer and one whose checksums.txt is signed by another key are
        # refused first, with nothing installed; then the real one installs, and is uninstalled again (/PURGE).
        # It refuses to start over an install a failed smoke left behind.
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        env:
          SETUP: ${{ steps.package.outputs.setup }}
          VERSION: ${{ env.ISSHONI_VERSION }}
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'ps1-install'
          $rel = Join-Path $work 'releases'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $name = "isshoni-desktop_$($env:VERSION)_windows_amd64_setup.exe"
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\isshoni'
          $utf8 = New-Object Text.UTF8Encoding($false)
          if (Test-Path -LiteralPath $installDir) { throw "$installDir exists before the test (left by the smoke?)" }

          # The inbox OpenSSH Client, which the script prefers (06 §7.2).
          $openssh = Join-Path $env:SystemRoot 'System32\OpenSSH'
          $sk = Join-Path $openssh 'ssh-keygen.exe'
          if (-not (Test-Path -LiteralPath $sk -PathType Leaf)) { throw "this runner has no inbox $sk" }
          "inbox OpenSSH: $((& (Join-Path $openssh 'ssh.exe') -V 2>&1 | Out-String).Trim())"
          foreach ($k in 'good', 'other') {
            $key = Join-Path $work "key-$k"
            & $sk -q -t ed25519 -N '' -C "isshoni-ci-ps1-$k" -f $key
            if ($LASTEXITCODE -ne 0) { throw "ssh-keygen could not make the $k key" }
            # Windows' OpenSSH refuses a private key that other accounts can read; RUNNER_TEMP's ACL is inherited.
            icacls $key /inheritance:r /grant:r "$($env:USERNAME):(F)" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "icacls could not restrict $key" }
          }

          # Three release roots (tools/relserve): the release, a mirror with a changed installer, and a mirror whose
          # checksums.txt is signed by the other key.
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $env:SETUP).Hash.ToLowerInvariant()
          foreach ($root in @(@('', 'good', $false), @('tampered', 'good', $true), @('wrongkey', 'other', $false))) {
            $d = [IO.Path]::Combine($rel, $root[0], 'download', "v$($env:VERSION)")
            New-Item -ItemType Directory -Force -Path $d | Out-Null
            Copy-Item -LiteralPath $env:SETUP -Destination (Join-Path $d $name)
            if ($root[2]) { [IO.File]::AppendAllText((Join-Path $d $name), 'x') }
            $sums = Join-Path $d 'checksums.txt'
            [IO.File]::WriteAllText($sums, "$sha  $name`n", $utf8)
            & $sk -Y sign -f (Join-Path $work "key-$($root[1])") -n isshoni-checksums $sums 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath "$sums.sig")) { throw "ssh-keygen -Y sign failed for $d" }
          }

          # The script with this run's key in its key block (LF kept: .gitattributes checks it out with LF).
          $pub = (Get-Content -Raw -LiteralPath (Join-Path $work 'key-good.pub')).Trim()
          $signer = "isshoni-release namespaces=`"isshoni-checksums`" $pub"
          $src = [IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'deploy/install-desktop.ps1'))
          $m = [regex]::Match($src, '(?m)^(# BEGIN ALLOWED SIGNERS[^\n]*\n)(?:[^\n]*\n)*?(# END ALLOWED SIGNERS)')
          if (-not $m.Success) { throw 'deploy/install-desktop.ps1 has no key block' }
          $text = $src.Substring(0, $m.Index) + $m.Groups[1].Value + $signer + "`n" + $m.Groups[2].Value +
            $src.Substring($m.Index + $m.Length)
          $ps1 = Join-Path $work 'install-desktop.ps1'
          [IO.File]::WriteAllText($ps1, $text, $utf8)

          $relserve = Join-Path $work 'relserve.exe'
          go -C (Join-Path $env:GITHUB_WORKSPACE 'tools') build -o $relserve ./relserve
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ca = Join-Path $work 'ca.pem'
          $ready = Join-Path $work 'addr'
          $server = Start-Process -FilePath $relserve -PassThru -NoNewWindow `
            -ArgumentList @('-dir', "`"$rel`"", '-addr', '127.0.0.1:0', '-ca-out', "`"$ca`"", '-ready-file', "`"$ready`"") `
            -RedirectStandardOutput (Join-Path $work 'relserve.out') -RedirectStandardError (Join-Path $work 'relserve.err')
          $store = $null
          $cert = $null
          try {
            $deadline = (Get-Date).AddSeconds(30)
            while (-not (Test-Path -LiteralPath $ready)) {
              if ($server.HasExited) { throw "relserve exited ($($server.ExitCode)): $(Get-Content -Raw (Join-Path $work 'relserve.err'))" }
              if ((Get-Date) -gt $deadline) { throw 'relserve did not start within 30 s' }
              Start-Sleep -Milliseconds 200
            }
            $base = "https://$((Get-Content -Raw -LiteralPath $ready).Trim())"
            # The hosted runner is an administrator: its test CA goes into the machine's root store (no dialog) for
            # the .NET Framework's TLS, and out again below.
            $cert = New-Object Security.Cryptography.X509Certificates.X509Certificate2($ca)
            $store = New-Object Security.Cryptography.X509Certificates.X509Store('Root', 'LocalMachine')
            $store.Open('ReadWrite')
            $store.Add($cert)

            # Runs the script as `irm <server>/install-desktop.ps1 | iex` does, under Windows PowerShell 5.1 with the
            # machine's module path (not pwsh's), and returns its exit code, stdout and stderr.
            function Invoke-InstallScript {
              param([string]$Base, [string]$Label)
              $saved = $env:PSModulePath
              $env:PSModulePath = [Environment]::GetEnvironmentVariable('PSModulePath', 'Machine')
              $env:ISSHONI_DOWNLOAD_BASE = $Base
              $env:ISSHONI_NO_LAUNCH = '1'
              $env:ISSHONI_NO_UPDATE_CHECKS = '1'
              $errFile = Join-Path $work "$Label.err"
              try {
                # Progress off before anything loads: 5.1 with redirected output writes progress records to stderr.
                $out = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command `
                  "`$ProgressPreference = 'SilentlyContinue'; Get-Content -Raw -LiteralPath '$ps1' | Invoke-Expression" `
                  2>$errFile | Out-String
                $code = $LASTEXITCODE
              } finally {
                $env:PSModulePath = $saved
                Remove-Item Env:ISSHONI_DOWNLOAD_BASE, Env:ISSHONI_NO_LAUNCH, Env:ISSHONI_NO_UPDATE_CHECKS -ErrorAction SilentlyContinue
              }
              $err = ''
              if (Test-Path -LiteralPath $errFile) { $err = [IO.File]::ReadAllText($errFile) }
              # A CLIXML block of progress records only (e.g. 5.1's 'Preparing modules for first use.') is not the
              # script writing to stderr; anything else in it (an S="Error" record) still counts.
              if ($err -match '^\s*#< CLIXML\s*(<Objs[\s\S]*</Objs>)\s*$') {
                $records = $null
                try {
                  $x = [xml]('<r>' + $Matches[1] + '</r>') # one or more <Objs> blocks
                  $records = @($x.SelectNodes('/r/*[local-name()="Objs"]/*'))
                } catch {
                  Write-Host "stderr's CLIXML doesn't parse: $($_.Exception.Message)"
                }
                if ($null -ne $records -and @($records | Where-Object { $_.GetAttribute('S') -ne 'progress' }).Count -eq 0) {
                  Write-Host "stderr (progress records only, ignored): $err"
                  $err = ''
                }
              }
              Write-Host "---- $Label ($Base): exit $code"
              Write-Host $out
              if ($err.Trim()) { Write-Host "stderr: $err" }
              return [pscustomobject]@{ Code = $code; Out = $out; Err = $err }
            }
            function Confirm-Refused {
              param($R, [string]$Why, [string]$Label)
              if ($R.Code -ne 0 -or $R.Err.Trim()) { throw "${Label}: the script exited $($R.Code) or wrote to stderr" }
              if (-not $R.Out.Contains($Why)) { throw "${Label}: no '$Why' line" }
              if (-not $R.Out.Contains('Nothing was installed.')) { throw "${Label}: no 'Nothing was installed.' line" }
              if ($R.Out.Contains('is installed.') -or (Test-Path -LiteralPath $installDir)) { throw "${Label}: it installed" }
            }

            $r = Invoke-InstallScript -Base "$base/tampered" -Label 'tampered'
            Confirm-Refused $r "does not match checksums.txt" 'a tampered installer'
            $r = Invoke-InstallScript -Base "$base/wrongkey" -Label 'wrongkey'
            Confirm-Refused $r 'The signature of checksums.txt is not valid' 'checksums.txt signed by another key'

            $r = Invoke-InstallScript -Base $base -Label 'release'
            if ($r.Code -ne 0 -or $r.Err.Trim()) { throw "the install exited $($r.Code) or wrote to stderr" }
            if (-not ($r.Out -match '(?m)^Good "isshoni-checksums" signature for isshoni-release with ED25519 key SHA256:')) {
              throw "the script printed no 'Good ... signature' line from ssh-keygen"
            }
            if (-not $r.Out.Contains("isshoni $($env:VERSION) is installed.")) { throw "no 'isshoni $($env:VERSION) is installed.' line" }
            $exe = Join-Path $installDir 'isshoni.exe'
            if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "no $exe after the install" }
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $exe
            $psi.Arguments = '--version'
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.CreateNoWindow = $true
            $p = [System.Diagnostics.Process]::Start($psi)
            $text = $p.StandardOutput.ReadToEnd()
            if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'isshoni.exe --version did not exit within 60 s' }
            $installed = ($text | ConvertFrom-Json).version
            if ($installed -cne $env:VERSION) { throw "the installed isshoni.exe --version says '$installed', not $($env:VERSION)" }
            "installed: $exe ($installed)"

            # Uninstall (/PURGE): uninstall.exe copies itself to a ~nsu*.tmp folder and exits; the copy does the work.
            $uninstaller = Join-Path $installDir 'uninstall.exe'
            $u = Start-Process -FilePath $uninstaller -ArgumentList '/S', '/PURGE' -PassThru
            $null = $u.Handle
            $u.WaitForExit()
            if ($u.ExitCode -ne 0) { throw "uninstall.exe /S /PURGE exited $($u.ExitCode)" }
            $deadline = (Get-Date).AddSeconds(180)
            do {
              Start-Sleep -Milliseconds 250
              $running = @(Get-CimInstance -ClassName Win32_Process | Where-Object { $_.ExecutablePath -like '*\~nsu*.tmp\*' })
              if ((Get-Date) -gt $deadline) { throw 'the uninstaller did not finish within 180 s' }
            } while ($running.Count -gt 0 -or (Test-Path -LiteralPath $uninstaller))
            if (Test-Path -LiteralPath $exe) { throw "$exe is still there after the uninstall" }
          } finally {
            if ($null -ne $store) {
              if ($null -ne $cert) { $store.Remove($cert) }
              $store.Close()
            }
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

      - name: The server-rendered install-desktop.ps1 (isshoni serve, irm | iex under Windows PowerShell 5.1)
        # M2 06 §16's server-rendered ps1 row (R13, README WA81): the script as a server serves it (§7.4), not the
        # file. A CI build of the server (off mode on loopback, deploy/dev/isshoni.e2e.toml) embeds
        # deploy/install-desktop.ps1 with a key of this run in its key block (as §11.4 replaces it), and serves
        # /install-desktop.ps1 with its own origin as $IsshoniServer and, being a CI build, no version, so the
        # script installs relserve's latest release (-latest, the CI installer signed by that key). Each case runs
        # `powershell.exe -NoProfile -Command "irm <server>/install-desktop.ps1 | iex"`, Windows PowerShell 5.1,
        # with ISSHONI_DOWNLOAD_BASE and ISSHONI_NO_LAUNCH=1, and must exit 0 with nothing on stderr (no error record
        # escapes the script): a tampered installer and a checksums.txt signed by another key are refused, and so is
        # an installer that is a text file, correctly listed in a correctly signed checksums.txt (Windows can't
        # start it: the "isshoni: Windows blocked the installer (" line and "Nothing was installed."), each with
        # nothing installed; then the release installs with PendingServer = the server's origin, and is uninstalled.
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        env:
          SETUP: ${{ steps.package.outputs.setup }}
          VERSION: ${{ env.ISSHONI_VERSION }}
        run: |
          # The workflow's ISSHONI_VERSION is not for the server (it reads ISSHONI_* names as its settings) nor for
          # the script (it would pick the version itself): this step's process drops it.
          Remove-Item Env:ISSHONI_VERSION -ErrorAction SilentlyContinue
          $work = Join-Path $env:RUNNER_TEMP 'ps1-server'
          $rel = Join-Path $work 'releases'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $name = "isshoni-desktop_$($env:VERSION)_windows_amd64_setup.exe"
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\isshoni'
          $utf8 = New-Object Text.UTF8Encoding($false)
          if (Test-Path -LiteralPath $installDir) { throw "$installDir exists before the test (left by an earlier step?)" }

          $sk = Join-Path $env:SystemRoot 'System32\OpenSSH\ssh-keygen.exe'
          if (-not (Test-Path -LiteralPath $sk -PathType Leaf)) { throw "this runner has no inbox $sk" }
          foreach ($k in 'good', 'other') {
            $key = Join-Path $work "key-$k"
            & $sk -q -t ed25519 -N '' -C "isshoni-ci-ps1-server-$k" -f $key
            if ($LASTEXITCODE -ne 0) { throw "ssh-keygen could not make the $k key" }
            icacls $key /inheritance:r /grant:r "$($env:USERNAME):(F)" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "icacls could not restrict $key" }
          }

          # Four release roots (tools/relserve): the release, a changed installer, a checksums.txt signed by the
          # other key, and a text file in the installer's place, listed with its own SHA-256 and signed by the key.
          $notExe = Join-Path $work 'not-an-installer.txt'
          [IO.File]::WriteAllText($notExe, "This is a text file, not an installer.`r`n", $utf8)
          foreach ($root in @(@('', 'good', $env:SETUP, $false), @('tampered', 'good', $env:SETUP, $true),
              @('wrongkey', 'other', $env:SETUP, $false), @('notexe', 'good', $notExe, $false))) {
            $d = [IO.Path]::Combine($rel, $root[0], 'download', "v$($env:VERSION)")
            New-Item -ItemType Directory -Force -Path $d | Out-Null
            Copy-Item -LiteralPath $root[2] -Destination (Join-Path $d $name)
            $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $root[2]).Hash.ToLowerInvariant()
            if ($root[3]) { [IO.File]::AppendAllText((Join-Path $d $name), 'x') }
            $sums = Join-Path $d 'checksums.txt'
            [IO.File]::WriteAllText($sums, "$sha  $name`n", $utf8)
            & $sk -Y sign -f (Join-Path $work "key-$($root[1])") -n isshoni-checksums $sums 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath "$sums.sig")) { throw "ssh-keygen -Y sign failed for $d" }
          }

          # The CI server with this run's key in the script it embeds (deploy.InstallDesktopPS1): the checkout's file
          # is changed for the build only, and put back byte for byte.
          $pub = (Get-Content -Raw -LiteralPath (Join-Path $work 'key-good.pub')).Trim()
          $signer = "isshoni-release namespaces=`"isshoni-checksums`" $pub"
          $srcPath = Join-Path $env:GITHUB_WORKSPACE 'deploy/install-desktop.ps1'
          $original = [IO.File]::ReadAllBytes($srcPath)
          $src = $utf8.GetString($original)
          $m = [regex]::Match($src, '(?m)^(# BEGIN ALLOWED SIGNERS[^\n]*\n)(?:[^\n]*\n)*?(# END ALLOWED SIGNERS)')
          if (-not $m.Success) { throw 'deploy/install-desktop.ps1 has no key block' }
          $server = Join-Path $work 'isshoni.exe'
          try {
            [IO.File]::WriteAllText($srcPath, $src.Substring(0, $m.Index) + $m.Groups[1].Value + $signer + "`n" +
              $m.Groups[2].Value + $src.Substring($m.Index + $m.Length), $utf8)
            $env:CGO_ENABLED = '0'
            go build -trimpath -ldflags "-X github.com/MoonWX/isshoni/internal/version.version=$($env:VERSION)" -o $server ./cmd/isshoni
            if ($LASTEXITCODE -ne 0) { throw "go build ./cmd/isshoni exited $LASTEXITCODE" }
          } finally {
            [IO.File]::WriteAllBytes($srcPath, $original)
          }

          # Free ports for the server (HTTP, and ICE, which it binds too) and relserve's own.
          function Get-FreePort {
            $l = New-Object Net.Sockets.TcpListener([Net.IPAddress]::Loopback, 0)
            $l.Start()
            try { return $l.LocalEndpoint.Port } finally { $l.Stop() }
          }
          $httpPort = Get-FreePort
          $icePort = Get-FreePort
          $origin = "http://127.0.0.1:$httpPort"

          $relserve = Join-Path $work 'relserve.exe'
          go -C (Join-Path $env:GITHUB_WORKSPACE 'tools') build -o $relserve ./relserve
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ca = Join-Path $work 'ca.pem'
          $ready = Join-Path $work 'addr'
          $rs = Start-Process -FilePath $relserve -PassThru -NoNewWindow `
            -ArgumentList @('-dir', "`"$rel`"", '-latest', $env:VERSION, '-addr', '127.0.0.1:0', '-ca-out', "`"$ca`"",
              '-ready-file', "`"$ready`"") `
            -RedirectStandardOutput (Join-Path $work 'relserve.out') -RedirectStandardError (Join-Path $work 'relserve.err')
          $srv = $null
          $store = $null
          $cert = $null
          try {
            # The server: off mode on loopback, a temporary data directory, its own admin socket.
            $env:ISSHONI_DATA_DIR = Join-Path $work 'data'
            $env:ISSHONI_ALLOW_EPHEMERAL_DATA = '1'
            try {
              $srv = Start-Process -FilePath $server -PassThru -NoNewWindow `
                -ArgumentList @('serve', '--config', "`"$(Join-Path $env:GITHUB_WORKSPACE 'deploy/dev/isshoni.e2e.toml')`"",
                  "--public-url=$origin", "--listen.http=127.0.0.1:$httpPort", "--listen.ice-udp=:$icePort",
                  "--listen.ice-tcp=:$icePort", "--listen.admin-socket=`"$(Join-Path $work 'admin.sock')`"") `
                -RedirectStandardOutput (Join-Path $work 'server.out') -RedirectStandardError (Join-Path $work 'server.err')
            } finally {
              Remove-Item Env:ISSHONI_DATA_DIR, Env:ISSHONI_ALLOW_EPHEMERAL_DATA -ErrorAction SilentlyContinue
            }
            $deadline = (Get-Date).AddSeconds(60)
            $served = $null
            while ($null -eq $served) {
              if ($srv.HasExited) {
                throw "isshoni serve exited ($($srv.ExitCode)): $(Get-Content -Raw (Join-Path $work 'server.out')) $(Get-Content -Raw (Join-Path $work 'server.err'))"
              }
              try { $served = Invoke-WebRequest -UseBasicParsing -Uri "$origin/install-desktop.ps1" } catch { Start-Sleep -Milliseconds 250 }
              if ($null -eq $served -and (Get-Date) -gt $deadline) { throw "isshoni serve did not answer $origin/install-desktop.ps1 within 60 s" }
            }
            $script = [string]$served.Content
            foreach ($want in @("`n`$IsshoniServer  = '$origin'`n", "`n`$IsshoniVersion = ''`n", "`n$signer`n")) {
              if (-not $script.Contains($want)) { throw "the served script has no line $($want.Trim())" }
            }
            "$origin/install-desktop.ps1: $($served.Headers['Content-Type']), $($script.Length) bytes, pre-filled with $origin"

            while (-not (Test-Path -LiteralPath $ready)) {
              if ($rs.HasExited) { throw "relserve exited ($($rs.ExitCode)): $(Get-Content -Raw (Join-Path $work 'relserve.err'))" }
              Start-Sleep -Milliseconds 200
            }
            $base = "https://$((Get-Content -Raw -LiteralPath $ready).Trim())"
            $cert = New-Object Security.Cryptography.X509Certificates.X509Certificate2($ca)
            $store = New-Object Security.Cryptography.X509Certificates.X509Store('Root', 'LocalMachine')
            $store.Open('ReadWrite')
            $store.Add($cert)

            # `irm <server>/install-desktop.ps1 | iex` in Windows PowerShell 5.1 (the machine's module path, not
            # pwsh's); returns its exit code, stdout and stderr.
            function Invoke-ServedScript {
              param([string]$Base, [string]$Label)
              $saved = $env:PSModulePath
              $env:PSModulePath = [Environment]::GetEnvironmentVariable('PSModulePath', 'Machine')
              $env:ISSHONI_DOWNLOAD_BASE = $Base
              $env:ISSHONI_NO_LAUNCH = '1'
              $errFile = Join-Path $work "$Label.err"
              try {
                $out = & powershell.exe -NoProfile -Command "irm $origin/install-desktop.ps1 | iex" 2>$errFile | Out-String
                $code = $LASTEXITCODE
              } finally {
                $env:PSModulePath = $saved
                Remove-Item Env:ISSHONI_DOWNLOAD_BASE, Env:ISSHONI_NO_LAUNCH -ErrorAction SilentlyContinue
              }
              $err = ''
              if (Test-Path -LiteralPath $errFile) { $err = [IO.File]::ReadAllText($errFile) }
              # A CLIXML block of progress records only (irm's progress, 5.1's 'Preparing modules for first use.') is
              # not an error; any other record in it (S="Error") still counts.
              if ($err -match '^\s*#< CLIXML\s*(<Objs[\s\S]*</Objs>)\s*$') {
                $records = $null
                try {
                  $x = [xml]('<r>' + $Matches[1] + '</r>')
                  $records = @($x.SelectNodes('/r/*[local-name()="Objs"]/*'))
                } catch {
                  Write-Host "stderr's CLIXML doesn't parse: $($_.Exception.Message)"
                }
                if ($null -ne $records -and @($records | Where-Object { $_.GetAttribute('S') -ne 'progress' }).Count -eq 0) {
                  Write-Host "stderr (progress records only, ignored): $err"
                  $err = ''
                }
              }
              Write-Host "---- $Label ($Base): exit $code"
              Write-Host $out
              if ($err.Trim()) { Write-Host "stderr: $err" }
              return [pscustomobject]@{ Code = $code; Out = $out; Err = $err }
            }
            function Confirm-Refused {
              param($R, [string]$Why, [string]$Label)
              if ($R.Code -ne 0 -or $R.Err.Trim()) { throw "${Label}: the irm | iex process exited $($R.Code) or wrote to stderr" }
              if (-not $R.Out.Contains($Why)) { throw "${Label}: no '$Why' line" }
              if (-not $R.Out.Contains('Nothing was installed.')) { throw "${Label}: no 'Nothing was installed.' line" }
              if ($R.Out.Contains('is installed.') -or (Test-Path -LiteralPath $installDir)) { throw "${Label}: it installed" }
            }

            $r = Invoke-ServedScript -Base "$base/tampered" -Label 'served-tampered'
            Confirm-Refused $r 'does not match checksums.txt' 'a tampered installer'
            $r = Invoke-ServedScript -Base "$base/wrongkey" -Label 'served-wrongkey'
            Confirm-Refused $r 'The signature of checksums.txt is not valid' 'checksums.txt signed by another key'
            $r = Invoke-ServedScript -Base "$base/notexe" -Label 'served-notexe'
            Confirm-Refused $r 'isshoni: Windows blocked the installer (' 'an installer that is not an executable'

            $r = Invoke-ServedScript -Base $base -Label 'served-release'
            if ($r.Code -ne 0 -or $r.Err.Trim()) { throw "the install exited $($r.Code) or wrote to stderr" }
            if (-not ($r.Out -match '(?m)^Good "isshoni-checksums" signature for isshoni-release with ED25519 key SHA256:')) {
              throw "the script printed no 'Good ... signature' line from ssh-keygen"
            }
            if (-not $r.Out.Contains("isshoni $($env:VERSION) is installed.")) { throw "no 'isshoni $($env:VERSION) is installed.' line" }
            $pending = (Get-ItemProperty -LiteralPath 'HKCU:\Software\isshoni' -Name PendingServer -ErrorAction SilentlyContinue).PendingServer
            if ([string]$pending -cne $origin) { throw "PendingServer is '$pending', not the server's origin $origin" }
            "installed $($env:VERSION) from the served script; PendingServer = $pending"

            # Uninstall (/PURGE): uninstall.exe copies itself to a ~nsu*.tmp folder and exits; the copy does the work.
            $exe = Join-Path $installDir 'isshoni.exe'
            $uninstaller = Join-Path $installDir 'uninstall.exe'
            $u = Start-Process -FilePath $uninstaller -ArgumentList '/S', '/PURGE' -PassThru
            $null = $u.Handle
            $u.WaitForExit()
            if ($u.ExitCode -ne 0) { throw "uninstall.exe /S /PURGE exited $($u.ExitCode)" }
            $deadline = (Get-Date).AddSeconds(180)
            do {
              Start-Sleep -Milliseconds 250
              $running = @(Get-CimInstance -ClassName Win32_Process | Where-Object { $_.ExecutablePath -like '*\~nsu*.tmp\*' })
              if ((Get-Date) -gt $deadline) { throw 'the uninstaller did not finish within 180 s' }
            } while ($running.Count -gt 0 -or (Test-Path -LiteralPath $uninstaller))
            if (Test-Path -LiteralPath $exe) { throw "$exe is still there after the uninstall" }
            if (Test-Path -LiteralPath 'HKCU:\Software\isshoni') { throw 'HKCU\Software\isshoni is left after the uninstall' }
          } finally {
            if ($null -ne $store) {
              if ($null -ne $cert) { $store.Remove($cert) }
              $store.Close()
            }
            foreach ($p in @($srv, $rs)) {
              if ($null -ne $p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            }
            if (Test-Path -LiteralPath (Join-Path $work 'server.out')) {
              "---- isshoni serve's log (last 20 lines)"
              Get-Content -LiteralPath (Join-Path $work 'server.out'), (Join-Path $work 'server.err') -Tail 20 -ErrorAction SilentlyContinue
            }
          }

      - name: The WebView2 runtime (120.0 or newer) for the CDP spec
        id: webview2
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        env:
          WEBVIEW2: ${{ runner.temp }}\windows-native\release\MicrosoftEdgeWebview2Setup.exe
        run: |
          # M2 06 §10.1: the runtime's pv from 06 §6.5's keys; when it is missing or below 120.0 (03 §5.4's minimum),
          # the windows-native artifact's bootstrapper (its signature checked there) installs it, so the CDP spec
          # doesn't depend on the smoke's install having run first.
          function Get-WebView2Version {
            $guid = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
            foreach ($key in "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$guid",
                             "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$guid") {
              $pv = (Get-ItemProperty -LiteralPath $key -Name pv -ErrorAction SilentlyContinue).pv
              $v = $null
              if ($pv -and [version]::TryParse([string]$pv, [ref]$v) -and $v -ge [version]'120.0') { return $v }
            }
            return $null
          }
          $v = Get-WebView2Version
          if ($v) {
            "WebView2 runtime $v"
            exit 0
          }
          "::notice::no WebView2 runtime 120.0 or newer; installing it with the checked bootstrapper"
          $p = Start-Process -FilePath $env:WEBVIEW2 -ArgumentList '/silent', '/install' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(15 * 60 * 1000)) { $p.Kill(); throw 'the WebView2 bootstrapper did not finish within 15 minutes' }
          $v = Get-WebView2Version
          if (-not $v) { throw "the WebView2 bootstrapper exited $($p.ExitCode) and no runtime 120.0 or newer is registered" }
          "WebView2 runtime $v (installed)"

      - name: The autostart round trip (TestAutostartRoundTrip, 03 §16.1, README WA84)
        if: ${{ !cancelled() && steps.go.outcome == 'success' && steps.webdist.outcome == 'success' && steps.webview2.outcome == 'success' }}
        run: |
          # The e2e build started as the Run value starts it (--autostart) shows no window, and a second launch shows
          # one. It needs web/dist and a WebView2 runtime, both here; ISSHONI_REQUIRE_AUTOSTART_E2E=1 turns a missing
          # prerequisite into a failure, and the test must PASS (not skip). It runs without -race (CGO_ENABLED=0). It
          # builds its own e2e exe, and runs twice: here, before the updater e2e (a session nothing else has touched),
          # and again right after it, where PR #56's first run failed: that step starts installed apps, installers
          # and mutex helpers in this session, and the test needs the single-instance names (the per-user pipe
          # included) that nothing else holds. The two runs tell a broken product path from the updater e2e's leftover.
          $env:CGO_ENABLED = '0'
          $env:ISSHONI_REQUIRE_AUTOSTART_E2E = '1'
          $log = Join-Path $env:RUNNER_TEMP 'go-test-autostart.log'
          go test -v -count=1 -run '^TestAutostartRoundTrip$' ./cmd/isshoni-desktop/ | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ((Get-Content -LiteralPath $log) -match '^--- PASS: TestAutostartRoundTrip\b')) {
            throw "TestAutostartRoundTrip did not pass (no '--- PASS: TestAutostartRoundTrip' line)"
          }

      - name: The updater e2e (two updatetest builds, relserve, smoke.ps1 -Mode update)
        # M2 06 §8.11, §16, R9 (README WA88). Two updatetest builds of isshoni.exe (TAGS=production,updatetest, 06
        # §5.2; only that tag makes a ci.N version eligible, §8.11), 0.0.1-ci.1 and 0.0.1-ci.2, each packed into an
        # installer from a copy of the stage with that exe in place of the release one. An ed25519 update key made
        # for this run only (never a release key) signs three manifests that tools/desktoppkg manifest -releases
        # writes, and tools/relserve serves them over HTTPS on loopback (its test CA in the machine's root store, which
        # Go's verifier on Windows reads, and out again below), with latest = ci.2: the release root (ci.2's
        # manifest), badsha/ (the same manifest with ci.1's installer's SHA-256, correctly signed) and ci0/ (a
        # manifest for 0.0.1-ci.0 as the latest, older than the installed ci.1). smoke.ps1 -Mode update then runs
        # §16's cases with ISSHONI_UPDATE_TEST_BASE and ISSHONI_UPDATE_TEST_SIGNERS, de-elevated (the job is elevated,
        # and an elevated installer would start the app through explorer.exe without --updated-from, §6.4).
        # Whatever fails, the step leaves no install behind for the steps after it. windows-full runs it on every
        # night, whatever changed (ci.yml's windows-desktop only on the update filter's changes).
        id: update-e2e
        if: ${{ !cancelled() && steps.package.outcome == 'success' && steps.nsis.outcome == 'success' && steps.webview2.outcome == 'success' }}
        timeout-minutes: 25
        env:
          MAKENSIS: ${{ steps.nsis.outputs.makensis }}
          NATIVE: ${{ runner.temp }}\windows-native\release
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'update-e2e'
          $rel = Join-Path $work 'releases'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $old = '0.0.1-ci.1'
          $new = '0.0.1-ci.2'
          $ci0 = '0.0.1-ci.0'
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\isshoni'
          $utf8 = New-Object Text.UTF8Encoding($false)
          if (Test-Path -LiteralPath $installDir) { throw "$installDir exists before the test (left by an earlier step?)" }
          # Anything named isshoni.exe before this step was left by an earlier one: name it here, so the cleanup below
          # blames only what this step left.
          $earlier = @(Get-CimInstance -ClassName Win32_Process -Filter "Name = 'isshoni.exe'")
          if ($earlier.Count -gt 0) {
            throw "isshoni.exe runs before the updater e2e (left by an earlier step): $(($earlier | ForEach-Object { "$($_.ProcessId) $($_.ExecutablePath)" }) -join '; ')"
          }

          $stage = Join-Path $env:GITHUB_WORKSPACE 'dist-desktop/stage'
          $uninstaller = Join-Path $env:GITHUB_WORKSPACE 'dist-desktop/.build/uninst/uninstall.exe'
          $webview2 = Join-Path $env:NATIVE 'MicrosoftEdgeWebview2Setup.exe'
          $setups = @{}
          foreach ($v in $old, $new) {
            task desktop:exe:windows 'TAGS=production,updatetest' "VERSION=$v"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $st = Join-Path $work "stage-$v"
            Copy-Item -LiteralPath $stage -Destination $st -Recurse
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'dist-desktop/windows_amd64-test/isshoni.exe') `
              -Destination (Join-Path $st 'isshoni.exe') -Force
            $setups[$v] = Join-Path $work "isshoni-desktop_$($v)_windows_amd64_setup.exe"
            go -C tools run ./desktoppkg nsis -version $v -stage $st -out $setups[$v] -webview2 $webview2 `
              -prebuilt-uninstaller $uninstaller -makensis $env:MAKENSIS
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          # The update key and its allowed-signers line (ISSHONI_UPDATE_TEST_SIGNERS, 06 §8.3's format).
          $sk = Join-Path $env:SystemRoot 'System32\OpenSSH\ssh-keygen.exe'
          if (-not (Test-Path -LiteralPath $sk -PathType Leaf)) { throw "this runner has no inbox $sk" }
          $key = Join-Path $work 'update-key'
          & $sk -q -t ed25519 -N '' -C 'isshoni-update-ci' -f $key
          if ($LASTEXITCODE -ne 0) { throw 'ssh-keygen could not make the update key' }
          icacls $key /inheritance:r /grant:r "$($env:USERNAME):(F)" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "icacls could not restrict $key" }
          $signers = Join-Path $work 'update_signers'
          $pub = (Get-Content -Raw -LiteralPath "$key.pub").Trim()
          [IO.File]::WriteAllText($signers, "isshoni-update namespaces=`"isshoni-update`" $pub`n", $utf8)

          # relserve first, on a port the system picks (no probe that another process could take in between): it
          # opens the files under -dir on each request, so the manifests, whose URLs are all under the base (06 §8.2,
          # §8.11), are written once its address is known.
          New-Item -ItemType Directory -Force -Path $rel | Out-Null
          $relserve = Join-Path $work 'relserve.exe'
          go -C (Join-Path $env:GITHUB_WORKSPACE 'tools') build -o $relserve ./relserve
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ca = Join-Path $work 'ca.pem'
          $ready = Join-Path $work 'addr'
          $rs = Start-Process -FilePath $relserve -PassThru -NoNewWindow `
            -ArgumentList @('-dir', "`"$rel`"", '-latest', $new, '-addr', '127.0.0.1:0', '-ca-out', "`"$ca`"",
              '-ready-file', "`"$ready`"") `
            -RedirectStandardOutput (Join-Path $work 'relserve.out') -RedirectStandardError (Join-Path $work 'relserve.err')
          $store = $null
          $cert = $null
          try {
            $deadline = (Get-Date).AddSeconds(30)
            while (-not (Test-Path -LiteralPath $ready)) {
              if ($rs.HasExited) { throw "relserve exited ($($rs.ExitCode)): $(Get-Content -Raw (Join-Path $work 'relserve.err'))" }
              if ((Get-Date) -gt $deadline) { throw 'relserve did not start within 30 s' }
              Start-Sleep -Milliseconds 200
            }
            $addr = (Get-Content -Raw -LiteralPath $ready).Trim()
            if ($addr -notmatch '^127\.0\.0\.1:\d+$') { throw "relserve's ready file holds '$addr', not 127.0.0.1:port" }
            $base = "https://$addr"
            $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd'T'HH:mm:ss'Z'", [Globalization.CultureInfo]::InvariantCulture)
            function New-SignedManifest {
              param([string]$Version, [string]$Installer, [string]$Releases, [string]$Dir, [string]$BadSha = '')
              New-Item -ItemType Directory -Force -Path $Dir | Out-Null
              $m = Join-Path $Dir 'isshoni-desktop-update.json'
              go -C tools run ./desktoppkg manifest -version $Version -installer $Installer -date $date -releases $Releases -out $m
              if ($LASTEXITCODE -ne 0) { throw "desktoppkg manifest exited $LASTEXITCODE for $Version" }
              if ($BadSha) {
                $good = (Get-FileHash -Algorithm SHA256 -LiteralPath $Installer).Hash.ToLowerInvariant()
                $text = [IO.File]::ReadAllText($m)
                if (-not $text.Contains("`"sha256`": `"$good`"")) { throw "$m has no sha256 $good" }
                [IO.File]::WriteAllText($m, $text.Replace("`"sha256`": `"$good`"", "`"sha256`": `"$BadSha`""), $utf8)
              }
              & $sk -Y sign -f $key -n isshoni-update $m 2>&1 | Out-Null
              if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath "$m.sig")) { throw "ssh-keygen -Y sign failed for $m" }
            }
            $name = "isshoni-desktop_$($new)_windows_amd64_setup.exe"
            foreach ($root in '', 'badsha') {
              $d = [IO.Path]::Combine($rel, $root, 'download', "v$new")
              New-Item -ItemType Directory -Force -Path $d | Out-Null
              Copy-Item -LiteralPath $setups[$new] -Destination (Join-Path $d $name)
              $bad = ''
              if ($root) { $bad = (Get-FileHash -Algorithm SHA256 -LiteralPath $setups[$old]).Hash.ToLowerInvariant() }
              $releases = $base
              if ($root) { $releases = "$base/$root" }
              New-SignedManifest -Version $new -Installer (Join-Path $d $name) -Releases $releases -Dir $d -BadSha $bad
            }
            # ci0/: relserve's latest URL (ci.2's folder) answers with a manifest for ci.0, built over a copy of ci.1's
            # installer under ci.0's name (the app never downloads it).
            $ci0Dir = Join-Path $work 'ci0-installer'
            New-Item -ItemType Directory -Force -Path $ci0Dir | Out-Null
            $ci0Setup = Join-Path $ci0Dir "isshoni-desktop_$($ci0)_windows_amd64_setup.exe"
            Copy-Item -LiteralPath $setups[$old] -Destination $ci0Setup
            New-SignedManifest -Version $ci0 -Installer $ci0Setup -Releases "$base/ci0" `
              -Dir ([IO.Path]::Combine($rel, 'ci0', 'download', "v$new"))

            $cert = New-Object Security.Cryptography.X509Certificates.X509Certificate2($ca)
            $store = New-Object Security.Cryptography.X509Certificates.X509Store('Root', 'LocalMachine')
            $store.Open('ReadWrite')
            $store.Add($cert)

            ./deploy/test/windows/smoke.ps1 -Mode update -Setup $setups[$old] -Version $old -NewerSetup $setups[$new] `
              -NewerVersion $new -UpdateBase $base -Signers $signers
          } finally {
            if ($null -ne $store) {
              if ($null -ne $cert) { $store.Remove($cert) }
              $store.Close()
            }
            if (-not $rs.HasExited) { Stop-Process -Id $rs.Id -Force }
            "---- relserve's requests"
            Get-Content -LiteralPath (Join-Path $work 'relserve.err') -ErrorAction SilentlyContinue
            # A failed case may leave the app running or installed: the later steps (the autostart round trip's second
            # run, the CDP spec) need neither. smoke.ps1 ends the installed app and uninstalls it when every case
            # passed, so any isshoni.exe still running here, in any folder or session, outlived the test: it is named
            # and ended, and the step FAILS for it (after this cleanup, so the later steps still get a clean session).
            # The single-instance pipe (per user, as its Global\ mutex: M2 03 13.3) must be gone with them: a holder
            # would take a later start's forward, so one that outlives every isshoni.exe fails the step too. Its
            # pattern is the one winos' TestSingleInstanceNames checks (ciPipePattern).
            $outlived = New-Object System.Collections.ArrayList
            foreach ($p in @(Get-CimInstance -ClassName Win32_Process -Filter "Name = 'isshoni.exe'")) {
              $m = "the updater e2e left isshoni.exe $($p.ProcessId) running (session $($p.SessionId)): $($p.ExecutablePath) $($p.CommandLine)"
              "::error::$m"
              [void]$outlived.Add($m)
              Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue
            }
            $deadline = (Get-Date).AddSeconds(15)
            while ($true) {
              $pipes = @([IO.Directory]::GetFiles('\\.\pipe\') | Where-Object { $_ -like '*io.isshoni.desktop.*' })
              if ($pipes.Count -eq 0) { break }
              if ((Get-Date) -gt $deadline) {
                $m = "the single-instance pipe outlived every isshoni.exe of the updater e2e: $($pipes -join ', ')"
                "::error::$m"
                [void]$outlived.Add($m)
                break
              }
              Start-Sleep -Milliseconds 250
            }
            $u = Join-Path $installDir 'uninstall.exe'
            if (Test-Path -LiteralPath $u) {
              '::warning::the updater e2e left an install behind; uninstalling it'
              Start-Sleep -Seconds 2
              $p = Start-Process -FilePath $u -ArgumentList '/S', '/PURGE' -PassThru
              $null = $p.Handle
              $p.WaitForExit()
              $deadline = (Get-Date).AddSeconds(180)
              while ((Test-Path -LiteralPath $u) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
            }
          }
          # The cleanup above ran; a leftover it found fails the step only now, when the try block itself passed (a
          # failed case already fails it with its own error).
          if ($outlived.Count -gt 0) { throw "the updater e2e outlived itself: $($outlived -join '; ')" }

      - name: The autostart round trip after the updater e2e (TestAutostartRoundTrip again)
        if: ${{ !cancelled() && steps.go.outcome == 'success' && steps.webdist.outcome == 'success' && steps.webview2.outcome == 'success' }}
        run: |
          # The same test, as strict, in its original place: after the updater e2e (when that step ran), where PR #56's
          # first run failed. When the run before the updater e2e passed, a failure here points at what that step
          # left in the session (its cleanup fails on a lingering isshoni.exe or pipe), and the test's own checks name
          # the link that broke.
          $env:CGO_ENABLED = '0'
          $env:ISSHONI_REQUIRE_AUTOSTART_E2E = '1'
          $log = Join-Path $env:RUNNER_TEMP 'go-test-autostart-after-update.log'
          go test -v -count=1 -run '^TestAutostartRoundTrip$' ./cmd/isshoni-desktop/ | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ((Get-Content -LiteralPath $log) -match '^--- PASS: TestAutostartRoundTrip\b')) {
            throw "TestAutostartRoundTrip did not pass after the updater e2e (no '--- PASS: TestAutostartRoundTrip' line)"
          }

      - name: The e2e isshoni.exe and the server (task desktop:exe:windows TAGS=e2e, go build ./cmd/isshoni)
        id: e2e-exe
        if: ${{ !cancelled() && steps.go.outcome == 'success' && steps.task.outcome == 'success' && steps.native.outcome == 'success' && steps.webdist.outcome == 'success' }}
        env:
          VERSION: ${{ env.ISSHONI_VERSION }}
        run: |
          # 03 §22.4 B: -tags e2e (the fake engine, DevTools on, ISSHONI_E2E_CDP_PORT and ISSHONI_E2E_DATA_DIR read
          # by cmd/isshoni-desktop/flavor_e2e.go), into dist-desktop/windows_amd64-test/, never staged. The server is
          # for the spec's cases with a server (README DK13).
          task desktop:exe:windows TAGS=e2e "VERSION=$env:VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist-desktop/windows_amd64-test/isshoni.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "no $exe" }
          $env:CGO_ENABLED = '0'
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          go build -trimpath -o bin/isshoni.exe ./cmd/isshoni
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "exe=$exe" >> $env:GITHUB_OUTPUT

      - name: The app's Go tests under -tags e2e (flavor_e2e.go's variables and credential prefix)
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        run: |
          # Only -tags e2e compiles flavor_e2e.go and its tests (03 §22.4 B, README WA72): the refusals of malformed
          # ISSHONI_E2E_CDP_PORT and ISSHONI_E2E_DATA_DIR values and the isshoni-test:<random>: credential prefix
          # (Credential Manager here) that the CDP spec's success path doesn't show. windows-go runs the package's
          # other tests without the tag, so only flavor_e2e_test.go's run here, and each must PASS (a rename
          # can't silently match nothing).
          $env:CGO_ENABLED = '0'
          $tests = 'TestE2ESettings', 'TestAppOptionsE2EPort', 'TestE2ECredentials'
          $log = Join-Path $env:RUNNER_TEMP 'go-test-e2e.log'
          go test -v -count=1 -tags e2e -run "^($($tests -join '|'))`$" ./cmd/isshoni-desktop/ | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $lines = Get-Content -LiteralPath $log
          foreach ($t in $tests) {
            if (-not ($lines -match "^--- PASS: $t\b")) { throw "$t did not pass (no '--- PASS: $t' line)" }
          }

      - name: Set up Node (version from .tool-versions)
        id: node
        if: ${{ !cancelled() && steps.e2e-exe.outcome == 'success' && steps.webview2.outcome == 'success' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      - name: npm ci
        id: npmci
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: |
          npm ci --prefix web --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: The CDP spec (web/e2e/cdp, 03 §22.4 B)
        # The real app over the Chrome DevTools Protocol of its own WebView2 (connectOverCDP: no browser download):
        # the fixture starts the e2e isshoni.exe with --relaunched, ISSHONI_E2E_CDP_PORT and a temporary
        # ISSHONI_E2E_DATA_DIR, and fails unless the app wrote into that folder. Its reporter (e2e/cdp/annotations.ts)
        # prints each "Wails checklist" and "Budget (03 §20)" annotation as one line and appends them to the job
        # summary (GITHUB_STEP_SUMMARY) as a table.
        id: cdp
        if: ${{ !cancelled() && steps.npmci.outcome == 'success' }}
        working-directory: web
        env:
          ISSHONI_DESKTOP_EXE: ${{ steps.e2e-exe.outputs.exe }}
        run: |
          npx playwright test -c e2e/cdp/playwright.config.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the CDP spec's results
        # playwright.config.ts's outputDir is relative to web/e2e/cdp/; upload-artifact's path to the workspace.
        # Whenever the spec ran, passed or failed: besides a failure's traces, the folder holds annotations.md, the
        # spec's "Wails checklist" and "Budget (03 §20)" rows (e2e/cdp/annotations.ts), which a green run records too.
        if: ${{ always() && (steps.cdp.outcome == 'success' || steps.cdp.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cdp-test-results
          path: web/test-results/cdp/
          retention-days: 7
          if-no-files-found: warn

  windows-asan:
    # The engine's tests under AddressSanitizer (M2 06 §10.3; 04 §18.1): the MSVC environment of
    # deploy/windows/msvc-env.ps1 and vcpkg at native/vcpkg.json's baseline as in windows-native (§5.1), without a
    # binary cache, then `cmake --preset win-x64-asan` (Debug, /fsanitize=address, the test hooks and the tests of
    # win-x64-ci), the build and `ctest --preset win-x64-asan --output-on-failure`. The locked FFmpeg build is
    # IM_FFMPEG_ROOT and ISSHONI_TEST_FFMPEG_DIR, as in windows-native, since its tests fail without it in CI.
    # MSVC's ASan runtime DLL is on PATH from the MSVC environment. The skipped tests are listed as in
    # windows-native.
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_DISABLE_METRICS: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod; for tools/desktoppkg)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: FFmpeg from the lock
        id: ffmpeg
        run: |
          # M2 06 §5.1: the locked zip from its deps release, its SHA-256 against lock.json, unpacked and checked by
          # tools/desktoppkg ffmpeg-fetch.
          $out = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          $root = [string](go -C tools run ./desktoppkg ffmpeg-fetch -out $out | Select-Object -Last 1)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = $root.Trim()
          if (-not (Test-Path -LiteralPath (Join-Path $root 'include/libavcodec/avcodec.h'))) {
            throw "ffmpeg-fetch printed '$root', which has no include/libavcodec/avcodec.h"
          }
          "IM_FFMPEG_ROOT=$root"
          "root=$root" >> $env:GITHUB_OUTPUT
          "bin=$(Join-Path $root 'bin')" >> $env:GITHUB_OUTPUT

      - name: MSVC environment
        run: ./deploy/windows/msvc-env.ps1

      - name: vcpkg at native/vcpkg.json's baseline (no binary cache)
        run: |
          $baseline = [string](Get-Content -Raw -LiteralPath native/vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          if ($baseline -notmatch '^[0-9a-f]{40}$') { throw 'native/vcpkg.json has no 40-hex builtin-baseline' }
          $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git init -q $root
          git -C $root remote add origin https://github.com/microsoft/vcpkg.git
          git -C $root fetch -q --depth 1 origin $baseline
          if ($LASTEXITCODE -ne 0) { throw "git fetch of vcpkg $baseline failed" }
          git -C $root checkout -q --detach FETCH_HEAD
          # Downloads the vcpkg tool release the checkout pins and checks its SHA-512.
          & (Join-Path $root 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "bootstrap-vcpkg.bat failed (exit code $LASTEXITCODE)" }
          # Every port from source: no binary cache, not even vcpkg's default one (M2 06 §10.2).
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear" >> $env:GITHUB_ENV

      - name: CMake and Ninja
        id: tools
        run: |
          # The ones on PATH (the image's, or Visual Studio's once msvc-env.ps1 ran), else the copies vcpkg pins and
          # verifies by SHA-512.
          foreach ($tool in 'cmake', 'ninja') {
            $cmd = Get-Command $tool -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($cmd) {
              $path = $cmd.Source
            } else {
              $path = [string](& (Join-Path $env:VCPKG_ROOT 'vcpkg.exe') fetch $tool | Select-Object -Last 1)
              if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $path.Trim())) { throw "vcpkg fetch $tool failed" }
              $path = $path.Trim()
            }
            "${tool}: $path ($(& $path --version | Select-Object -First 1))"
            "$tool=$path" >> $env:GITHUB_OUTPUT
            if ($tool -eq 'cmake') { "ctest=$(Join-Path (Split-Path -Parent $path) 'ctest.exe')" >> $env:GITHUB_OUTPUT }
          }

      - name: win-x64-asan - configure, build and test
        working-directory: native
        env:
          CMAKE: ${{ steps.tools.outputs.cmake }}
          CTEST: ${{ steps.tools.outputs.ctest }}
          NINJA: ${{ steps.tools.outputs.ninja }}
          FFMPEG_ROOT: ${{ steps.ffmpeg.outputs.root }}
          ISSHONI_TEST_FFMPEG_DIR: ${{ steps.ffmpeg.outputs.bin }}
        run: |
          # The ASan runtime (clang_rt.asan_dynamic-x86_64.dll) comes from the MSVC tools' bin folder, which the MSVC
          # environment put on PATH; a test that can't load it fails at start, which ctest reports.
          $asan = Get-Command 'clang_rt.asan_dynamic-x86_64.dll' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($asan) { "ASan runtime: $($asan.Source)" } else { '::warning::clang_rt.asan_dynamic-x86_64.dll is not on PATH' }
          & $env:CMAKE --preset win-x64-asan "-DCMAKE_MAKE_PROGRAM=$env:NINJA" "-DIM_FFMPEG_ROOT=$env:FFMPEG_ROOT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CMAKE --build --preset win-x64-asan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CTEST --preset win-x64-asan --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: The native tests that skipped, and why
        # As windows-native's step of the same name, over the win-x64-asan build.
        if: always()
        run: |
          Set-StrictMode -Version 3
          $expected = @(
            # Windows Server: the H.264 encoder MFT refuses, or gives its AUs only on drain.
            '^MfSoftware\.',
            # No Desktop Duplication output on the runner's session.
            '^Protect\.DesktopDuplicationLeavesTheWindowOut$',
            # No process loopback (no audio device), or a kept-out app runs.
            '^AudioLive\.TheFastPathRunsFromTheFirstPlan$',
            # No render or capture endpoint.
            '^AudioWatcher\.(OwnSessionKeptOutBeforeAnyRules|MicRootSurvivesUnwatch)$',
            # A test's own child-process case, skipped when run directly.
            '^(AudioWatcherChild|AudioProcessChild|DllSearchChild|FfmpegLoadChild)\.',
            # Opt-in (IM_GPU_TEST_HARDWARE=1).
            '^GpuHardware\.'
          )
          $files = @(Get-ChildItem -Path 'native/build/win-x64-asan' -Recurse -Filter '*.xml' -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'gtest-xml' })
          if ($files.Count -eq 0) {
            '::warning::no gtest XML report was written (native/build/win-x64-asan/**/gtest-xml)'
            exit 0
          }
          $lines = [System.Collections.Generic.List[string]]::new()
          foreach ($f in $files) {
            $doc = [xml](Get-Content -Raw -LiteralPath $f.FullName)
            foreach ($tc in @($doc.SelectNodes('//testcase'))) {
              $skip = $tc.SelectSingleNode('skipped')
              if ($tc.GetAttribute('result') -ne 'skipped' -and $null -eq $skip) { continue }
              $name = '{0}.{1}' -f $tc.GetAttribute('classname'), $tc.GetAttribute('name')
              $why = if ($null -ne $skip) { ($skip.GetAttribute('message') -replace '\s+', ' ').Trim() } else { '' }
              $line = '{0} / {1}: {2}' -f $f.BaseName, $name, $why
              $known = @($expected | Where-Object { $name -match $_ }).Count -gt 0
              if ($known) { "::notice::skipped $line" } else { "::warning::skipped (not one this runner is known to take) $line" }
              $lines.Add("- $(if ($known) { '' } else { '**unexpected** ' })$line")
            }
          }
          "### Skipped native tests under ASan ($($lines.Count))`n" >> $env:GITHUB_STEP_SUMMARY
          if ($lines.Count -gt 0) { ($lines -join "`n") + "`n" >> $env:GITHUB_STEP_SUMMARY }

  native-fuzz:
    # The libFuzzer targets of native/ (M2 06 §10.3; 04 §18.1, E1): preset host-fuzz (clang, AddressSanitizer,
    # -fsanitize=fuzzer) through `task native:test PRESET=host-fuzz`, whose ctest runs every seed once, then each
    # target for 60 s on a copy of its corpus native/**/tests/fuzz/corpus/<target>/ (libFuzzer adds the inputs it
    # finds to the first corpus folder, so the checkout's stays as committed). Every *_fuzz.cpp must have built a
    # target. A crash, leak, timeout or out-of-memory input fails the step and is uploaded as the artifact
    # native-fuzz-crashes (kept 30 days); reproduce it with `<target> <input>` in a host-fuzz build.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VCPKG_DISABLE_METRICS: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Task's pin from .tool-versions
        id: pins
        run: |
          task=$(awk '$1 == "task" { sub(/^v/, "", $2); print $2; exit }' .tool-versions)
          if [ -z "$task" ]; then
            echo "::error file=.tool-versions::.tool-versions needs a task pin, a line 'task <version>' (06 §7.1)"
            exit 1
          fi
          echo "task=$task" >> "$GITHUB_OUTPUT"

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ steps.pins.outputs.task }}

      - name: clang with libFuzzer
        run: |
          # The image's clang; libFuzzer's runtime is in the libclang-rt-<major>-dev package, installed here when a
          # test program doesn't link with -fsanitize=fuzzer.
          clang --version | sed -n 1p
          probe=$RUNNER_TEMP/fuzz-probe
          printf '%s\n' '#include <stddef.h>' '#include <stdint.h>' \
            'extern "C" int LLVMFuzzerTestOneInput(const uint8_t *, size_t) { return 0; }' >"$probe.cpp"
          if ! clang++ -fsanitize=fuzzer,address "$probe.cpp" -o "$probe" 2>/dev/null; then
            major=$(clang -dumpversion | cut -d. -f1)
            echo "::notice::clang $major has no libFuzzer runtime here; installing libclang-rt-$major-dev"
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y -qq --no-install-recommends "libclang-rt-$major-dev"
            clang++ -fsanitize=fuzzer,address "$probe.cpp" -o "$probe"
          fi
          "$probe" -runs=1

      - name: Let AddressSanitizer map its shadow memory
        # Ubuntu 24.04's kernel randomizes mmap with 32 bits, which the sanitizers' fixed shadow layout of older
        # clang releases fails on (ci.yml's native-host sets the same for ThreadSanitizer); 28 bits is the older
        # default.
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: task native:test PRESET=host-fuzz (the build, and every seed once)
        # vcpkg at the baseline in the runner's temp folder, its ports built from source (no binary cache).
        env:
          VCPKG_BINARY_SOURCES: clear
        run: task native:test PRESET=host-fuzz VCPKG_DIR="$RUNNER_TEMP/vcpkg"

      - name: Each fuzz target for 60 s
        run: |
          build=native/build/host-fuzz
          crashes=$RUNNER_TEMP/native-fuzz-crashes
          mkdir -p "$crashes"
          status=0
          count=0
          # Every committed *_fuzz.cpp is a target (native/common/CMakeLists.txt's im_add_tests), named after its file.
          while IFS= read -r src; do
            name=$(basename "$src" .cpp)
            seeds=$(dirname "$src")/corpus/$name
            bin=$(find "$build" -type f -name "$name" -perm -u+x | head -n 1)
            if [ -z "$bin" ]; then
              echo "::error file=$src::no fuzz target $name was built from $src"
              status=1
              continue
            fi
            count=$((count + 1))
            corpus=$RUNNER_TEMP/fuzz-corpus/$name
            mkdir -p "$corpus"
            dirs=("$corpus")
            if [ -d "$seeds" ]; then dirs+=("$seeds"); else echo "::notice::$name has no seed corpus ($seeds)"; fi
            echo "::group::$name (60 s)"
            # -timeout: one input running 25 s counts as a hang; -artifact_prefix: where a failing input goes.
            if "$bin" -max_total_time=60 -timeout=25 -print_final_stats=1 \
              -artifact_prefix="$crashes/$name-" "${dirs[@]}"; then
              echo "::endgroup::"
              echo "$name: 60 s without a finding, $(find "$corpus" -type f | wc -l) new corpus inputs"
            else
              echo "::endgroup::"
              echo "::error::$name failed; the input is in the native-fuzz-crashes artifact"
              status=1
            fi
          done < <(git ls-files 'native/**/tests/fuzz/*_fuzz.cpp')
          if [ "$count" = 0 ]; then
            echo "::error::no fuzz target ran (git ls-files found no native/**/tests/fuzz/*_fuzz.cpp)"
            status=1
          fi
          echo "### native-fuzz: $count targets, 60 s each" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload the failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-fuzz-crashes
          path: ${{ runner.temp }}/native-fuzz-crashes/
          if-no-files-found: ignore
          retention-days: 30

  goreleaser-full:
    # The whole release build as a snapshot (06 §9.2): the archives, the deb and rpm packages, both images
    # (built and loaded here, never pushed) and the SBOMs, which ci.yml's goreleaser-check leaves out. Then the
    # asset list of 06 §3 (task release:assets FULL=true), the SBOMs' contents and both images.
    #
    # With real desktop files (M2 06 §10.3): windows-full's desktop-release (the installer, the update manifest, the
    # symbols zip, the FFmpeg source tar, the stamped install-desktop.ps1) goes into dist-desktop/ and its stage into
    # dist-desktop/stage/, as release.yml's build job downloads desktop-pkg's; syft writes the desktop SBOM from the
    # stage, and release:assets runs with DESKTOP=true, so no ISSHONI-DESKTOP-STUB stand-in is accepted and the
    # desktop files themselves are checked (the manifest against the installer, the source tar against the lock,
    # both copies of install-desktop.ps1, the symbols, the SBOM, the installer's file list against the stage). The
    # snapshot's version is windows-full's, 0.0.0-nightly.<run>. It runs when windows-full uploaded those files, also
    # when a later check of windows-full failed.
    #
    # On a night when windows-full uploaded no desktop files (web, windows-full-native or an early step of
    # windows-full failed), the server half is still checked (every independent failure in one round, 06 §10.1):
    # release:desktop-stubs writes the ISSHONI-DESKTOP-STUB stand-ins (with the desktop SBOM), release:assets runs
    # FULL=true DESKTOP_STUBS=true, and the job's last step fails it, because there were no real desktop files.
    #
    # Not signed (--skip=sign): cosign's keyless signature needs the job's OIDC token, which this job does not
    # get, because it also runs npm (release.yml keeps the two apart, 06 §9.3), and a nightly snapshot needs no
    # signature in the public transparency log. The asset check therefore gets an empty stand-in for the one asset
    # only a signed run makes, the cosign bundle of checksums.txt, and gates on everything else as for a release.
    # release.yml's dry run covers the signing.
    needs: windows-full
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ISSHONI_SNAPSHOT_VERSION: 0.0.0-nightly.${{ github.run_number }}
    steps:
      - name: Did windows-full make the desktop files
        id: desktop
        env:
          DESKTOP_FILES: ${{ needs.windows-full.outputs.desktop-files }}
          WINDOWS_FULL: ${{ needs.windows-full.result }}
        run: |
          real=$([ "$DESKTOP_FILES" = true ] && echo true || echo false)
          echo "real=$real" >> "$GITHUB_OUTPUT"
          if [ "$real" != true ]; then
            echo "::warning::windows-full ($WINDOWS_FULL) uploaded no desktop files: the server half is checked over desktop stubs, and the job fails at its end"
          fi

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download desktop-release (into dist-desktop/)
        if: steps.desktop.outputs.real == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-release
          path: dist-desktop

      - name: Download desktop-stage (into dist-desktop/stage/)
        if: steps.desktop.outputs.real == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-stage
          path: dist-desktop/stage

      - name: Keep windows-full's install-desktop.ps1 for release:assets
        if: steps.desktop.outputs.real == 'true'
        # goreleaser's before hook (task release:prepare) stamps dist-desktop/install-desktop.ps1 again from
        # deploy/install-desktop.ps1; release:assets then compares the two copies (M2 06 §11.2).
        run: |
          mkdir -p "$RUNNER_TEMP/desktop-pkg"
          mv dist-desktop/install-desktop.ps1 "$RUNNER_TEMP/desktop-pkg/install-desktop.ps1"
          ls -l dist-desktop

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node (version from .tool-versions)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      - name: Read Task's pin from .tool-versions
        id: pins
        run: |
          task=$(awk '$1 == "task" { sub(/^v/, "", $2); print $2; exit }' .tool-versions)
          if [ -z "$task" ]; then
            echo "::error file=.tool-versions::.tool-versions needs a task pin, a line 'task <version>' (06 §7.1)"
            exit 1
          fi
          echo "task=$task" >> "$GITHUB_OUTPUT"

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ steps.pins.outputs.task }}

      - name: Set up syft (goreleaser's SBOMs; the version release.yml uses)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1

      - name: Set up Docker Buildx (dockers_v2 builds both platforms with an SBOM attestation)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: npm ci
        run: npm ci --prefix web --no-audit --no-fund

      - name: Install rpm (release:assets lists the rpm packages and their dependencies with it)
        run: |
          if ! command -v rpm > /dev/null; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y -qq --no-install-recommends rpm
          fi
          rpm --version

      - name: 7z, jq and unzip (release:assets DESKTOP=true reads the installer, the manifest and the symbols)
        run: |
          if ! command -v 7z > /dev/null && ! command -v 7zz > /dev/null; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y -qq --no-install-recommends 7zip
          fi
          for tool in jq unzip; do
            command -v "$tool" > /dev/null || { echo "::error::no $tool on this runner"; exit 1; }
          done
          { command -v 7z || command -v 7zz; } | sed -n 1p

      - name: The pinned goreleaser (task release:goreleaser)
        run: |
          task release:goreleaser
          .bin/goreleaser --version

      - name: The SBOM of the desktop app's install tree (syft over the stage)
        if: steps.desktop.outputs.real == 'true'
        # M2 06 §2.1: isshoni-desktop_<v>_windows_amd64.sbom.json, SPDX JSON, from desktop-stage, the tree the
        # installer packs, as release.yml's build job writes it.
        run: |
          syft scan "dir:dist-desktop/stage" --source-name isshoni-desktop --source-version "$ISSHONI_SNAPSHOT_VERSION" \
            -o "spdx-json=dist-desktop/isshoni-desktop_${ISSHONI_SNAPSHOT_VERSION}_windows_amd64.sbom.json"
          ls -l dist-desktop

      - name: The release notes' desktop lines (ISSHONI_DESKTOP_MIN_VERSION, ISSHONI_FFMPEG_VERSION)
        # M2 06 §11.7: .goreleaser.yaml's release.header reads both, as in release.yml's build job and task
        # release:snapshot.
        run: |
          min=$(tr -d '\r' < deploy/desktop/min-version | sed -n '1s/^[[:space:]]*//; 1s/[[:space:]]*$//; 1p')
          ffmpeg=$(jq -r '.ffmpeg.version' native/ffmpeg/pins.json)
          if [ -z "$min" ] || [ -z "$ffmpeg" ] || [ "$ffmpeg" = null ]; then
            echo "::error::deploy/desktop/min-version ('$min') or native/ffmpeg/pins.json's ffmpeg.version ('$ffmpeg') is missing"
            exit 1
          fi
          {
            echo "ISSHONI_DESKTOP_MIN_VERSION=$min"
            echo "ISSHONI_FFMPEG_VERSION=$ffmpeg"
          } >> "$GITHUB_ENV"
          echo "desktop update floor $min, FFmpeg $ffmpeg"

      - name: The web app for ${{ env.ISSHONI_SNAPSHOT_VERSION }}
        run: task build:web VERSION="$ISSHONI_SNAPSHOT_VERSION"

      - name: Desktop stubs (windows-full made no desktop files)
        # The stand-ins .goreleaser.yaml's desktop globs need, the desktop SBOM among them (release:desktop-stubs).
        if: steps.desktop.outputs.real != 'true'
        run: task release:desktop-stubs VERSION="$ISSHONI_SNAPSHOT_VERSION"

      - name: goreleaser check
        run: .bin/goreleaser check

      - name: goreleaser release --snapshot --clean --skip=sign
        # The before hook runs `task release:prepare` (THIRD_PARTY_NOTICES, the stamped install.sh and
        # install-desktop.ps1). dist-desktop/ holds windows-full's desktop files, which the config's extra_files take.
        run: PATH="$PWD/.bin:$PATH" .bin/goreleaser release --snapshot --clean --skip=sign

      - name: task release:assets FULL=true, DESKTOP=true or DESKTOP_STUBS=true (the assets of 06 §3 and M2 06 §2.1; the cosign bundle is a stand-in)
        env:
          REAL_DESKTOP: ${{ steps.desktop.outputs.real }}
        run: |
          # The one difference from a release: this run does not sign (see the job's comment). release:assets only
          # checks that the cosign bundle exists, and checksums.txt does not list it, so an empty stand-in lets
          # every other check gate unchanged: any failure of the task fails this step. DESKTOP=true refuses a
          # desktop stub and checks the desktop files themselves; PKG_PS1 is windows-full's stamped copy. Without
          # real desktop files, DESKTOP_STUBS=true accepts release:desktop-stubs' stand-ins (the job fails at its end).
          trap 'rm -f dist/checksums.txt.sigstore.json' EXIT
          : > dist/checksums.txt.sigstore.json
          if [ "$REAL_DESKTOP" = true ]; then
            task release:assets VERSION="$ISSHONI_SNAPSHOT_VERSION" FULL=true DESKTOP=true \
              PKG_PS1="$RUNNER_TEMP/desktop-pkg/install-desktop.ps1"
          else
            task release:assets VERSION="$ISSHONI_SNAPSHOT_VERSION" FULL=true DESKTOP_STUBS=true
          fi

      - name: The SBOMs describe the archives
        run: |
          status=0
          for archive in dist/*.tar.gz dist/*.zip; do
            sbom=$archive.sbom.json
            # SPDX JSON (syft), with the Go modules of the binary in the archive: pion/webrtc is one of them.
            if jq -e '(.spdxVersion | startswith("SPDX-")) and ([.packages[].name] | any(test("pion/webrtc")))' \
              "$sbom" > /dev/null; then
              echo "$sbom: $(jq -r '.spdxVersion' "$sbom"), $(jq '.packages | length' "$sbom") packages"
            else
              echo "::error::$sbom is not an SPDX document that lists the binary's Go modules"
              status=1
            fi
          done
          exit "$status"

      - name: Both images are loaded, and the runner's starts with the version
        run: |
          v=$ISSHONI_SNAPSHOT_VERSION
          for arch in amd64 arm64; do
            image=ghcr.io/moonwx/isshoni:$v-$arch
            got=$(docker image inspect -f '{{.Os}}/{{.Architecture}}' "$image") || {
              echo "::error::goreleaser did not load the image $image"
              exit 1
            }
            if [ "$got" != "linux/$arch" ]; then
              echo "::error::$image is for $got, not linux/$arch"
              exit 1
            fi
            echo "$image: $got"
          done
          native=$(docker version -f '{{.Server.Arch}}')
          got=$(docker run --rm --name "isshoni-nightly-image-$$" "ghcr.io/moonwx/isshoni:$v-$native" version --short)
          if [ "$got" != "$v" ]; then
            echo "::error::the $native image reports version ${got:-(none)}, not $v"
            exit 1
          fi
          echo "the $native image starts and reports version $got"

      - name: Remove the snapshot's images
        if: always()
        run: |
          for arch in amd64 arm64; do
            docker image rm "ghcr.io/moonwx/isshoni:$ISSHONI_SNAPSHOT_VERSION-$arch" > /dev/null 2>&1 || true
          done

      - name: The snapshot had real desktop files
        # The server half was checked above; a snapshot over stubs is not the full release build (M2 06 §10.3).
        if: ${{ !cancelled() && steps.desktop.outputs.real != 'true' }}
        env:
          WINDOWS_FULL: ${{ needs.windows-full.result }}
        run: |
          echo "::error::windows-full ($WINDOWS_FULL) uploaded no desktop files, so the snapshot was checked over desktop stubs only"
          exit 1

  compat-servers:
    # The client core against the last two final server releases (M2 06 §10.3, §11.6): this commit's app talks to
    # servers that are already deployed. For each of the two newest published releases vX.Y.Z (no prerelease, no
    # draft): isshoni_<v>_linux_amd64.tar.gz, checksums.txt and checksums.txt.sig from the release, the signature
    # verified with deploy/keys/allowed_signers (identity isshoni-release, namespace isshoni-checksums, as install.sh
    # does) and the archive with checksums.txt; the server started with the release's own deploy/dev/isshoni.e2e.toml
    # (the checkout's when the tag lacks it; an older server may not know a newer key), free ports and a temporary
    # data folder; the admin created through `isshoni setup-url --json` and POST /api/v1/auth/setup/complete (as
    # M1's distro tests do) and written to ISSHONI_COMPAT_ADMIN_FILE (mode 0600); then
    # `go test ./internal/client/... -run '^TestCompatServer' -count=1` with ISSHONI_COMPAT_SERVER_URL, which runs
    # 01's TestCompatServer (join, publish with the fake engine, receive) and 02's TestCompatServerDeviceFlow (link
    # and refresh). Both must PASS, not skip. Against a server whose /api/v1/info lacks deviceFlow (every 0.1.x
    # server) the tests assert only compat.FromInfo's update_server/no_device_flow. While fewer than two final
    # releases exist the job skips with a note. Each release is tested also when the other one failed.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The last two final releases
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Published releases only (the read token sees no drafts), without prereleases, and only vX.Y.Z tags,
          # newest version first.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' >"$RUNNER_TEMP/tags"
          grep -Ex 'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)' "$RUNNER_TEMP/tags" |
            sed 's/^v//' | sort -t. -k1,1nr -k2,2nr -k3,3nr | head -n 2 >"$RUNNER_TEMP/versions" || :
          n=$(wc -l <"$RUNNER_TEMP/versions" | tr -d ' ')
          if [ "$n" -lt 2 ]; then
            note="fewer than two final releases exist ($n: $(tr '\n' ' ' <"$RUNNER_TEMP/versions")), so there is no N-1 server to test the client core against yet (M2 06 §10.3)"
            echo "::notice title=compat-servers skipped::$note"
            echo "### compat-servers: skipped, $note" >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "the servers to test against: $(tr '\n' ' ' <"$RUNNER_TEMP/versions")"
          echo "versions=$(tr '\n' ' ' <"$RUNNER_TEMP/versions")" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Set up Go (version from go.mod)
        if: steps.releases.outputs.run == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: The client core against each release
        if: steps.releases.outputs.run == 'true'
        env:
          VERSIONS: ${{ steps.releases.outputs.versions }}
        run: |
          if [ ! -s deploy/keys/allowed_signers ]; then
            echo "::error file=deploy/keys/allowed_signers::there are no release keys to verify the releases with"
            exit 1
          fi
          base=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download
          # Two ports that were free a moment ago: HTTP, and one ICE port free for both UDP and TCP.
          free_ports() {
            python3 - <<'EOF'
          import socket
          http = socket.socket(); http.bind(('127.0.0.1', 0))
          while True:
              tcp = socket.socket(); tcp.bind(('', 0)); port = tcp.getsockname()[1]
              udp = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              try:
                  udp.bind(('', port)); break
              except OSError:
                  tcp.close(); udp.close()
          print(http.getsockname()[1], port)
          EOF
          }
          # compat VERSION: one release, start to end, in a folder of its own; returns non-zero on any failure.
          compat() {
            v=$1
            work=$RUNNER_TEMP/compat-$v
            rm -rf "$work"
            mkdir -p "$work/data"
            archive=isshoni_${v}_linux_amd64.tar.gz
            echo "::group::v$v: download and verify"
            for f in "$archive" checksums.txt checksums.txt.sig; do
              curl -fsSL --retry 3 -o "$work/$f" "$base/v$v/$f" || { echo "::error::v$v: no $f in the release"; echo "::endgroup::"; return 1; }
            done
            if ! ssh-keygen -Y verify -f deploy/keys/allowed_signers -I isshoni-release -n isshoni-checksums \
              -s "$work/checksums.txt.sig" <"$work/checksums.txt"; then
              echo "::error::v$v: checksums.txt.sig does not verify with deploy/keys/allowed_signers"
              echo "::endgroup::"
              return 1
            fi
            if ! grep -E "^[0-9a-f]{64}  $archive\$" "$work/checksums.txt" >"$work/archive.sum" ||
              ! (cd "$work" && sha256sum -c archive.sum); then
              echo "::error::v$v: $archive is not the one checksums.txt lists"
              echo "::endgroup::"
              return 1
            fi
            tar -xzf "$work/$archive" -C "$work" isshoni
            got=$("$work/isshoni" version --short) || got=''
            echo "::endgroup::"
            if [ "$got" != "$v" ]; then
              echo "::error::v$v: the binary reports version ${got:-(none)}"
              return 1
            fi

            # The release's own e2e config.
            if ! git show "v$v:deploy/dev/isshoni.e2e.toml" >"$work/isshoni.e2e.toml" 2>/dev/null; then
              echo "::notice::v$v: no deploy/dev/isshoni.e2e.toml at the tag; using the checkout's"
              cp deploy/dev/isshoni.e2e.toml "$work/isshoni.e2e.toml"
            fi
            read -r http ice < <(free_ports)
            origin=http://127.0.0.1:$http
            sock=$work/admin.sock
            # No ISSHONI_* name of this job reaches the server but its data folder (the server reads them as
            # settings).
            env -i PATH="$PATH" HOME="$HOME" ISSHONI_DATA_DIR="$work/data" ISSHONI_ALLOW_EPHEMERAL_DATA=1 \
              "$work/isshoni" serve --config "$work/isshoni.e2e.toml" --public-url="$origin" \
              --listen.http="127.0.0.1:$http" --listen.ice-udp=":$ice" --listen.ice-tcp=":$ice" \
              --listen.admin-socket="$sock" >"$work/server.log" 2>&1 &
            pid=$!
            rc=0
            for _ in $(seq 1 120); do
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "::error::v$v: isshoni serve exited"
                rc=1
                break
              fi
              if curl -fsS -o "$work/info.json" "$origin/api/v1/info" 2>/dev/null; then break; fi
              sleep 0.5
            done
            if [ "$rc" = 0 ] && [ ! -s "$work/info.json" ]; then
              echo "::error::v$v: $origin/api/v1/info did not answer within 60 s"
              rc=1
            fi

            if [ "$rc" = 0 ]; then
              echo "v$v at $origin: $(jq -c '{version: .server.version, protocol, features}' "$work/info.json" 2>/dev/null || cat "$work/info.json")"
              # The admin, as M1's distro test C2 creates it.
              url=$(env -i PATH="$PATH" HOME="$HOME" ISSHONI_DATA_DIR="$work/data" ISSHONI_ALLOW_EPHEMERAL_DATA=1 \
                "$work/isshoni" setup-url --json --config "$work/isshoni.e2e.toml" --listen.admin-socket="$sock" |
                jq -r '.url') || url=''
              password=$(od -An -tx1 -N16 /dev/urandom | tr -d ' \n')
              code=$(jq -n --arg t "${url#*#}" --arg p "$password" '{token: $t, username: "compatadmin", password: $p}' |
                curl -s -o "$work/setup.json" -w '%{http_code}' -H 'Content-Type: application/json' --data-binary @- \
                  "$origin/api/v1/auth/setup/complete") || code='(failed)'
              case $url in
              */setup#?*) ;;
              *)
                echo "::error::v$v: isshoni setup-url --json gave no setup link ('$url')"
                rc=1
                ;;
              esac
              if [ "$rc" = 0 ] && [ "$code" != 201 ]; then
                echo "::error::v$v: POST /api/v1/auth/setup/complete answered $code: $(cat "$work/setup.json")"
                rc=1
              fi
            fi

            if [ "$rc" = 0 ]; then
              admin=$work/admin.json
              (umask 077 && jq -n --arg p "$password" '{username: "compatadmin", password: $p}' >"$admin")
              echo "::group::v$v: go test ./internal/client/... -run '^TestCompatServer'"
              ISSHONI_COMPAT_SERVER_URL=$origin ISSHONI_COMPAT_ADMIN_FILE=$admin \
                go test ./internal/client/... -run '^TestCompatServer' -count=1 -v 2>&1 | tee "$work/test.log"
              test_rc=${PIPESTATUS[0]}
              echo "::endgroup::"
              if [ "$test_rc" != 0 ]; then
                echo "::error::v$v: the compat tests failed (exit $test_rc)"
                rc=1
              fi
              # Both tests ran and passed: a skip or a rename must not pass silently.
              for t in TestCompatServer TestCompatServerDeviceFlow; do
                if ! grep -Eq "^--- PASS: $t \(" "$work/test.log"; then
                  echo "::error::v$v: $t did not pass (no '--- PASS: $t' line)"
                  rc=1
                fi
              done
              if [ "$rc" = 0 ]; then
                verdict=joined
                if ! jq -e '.features | index("deviceFlow")' "$work/info.json" >/dev/null 2>&1; then
                  verdict='no deviceFlow: update_server/no_device_flow asserted only'
                fi
                echo "- v$v: passed ($verdict)" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi

            kill "$pid" 2>/dev/null || :
            wait "$pid" 2>/dev/null || :
            if [ "$rc" != 0 ]; then
              echo "- v$v: **failed**" >> "$GITHUB_STEP_SUMMARY"
              echo "---- v$v: the server's log (last 40 lines)"
              tail -n 40 "$work/server.log" || :
            fi
            return "$rc"
          }

          # The tags, for each release's own e2e config.
          for v in $VERSIONS; do
            git fetch -q --no-tags --depth=1 origin "refs/tags/v$v:refs/tags/v$v" ||
              echo "::warning::could not fetch the tag v$v"
          done
          echo "### compat-servers" >> "$GITHUB_STEP_SUMMARY"
          status=0
          for v in $VERSIONS; do
            compat "$v" || status=1
          done
          exit "$status"

  site-links:
    # lychee over the project site as `task site:build` builds it (06 §10), external links included. The site is
    # laid out under its base path (/isshoni/, 06 §10.1), so that its root-relative links resolve as on GitHub
    # Pages. Until the site exists (README S82) the job only says so.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Is there a site?
        id: site
        run: |
          if [ -f docs/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=site-links skipped::docs/package.json does not exist yet (the project site, README S82), so there is no site to check"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node (version from .tool-versions)
        if: steps.site.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      - name: Read Task's pin from .tool-versions
        if: steps.site.outputs.present == 'true'
        id: pins
        run: |
          task=$(awk '$1 == "task" { sub(/^v/, "", $2); print $2; exit }' .tool-versions)
          if [ -z "$task" ]; then
            echo "::error file=.tool-versions::.tool-versions needs a task pin, a line 'task <version>' (06 §7.1)"
            exit 1
          fi
          echo "task=$task" >> "$GITHUB_OUTPUT"

      - name: Set up Task
        if: steps.site.outputs.present == 'true'
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ steps.pins.outputs.task }}

      - name: npm ci (docs)
        if: steps.site.outputs.present == 'true'
        run: npm ci --prefix docs --no-audit --no-fund

      - name: task site:build
        if: steps.site.outputs.present == 'true'
        run: task site:build

      - name: Lay out the site as GitHub Pages serves it
        if: steps.site.outputs.present == 'true'
        id: layout
        run: |
          root=$RUNNER_TEMP/site
          rm -rf "$root"
          mkdir -p "$root"
          cp -R docs/.vitepress/dist "$root/isshoni"
          # The action runs `eval lychee … ARGS`, so each value is in single quotes here. The input comes first, so
          # that no option takes it for a value of its own.
          args="'$root/isshoni/**/*.html' --no-progress --root-dir '$root'"
          args="$args --fallback-extensions html --index-files index.html"
          # 429 is a site's rate limit, not a broken link.
          args="$args --max-retries 3 --retry-wait-time 10 --timeout 30 --max-concurrency 8 --accept '200..=299,429'"
          exclude() {
            args="$args --exclude '$1'"
          }
          # The docs' examples: loopback and private addresses, documentation names and addresses.
          args="$args --exclude-all-private"
          exclude '^https?://([^/]*\.)?example\.(com|net|org)([:/]|$)'
          exclude '^https?://[^/]*\.test([:/]|$)'
          exclude '^https?://(192\.0\.2|198\.51\.100|203\.0\.113)\.'
          exclude '^https?://\[2001:db8:'
          # site.yml adds what it takes from the latest release, and the release keys (06 §10.3). Here they are
          # fetched the same way when there is a release; before the first one, links to them can't work yet and
          # are left out.
          latest=$(curl -sS -o /dev/null -w '%{redirect_url}' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/latest" || true)
          case $latest in
          */releases/tag/v*)
            echo "The latest release is ${latest##*/}"
            for file in install.sh compose.yaml compose.host.yaml checksums.txt checksums.txt.sig checksums.txt.sigstore.json; do
              curl -fsSL --retry 3 -o "$root/isshoni/$file" \
                "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/latest/download/$file" || rm -f "$root/isshoni/$file"
            done
            ;;
          *)
            echo "::notice::there is no release yet, so links to release assets are not checked"
            exclude '/releases/(latest/)?download/'
            exclude '/isshoni/(install\.sh|compose(\.host)?\.yaml|checksums\.txt(\.sig|\.sigstore\.json)?)$'
            ;;
          esac
          if [ -f deploy/keys/allowed_signers ]; then
            mkdir -p "$root/isshoni/keys"
            cp deploy/keys/allowed_signers "$root/isshoni/keys/allowed_signers"
          fi
          echo "lychee $args"
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: lychee
        if: steps.site.outputs.present == 'true'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: ${{ steps.layout.outputs.args }}
          output: ${{ runner.temp }}/lychee.md
          fail: true
