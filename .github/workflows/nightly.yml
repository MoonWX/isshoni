# Nightly: the slow and flaky-prone checks that do not gate a pull request (docs/m1/06-deploy-and-ci.md §8.5,
# "06" below).
#
#   distro-vm          the install.sh scenarios in a VM of each of the six distros of 06 §4.13, including the
#                      VM-only ones of 06 §11.2: V1 (C1-C10 on a real kernel and systemd, and the sysctl values),
#                      V2 (SELinux on Fedora), V3 (a running ufw or firewalld), V4 (iptables with
#                      netfilter-persistent, the Oracle Cloud pattern), V5 (ACME with Pebble) and V6 (the exposure
#                      score of systemd-analyze security). QEMU with KVM; without /dev/kvm the job is skipped with
#                      a warning, and the scenarios are run by hand before a release (06 §4.13, §9.1).
#   docker-multiarch   `task docker:smoke` (06 §11.3) on ubuntu-24.04 and on the native arm64 runner
#   go-cross-os        `go test -race ./...` on macOS and Windows, whose server builds are shipped (experimental)
#   govulncheck        fails on a reachable vulnerability; npm audit of the web app's shipped packages
#   goreleaser-full    `goreleaser release --snapshot --clean` with the images and the SBOMs, then the asset
#                      list of 06 §3: catches drift of the dockers_v2 and nfpm config
#   site-links         lychee over the built project site, external links included
#
# GitHub e-mails the owner when a scheduled run fails. It also disables a scheduled workflow after 60 days without
# activity in the repository; CONTRIBUTING.md says how to turn it on again.
#
# Locally: the jobs run tasks and scripts of the repository, and their steps run as they are elsewhere. distro-vm
# is `sh deploy/test/vm/vm-test.sh`, which needs Linux with QEMU and KVM; without KVM, VM_ACCEL=tcg runs it
# emulated (in a Linux container on an arm64 Mac, say), much slower. docker-multiarch is `task docker:smoke` on the
# machine's own architecture.
#
# Rules for every workflow (06 §8.1): a read-only token, and no job here needs more; third-party actions pinned by
# full commit SHA with a version comment; checkout without persisted credentials; timeout-minutes on every job. No
# caches: like a release, the nightly builds from the module proxy and npm alone, and leaves the repository's cache
# space to ci.yml.

name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run at a time; a scheduled run is never cancelled by a manual one.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  vm-release:
    # The two test releases of the install.sh scenarios (06 §11.2), as ci.yml's distro-release job builds them:
    # `task release:snapshot` without the images as 0.0.1-ci.1 and 0.0.1-ci.2. Unsigned: each distro-vm job signs
    # them with a key of its own.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node (version from .tool-versions)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      - name: Read Task's pin from .tool-versions
        id: pins
        run: |
          task=$(awk '$1 == "task" { sub(/^v/, "", $2); print $2; exit }' .tool-versions)
          if [ -z "$task" ]; then
            echo "::error file=.tool-versions::.tool-versions needs a task pin, a line 'task <version>' (06 §7.1)"
            exit 1
          fi
          echo "task=$task" >> "$GITHUB_OUTPUT"

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ steps.pins.outputs.task }}

      - name: npm ci
        run: npm ci --prefix web --no-audit --no-fund

      - name: Install rpm (release:snapshot's asset check lists the rpm packages with it)
        run: |
          if ! command -v rpm > /dev/null; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y -qq --no-install-recommends rpm
          fi

      - name: Build the releases 0.0.1-ci.1 and 0.0.1-ci.2
        run: sh deploy/test/distro-test.sh -b "$RUNNER_TEMP/distro-releases"

      - name: Upload the releases
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-releases
          path: ${{ runner.temp }}/distro-releases
          if-no-files-found: error
          retention-days: 1

  distro-vm:
    # One VM after the other, each booted fresh from the distro's official cloud image with a cloud-init seed, and
    # reached over SSH. The scenarios are deploy/test/distro-test.sh's, run in the VM instead of a container by
    # deploy/test/vm/vm-test.sh, which sources it, plus the VM-only ones of 06 §11.2. Parts (vm-test.sh -o; a
    # matrix row lists those of vm-test.sh's default that apply to its distro), each in a VM of its own:
    #   main  C12, C1, then V1's sysctl values, C2, C3, C6, C4, C5, C8, C9, C10, then V6 and, on Fedora, V2
    #   c7    C7, a port taken by another program          c13  C13, a server that does not start
    #   v3    V3: the firewall offer with ufw (Ubuntu 24.04) or firewalld (Fedora) running, and SSH still reachable
    #   v4    V4: iptables with netfilter-persistent and a REJECT rule, IPv4 and IPv6; the rules survive a reboot
    #         (Ubuntu 24.04)
    #   v5    V5: --domain isshoni.test against Pebble on this runner, ready within 60 s, a certificate from Pebble
    # C11 (no systemd) has no VM form: it stays in ci.yml's distro job.
    needs: vm-release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian-12
            parts: main c7 c13 v5
          - distro: debian-13
            parts: main c7 c13 v5
          - distro: ubuntu-22.04
            parts: main c7 c13 v5
          - distro: ubuntu-24.04
            parts: main c7 c13 v3 v4 v5
          - distro: ubuntu-26.04
            parts: main c7 c13 v5
          - distro: fedora-44
            parts: main c7 c13 v3 v5
    env:
      DISTRO: ${{ matrix.distro }}
      PARTS: ${{ matrix.parts }}
    steps:
      - name: /dev/kvm
        id: kvm
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::warning title=distro-vm skipped on $DISTRO::this runner has no /dev/kvm, so the VM scenarios of 06 §11.2 did not run. Run them by hand before a release (06 §4.13, §9.1)."
            echo "### distro-vm $DISTRO: skipped, the runner has no /dev/kvm" >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The runner's user may use KVM once a udev rule opens the device (GitHub's documented way).
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-isshoni-kvm.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          for _ in $(seq 1 20); do
            if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
              ls -l /dev/kvm
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 0.5
          done
          ls -l /dev/kvm
          echo "::error::/dev/kvm exists, but the udev rule did not make it usable"
          exit 1

      - name: Check out
        if: steps.kvm.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod; for tools/relserve)
        if: steps.kvm.outputs.ok == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Download the releases
        if: steps.kvm.outputs.ok == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vm-releases
          path: ${{ runner.temp }}/distro-releases

      - name: Install QEMU and cloud-image-utils
        if: steps.kvm.outputs.ok == 'true'
        run: |
          case $(uname -m) in
          x86_64) qemu='qemu-system-x86' ;;
          aarch64) qemu='qemu-system-arm qemu-efi-aarch64' ;;
          *)
            echo "::error::no VMs on $(uname -m)"
            exit 1
            ;;
          esac
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          # shellcheck disable=SC2086 # one or two package names
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y -qq --no-install-recommends $qemu qemu-utils cloud-image-utils
          "qemu-system-$(uname -m)" --version | sed -n 1p

      - name: Download the ${{ matrix.distro }} cloud image
        if: steps.kvm.outputs.ok == 'true'
        env:
          VM_DIR: ${{ runner.temp }}/vm
        run: |
          # The distro's own cloud image, checked against the checksum file next to it, where vm-test.sh looks for
          # it.
          sh deploy/test/vm/cloud-image.sh "$DISTRO" "$VM_DIR/images/$DISTRO.qcow2"
          qemu-img info "$VM_DIR/images/$DISTRO.qcow2" | sed -n '1,3p'

      - name: The scenarios in ${{ matrix.distro }} VMs
        if: steps.kvm.outputs.ok == 'true'
        # Less than the job's 90 minutes, which also hold the steps above (about 5 minutes): a hang fails this
        # step before the job times out, so the steps below still have the time to save Pebble's logs and upload
        # the VMs' consoles.
        timeout-minutes: 75
        env:
          VM_DIR: ${{ runner.temp }}/vm
          VM_ACCEL: kvm
        # deploy/test/vm/vm-test.sh: the scenarios of deploy/test/distro-test.sh, which it sources, run in VMs, the
        # VM-only ones of 06 §11.2, and Pebble for V5. The same script runs by hand before a release (06 §4.13).
        run: sh deploy/test/vm/vm-test.sh -r "$RUNNER_TEMP/distro-releases" -o "$PARTS" "$DISTRO"

      - name: The logs of Pebble and pebble-challtestsrv, if the scenarios were stopped before they saved them
        if: (failure() || cancelled()) && steps.kvm.outputs.ok == 'true' && contains(matrix.parts, 'v5')
        env:
          VM_DIR: ${{ runner.temp }}/vm
        run: |
          # vm-test.sh saves them in VM_DIR (and prints them) when it ends; a step timeout can stop it first.
          for name in pebble challtestsrv; do
            if [ ! -e "$VM_DIR/$name.log" ] && docker container inspect "isshoni-vm-$name" > /dev/null 2>&1; then
              docker logs "isshoni-vm-$name" > "$VM_DIR/$name.log" 2>&1 || true
              echo "The log of $name:"
              cat "$VM_DIR/$name.log"
            fi
          done

      - name: Upload the VMs' console logs and Pebble's logs
        if: (failure() || cancelled()) && steps.kvm.outputs.ok == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distro-vm-${{ matrix.distro }}-consoles
          path: |
            ${{ runner.temp }}/vm/*/console.log
            ${{ runner.temp }}/vm/*.log
          if-no-files-found: ignore
          retention-days: 7

  docker-multiarch:
    # The Docker smoke test of 06 §11.3 (`task docker:smoke`) on both architectures of the image, each on a
    # native runner: the image is built from the working tree for the runner's own CPU, then every part runs, the
    # host-network ones included. ci.yml's docker-smoke job runs only linux/amd64.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node (version from .tool-versions)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      - name: Read Task's pin from .tool-versions
        id: pins
        run: |
          task=$(awk '$1 == "task" { sub(/^v/, "", $2); print $2; exit }' .tool-versions)
          if [ -z "$task" ]; then
            echo "::error file=.tool-versions::.tool-versions needs a task pin, a line 'task <version>' (06 §7.1)"
            exit 1
          fi
          echo "task=$task" >> "$GITHUB_OUTPUT"

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ steps.pins.outputs.task }}

      - name: npm ci
        run: npm ci --prefix web --no-audit --no-fund

      - name: Show the Docker versions
        run: |
          docker version
          docker compose version
          docker buildx version

      - name: task docker:smoke (${{ runner.arch }})
        run: task docker:smoke

  go-cross-os:
    # The Go tests on the two other systems the server is built for (06 §3: experimental macOS and Windows
    # archives). The race detector needs cgo, so a C compiler: Xcode's on macOS, MinGW-w64's gcc on Windows.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    env:
      CGO_ENABLED: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: gcc for cgo (Windows)
        if: runner.os == 'Windows'
        run: |
          if command -v gcc > /dev/null; then
            gcc --version | sed -n 1p
            exit 0
          fi
          # The runner images keep MinGW-w64 in one of these places; Chocolatey is the fallback.
          for dir in /c/mingw64/bin /c/msys64/ucrt64/bin /c/msys64/mingw64/bin; do
            if [ -x "$dir/gcc.exe" ]; then
              cygpath -w "$dir" >> "$GITHUB_PATH"
              "$dir/gcc.exe" --version | sed -n 1p
              exit 0
            fi
          done
          echo "::notice::no gcc on this runner image; installing MinGW-w64 with Chocolatey"
          choco install mingw --no-progress -y
          cygpath -w /c/ProgramData/mingw64/mingw64/bin >> "$GITHUB_PATH"

      - name: go env
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED CC

      - name: go test -race (internal/server/ops and cmd/isshoni, the backup, restore and re-exec code)
        run: go test -race -count=1 -timeout 30m ./internal/server/ops/ ./cmd/isshoni/

      - name: go test -race (every other package)
        run: |
          pkgs=$(go list ./... | grep -v -x \
            -e github.com/MoonWX/isshoni/internal/server/ops \
            -e github.com/MoonWX/isshoni/cmd/isshoni)
          # shellcheck disable=SC2086 # one word per package
          go test -race -count=1 -timeout 30m $pkgs

  govulncheck:
    # Gating here, as in release.yml (ci.yml's job only warns: a new CVE must not block unrelated pull requests).
    # govulncheck fails on a vulnerability that the code reaches; npm audit on a high or critical one in a package
    # the web app ships (devDependencies left out).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node (version from .tool-versions)
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      - name: Read Task's pin from .tool-versions
        id: pins
        run: |
          task=$(awk '$1 == "task" { sub(/^v/, "", $2); print $2; exit }' .tool-versions)
          if [ -z "$task" ]; then
            echo "::error file=.tool-versions::.tool-versions needs a task pin, a line 'task <version>' (06 §7.1)"
            exit 1
          fi
          echo "task=$task" >> "$GITHUB_OUTPUT"

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ steps.pins.outputs.task }}

      - name: The pinned govulncheck (task tools:govulncheck)
        run: task tools:govulncheck

      - name: govulncheck ./...
        run: .bin/govulncheck ./...

      - name: npm audit --omit=dev --audit-level=high (web)
        # Also when govulncheck failed, so that one run reports both.
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  goreleaser-full:
    # The whole release build as a snapshot (06 §9.2): the archives, the deb and rpm packages, both images
    # (built and loaded here, never pushed) and the SBOMs, which ci.yml's goreleaser-check leaves out. Then the
    # asset list of 06 §3 (task release:assets FULL=true), the SBOMs' contents and both images.
    #
    # Not signed (--skip=sign): cosign's keyless signature needs the job's OIDC token, which this job does not
    # get, because it also runs npm (release.yml keeps the two apart, 06 §9.3), and a nightly snapshot needs no
    # signature in the public transparency log. The asset check therefore gets an empty stand-in for the one asset
    # only a signed run makes, the cosign bundle of checksums.txt, and gates on everything else as for a release.
    # release.yml's dry run covers the signing.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ISSHONI_SNAPSHOT_VERSION: 0.0.0-nightly.${{ github.run_number }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node (version from .tool-versions)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      - name: Read Task's pin from .tool-versions
        id: pins
        run: |
          task=$(awk '$1 == "task" { sub(/^v/, "", $2); print $2; exit }' .tool-versions)
          if [ -z "$task" ]; then
            echo "::error file=.tool-versions::.tool-versions needs a task pin, a line 'task <version>' (06 §7.1)"
            exit 1
          fi
          echo "task=$task" >> "$GITHUB_OUTPUT"

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ steps.pins.outputs.task }}

      - name: Set up syft (goreleaser's SBOMs; the version release.yml uses)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1

      - name: Set up Docker Buildx (dockers_v2 builds both platforms with an SBOM attestation)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: npm ci
        run: npm ci --prefix web --no-audit --no-fund

      - name: Install rpm (release:assets lists the rpm packages and their dependencies with it)
        run: |
          if ! command -v rpm > /dev/null; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y -qq --no-install-recommends rpm
          fi
          rpm --version

      - name: The pinned goreleaser (task release:goreleaser)
        run: |
          task release:goreleaser
          .bin/goreleaser --version

      - name: The web app for ${{ env.ISSHONI_SNAPSHOT_VERSION }}
        run: task build:web VERSION="$ISSHONI_SNAPSHOT_VERSION"

      - name: goreleaser check
        run: .bin/goreleaser check

      - name: goreleaser release --snapshot --clean --skip=sign
        # The before hook runs `task release:prepare` (THIRD_PARTY_NOTICES, the stamped install.sh).
        run: PATH="$PWD/.bin:$PATH" .bin/goreleaser release --snapshot --clean --skip=sign

      - name: task release:assets FULL=true (the assets of 06 §3; the cosign bundle is a stand-in)
        run: |
          # The one difference from a release: this run does not sign (see the job's comment). release:assets only
          # checks that the cosign bundle exists, and checksums.txt does not list it, so an empty stand-in lets
          # every other check gate unchanged: any failure of the task fails this step.
          trap 'rm -f dist/checksums.txt.sigstore.json' EXIT
          : > dist/checksums.txt.sigstore.json
          task release:assets VERSION="$ISSHONI_SNAPSHOT_VERSION" FULL=true

      - name: The SBOMs describe the archives
        run: |
          status=0
          for archive in dist/*.tar.gz dist/*.zip; do
            sbom=$archive.sbom.json
            # SPDX JSON (syft), with the Go modules of the binary in the archive: pion/webrtc is one of them.
            if jq -e '(.spdxVersion | startswith("SPDX-")) and ([.packages[].name] | any(test("pion/webrtc")))' \
              "$sbom" > /dev/null; then
              echo "$sbom: $(jq -r '.spdxVersion' "$sbom"), $(jq '.packages | length' "$sbom") packages"
            else
              echo "::error::$sbom is not an SPDX document that lists the binary's Go modules"
              status=1
            fi
          done
          exit "$status"

      - name: Both images are loaded, and the runner's starts with the version
        run: |
          v=$ISSHONI_SNAPSHOT_VERSION
          for arch in amd64 arm64; do
            image=ghcr.io/moonwx/isshoni:$v-$arch
            got=$(docker image inspect -f '{{.Os}}/{{.Architecture}}' "$image") || {
              echo "::error::goreleaser did not load the image $image"
              exit 1
            }
            if [ "$got" != "linux/$arch" ]; then
              echo "::error::$image is for $got, not linux/$arch"
              exit 1
            fi
            echo "$image: $got"
          done
          native=$(docker version -f '{{.Server.Arch}}')
          got=$(docker run --rm --name "isshoni-nightly-image-$$" "ghcr.io/moonwx/isshoni:$v-$native" version --short)
          if [ "$got" != "$v" ]; then
            echo "::error::the $native image reports version ${got:-(none)}, not $v"
            exit 1
          fi
          echo "the $native image starts and reports version $got"

      - name: Remove the snapshot's images
        if: always()
        run: |
          for arch in amd64 arm64; do
            docker image rm "ghcr.io/moonwx/isshoni:$ISSHONI_SNAPSHOT_VERSION-$arch" > /dev/null 2>&1 || true
          done

  site-links:
    # lychee over the project site as `task site:build` builds it (06 §10), external links included. The site is
    # laid out under its base path (/isshoni/, 06 §10.1), so that its root-relative links resolve as on GitHub
    # Pages. Until the site exists (README S82) the job only says so.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Is there a site?
        id: site
        run: |
          if [ -f docs/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=site-links skipped::docs/package.json does not exist yet (the project site, README S82), so there is no site to check"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node (version from .tool-versions)
        if: steps.site.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      - name: Read Task's pin from .tool-versions
        if: steps.site.outputs.present == 'true'
        id: pins
        run: |
          task=$(awk '$1 == "task" { sub(/^v/, "", $2); print $2; exit }' .tool-versions)
          if [ -z "$task" ]; then
            echo "::error file=.tool-versions::.tool-versions needs a task pin, a line 'task <version>' (06 §7.1)"
            exit 1
          fi
          echo "task=$task" >> "$GITHUB_OUTPUT"

      - name: Set up Task
        if: steps.site.outputs.present == 'true'
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ steps.pins.outputs.task }}

      - name: npm ci (docs)
        if: steps.site.outputs.present == 'true'
        run: npm ci --prefix docs --no-audit --no-fund

      - name: task site:build
        if: steps.site.outputs.present == 'true'
        run: task site:build

      - name: Lay out the site as GitHub Pages serves it
        if: steps.site.outputs.present == 'true'
        id: layout
        run: |
          root=$RUNNER_TEMP/site
          rm -rf "$root"
          mkdir -p "$root"
          cp -R docs/.vitepress/dist "$root/isshoni"
          # The action runs `eval lychee … ARGS`, so each value is in single quotes here. The input comes first, so
          # that no option takes it for a value of its own.
          args="'$root/isshoni/**/*.html' --no-progress --root-dir '$root'"
          args="$args --fallback-extensions html --index-files index.html"
          # 429 is a site's rate limit, not a broken link.
          args="$args --max-retries 3 --retry-wait-time 10 --timeout 30 --max-concurrency 8 --accept '200..=299,429'"
          exclude() {
            args="$args --exclude '$1'"
          }
          # The docs' examples: loopback and private addresses, documentation names and addresses.
          args="$args --exclude-all-private"
          exclude '^https?://([^/]*\.)?example\.(com|net|org)([:/]|$)'
          exclude '^https?://[^/]*\.test([:/]|$)'
          exclude '^https?://(192\.0\.2|198\.51\.100|203\.0\.113)\.'
          exclude '^https?://\[2001:db8:'
          # site.yml adds what it takes from the latest release, and the release keys (06 §10.3). Here they are
          # fetched the same way when there is a release; before the first one, links to them can't work yet and
          # are left out.
          latest=$(curl -sS -o /dev/null -w '%{redirect_url}' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/latest" || true)
          case $latest in
          */releases/tag/v*)
            echo "The latest release is ${latest##*/}"
            for file in install.sh compose.yaml compose.host.yaml checksums.txt checksums.txt.sig checksums.txt.sigstore.json; do
              curl -fsSL --retry 3 -o "$root/isshoni/$file" \
                "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/latest/download/$file" || rm -f "$root/isshoni/$file"
            done
            ;;
          *)
            echo "::notice::there is no release yet, so links to release assets are not checked"
            exclude '/releases/(latest/)?download/'
            exclude '/isshoni/(install\.sh|compose(\.host)?\.yaml|checksums\.txt(\.sig|\.sigstore\.json)?)$'
            ;;
          esac
          if [ -f deploy/keys/allowed_signers ]; then
            mkdir -p "$root/isshoni/keys"
            cp deploy/keys/allowed_signers "$root/isshoni/keys/allowed_signers"
          fi
          echo "lychee $args"
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: lychee
        if: steps.site.outputs.present == 'true'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: ${{ steps.layout.outputs.args }}
          output: ${{ runner.temp }}/lychee.md
          fail: true
