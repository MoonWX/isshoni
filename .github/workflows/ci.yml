# CI: the gate for every change (docs/m1/06-deploy-and-ci.md §8.1–8.2, "06" below; the Windows
# app's jobs and filters are docs/m2/06-windows-release.md §10.1, "M2 06" below).
#
# There is one required check, ci-ok (06 D7). Path-filtered jobs live in this one workflow,
# so a job with nothing to check is skipped, and ci-ok counts a skipped job as a pass.
#
# The changes job decides what runs. A pull request runs the jobs its changed paths touch; a
# push to main and a merge-queue group run everything. A job whose inputs are not in the tree
# yet (web/ before the web client lands, for example) is skipped too. The run summary of the
# changes job says why each job runs or not.
#
# A job for a part that lands later comes with that part: it adds a `decide` line to the
# changes job and, when it gates the merge, its id to ci-ok's needs.
#
# Rules for every workflow (06 §8.1): a read-only token by default, with jobs raising their
# own permissions; third-party actions pinned by full commit SHA with a version comment;
# checkout without persisted credentials; timeout-minutes on every job.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The SPA (web job) and the binary (build job) carry the same non-dev version (06 §8.2).
  ISSHONI_VERSION: 0.0.0-ci.${{ github.run_number }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter lists a pull request's files through the API
    outputs:
      # The path filters of 06 §8.2, for the jobs here and for the ones added later.
      go: ${{ steps.plan.outputs.go }}
      web: ${{ steps.plan.outputs.web }}
      deploy: ${{ steps.plan.outputs.deploy }}
      docker: ${{ steps.plan.outputs.docker }}
      release: ${{ steps.plan.outputs.release }}
      site: ${{ steps.plan.outputs.site }}
      # A part of go, for lint-go's step that only a tools/ change can fail.
      tools: ${{ steps.plan.outputs.tools }}
      # The filters of M2 06 §10.1, for the Windows app's jobs here and for the ones added later
      # (windows-native and windows-desktop on desktop, the updater e2e on update, lint:ps and
      # test:ps on ps).
      desktop: ${{ steps.plan.outputs.desktop }}
      native: ${{ steps.plan.outputs.native }}
      update: ${{ steps.plan.outputs.update }}
      ps: ${{ steps.plan.outputs.ps }}
      # One flag per job: its filter matched and all of its inputs exist.
      run-lint-go: ${{ steps.plan.outputs.run-lint-go }}
      run-test-go: ${{ steps.plan.outputs.run-test-go }}
      run-web: ${{ steps.plan.outputs.run-web }}
      run-protocol: ${{ steps.plan.outputs.run-protocol }}
      run-licenses: ${{ steps.plan.outputs.run-licenses }}
      run-build: ${{ steps.plan.outputs.run-build }}
      run-e2e: ${{ steps.plan.outputs.run-e2e }}
      run-lint-deploy: ${{ steps.plan.outputs.run-lint-deploy }}
      run-acme: ${{ steps.plan.outputs.run-acme }}
      run-docker-smoke: ${{ steps.plan.outputs.run-docker-smoke }}
      run-goreleaser-check: ${{ steps.plan.outputs.run-goreleaser-check }}
      run-distro: ${{ steps.plan.outputs.run-distro }}
      run-govulncheck: ${{ steps.plan.outputs.run-govulncheck }}
      run-site: ${{ steps.plan.outputs.run-site }}
      run-windows-go: ${{ steps.plan.outputs.run-windows-go }}
      run-desktop-macos: ${{ steps.plan.outputs.run-desktop-macos }}
      run-native-host: ${{ steps.plan.outputs.run-native-host }}
      run-windows-native: ${{ steps.plan.outputs.run-windows-native }}
      # Task's pin from .tool-versions (06 §7.1). Go comes from go.mod, Node from .tool-versions.
      task-version: ${{ steps.plan.outputs.task-version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # A file counts when it matches a pattern and none of the '!' patterns.
          predicate-quantifier: some-with-excludes
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'tools/**'
              - 'internal/protocol/testdata/**'
              - 'internal/server/tlsmgr/testdata/**'
              - '.golangci.yml'
              - 'tygo.yaml'
            web:
              - 'web/**'
            deploy:
              - 'deploy/**'
              - '.github/workflows/**'
              - 'Taskfile.yml'
              - '.tool-versions'
            docker:
              - 'deploy/docker/**'
              - 'deploy/compose*.yaml'
            release:
              - '.goreleaser.yaml'
              - '.github/workflows/release.yml'
              - 'deploy/packaging/**'
              - 'tools/goreleaser/**'
            site:
              - 'docs/**'
              - 'web/src/conntest/codes.json'
              - '!docs/PLAN.md'
              - '!docs/m1/**'
              - '!docs/m2/**'
            tools:
              - 'tools/**'
            # The root README.md, which every release archive carries (06 §3): it feeds
            # goreleaser-check only, so a pull request that deletes it fails there. The release
            # filter would also run docker-smoke and the six distros on every README edit.
            readme:
              - 'README.md'
            # tools/repocheck, behind lint:keys and lint:pins (06 §7.2). lint-deploy runs both on
            # the tree, so a change to the checker, or to README.md (whose "Release signing keys"
            # section lint:keys checks, README F11), runs it as deploy changes do.
            repocheck:
              - 'tools/repocheck/**'
            # Inputs of the distro job that neither deploy nor release covers: tools/relserve, which
            # only that job runs, and tools/notices, whose output is in the archives it installs.
            distro_tools:
              - 'tools/relserve/**'
              - 'tools/notices/**'
            # The Windows app (M2 06 §10.1): everything the app, its engine, its installer or
            # its packaging reads, the SPA it bundles included. windows-go, desktop-macos and
            # windows-native run on it; windows-desktop joins when it lands (README WA72).
            desktop:
              - 'cmd/isshoni-desktop/**'
              - 'internal/client/**'
              - 'internal/media/**'
              - 'internal/update/**'
              - 'internal/desktop/**'
              - 'native/**'
              - 'deploy/windows/**'
              - 'deploy/install-desktop.ps1'
              - 'deploy/embed.go'
              - 'deploy/notices/native-windows.json'
              - 'tools/desktoppkg/**'
              - 'tools/wails3/**'
              - 'tools/notices/**'
              - 'go.mod'
              - 'go.sum'
              - 'web/**'
              - '.github/workflows/ci.yml'
            # The portable C++ (native-host). The job runs `task native:test` and `task
            # lint:native`, so the Taskfile is one of its inputs too, as for acme and e2e above.
            native:
              - 'native/**'
              - '.github/workflows/ci.yml'
              - 'Taskfile.yml'
            # The updater end to end (windows-desktop, from README WA88).
            update:
              - 'internal/update/**'
              - 'deploy/windows/nsis/**'
              - 'tools/desktoppkg/**'
            # The PowerShell scripts (lint:ps and test:ps in lint-deploy, from README WA49).
            ps:
              - 'deploy/install-desktop.ps1'
              - 'deploy/test/install-desktop.Tests.ps1'
              - 'deploy/test/windows/*.ps1'
              - 'native/windows/tools/*.ps1'
              - 'deploy/windows/msvc-env.ps1'
              - 'deploy/windows/tools.json'
            # The npm side of lint:pins (@wailsio/runtime equals go.mod's Wails, M2 06 §3), which
            # neither the go filter (lint-go) nor the deploy filter (lint-deploy) sees.
            pins:
              - 'web/package.json'
              - 'web/package-lock.json'
            # Inputs of e2e outside the go filter: the desktop e2e specs' Go host and its assets
            # (M2 06 §10.1).
            desktop_e2e:
              - 'internal/desktop/**'
            # Inputs of protocol outside the go and web filters: the desktop bridge, whose codes
            # and bindings are generated (M2 06 §10.1).
            desktop_protocol:
              - 'internal/desktop/bridge/**'
              - 'cmd/isshoni-desktop/**'
              - 'tools/wails3/**'
              - 'web/src/platform/desktop/**'

      - name: Decide which jobs run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          FILTER_GO: ${{ steps.filter.outputs.go }}
          FILTER_WEB: ${{ steps.filter.outputs.web }}
          FILTER_DEPLOY: ${{ steps.filter.outputs.deploy }}
          FILTER_DOCKER: ${{ steps.filter.outputs.docker }}
          FILTER_RELEASE: ${{ steps.filter.outputs.release }}
          FILTER_SITE: ${{ steps.filter.outputs.site }}
          FILTER_TOOLS: ${{ steps.filter.outputs.tools }}
          FILTER_DISTRO_TOOLS: ${{ steps.filter.outputs.distro_tools }}
          FILTER_README: ${{ steps.filter.outputs.readme }}
          FILTER_REPOCHECK: ${{ steps.filter.outputs.repocheck }}
          FILTER_DESKTOP: ${{ steps.filter.outputs.desktop }}
          FILTER_NATIVE: ${{ steps.filter.outputs.native }}
          FILTER_UPDATE: ${{ steps.filter.outputs.update }}
          FILTER_PS: ${{ steps.filter.outputs.ps }}
          FILTER_PINS: ${{ steps.filter.outputs.pins }}
          FILTER_DESKTOP_E2E: ${{ steps.filter.outputs.desktop_e2e }}
          FILTER_DESKTOP_PROTOCOL: ${{ steps.filter.outputs.desktop_protocol }}
        run: |
          # A pull request runs what its paths touch; a push to main and a merge-queue group
          # run everything.
          if [ "$EVENT" = pull_request ]; then
            go=${FILTER_GO:-false} web=${FILTER_WEB:-false} deploy=${FILTER_DEPLOY:-false}
            docker=${FILTER_DOCKER:-false} release=${FILTER_RELEASE:-false} site=${FILTER_SITE:-false}
            tools=${FILTER_TOOLS:-false} distro_tools=${FILTER_DISTRO_TOOLS:-false}
            readme=${FILTER_README:-false} repocheck=${FILTER_REPOCHECK:-false}
            desktop=${FILTER_DESKTOP:-false} native=${FILTER_NATIVE:-false} update=${FILTER_UPDATE:-false}
            ps=${FILTER_PS:-false} pins=${FILTER_PINS:-false} desktop_e2e=${FILTER_DESKTOP_E2E:-false}
            desktop_protocol=${FILTER_DESKTOP_PROTOCOL:-false}
          else
            go=true web=true deploy=true docker=true release=true site=true tools=true distro_tools=true
            readme=true repocheck=true
            desktop=true native=true update=true ps=true pins=true desktop_e2e=true desktop_protocol=true
          fi
          go_or_web=false
          if [ "$go" = true ] || [ "$web" = true ]; then go_or_web=true; fi
          protocol_when=$go_or_web
          if [ "$desktop_protocol" = true ]; then protocol_when=true; fi
          go_web_or_site=$go_or_web
          if [ "$site" = true ]; then go_web_or_site=true; fi
          go_or_deploy=false
          if [ "$go" = true ] || [ "$deploy" = true ]; then go_or_deploy=true; fi
          go_web_or_deploy=$go_or_web
          if [ "$deploy" = true ]; then go_web_or_deploy=true; fi
          e2e_when=$go_web_or_deploy
          if [ "$desktop_e2e" = true ]; then e2e_when=true; fi
          docker_deploy_or_release=$deploy
          if [ "$docker" = true ] || [ "$release" = true ]; then docker_deploy_or_release=true; fi
          deploy_or_release=$deploy
          if [ "$release" = true ]; then deploy_or_release=true; fi
          distro_when=$deploy_or_release
          if [ "$distro_tools" = true ]; then distro_when=true; fi
          goreleaser_when=$deploy_or_release
          if [ "$readme" = true ]; then goreleaser_when=true; fi
          site_or_deploy=$site
          if [ "$deploy" = true ]; then site_or_deploy=true; fi
          lint_deploy_when=$deploy
          if [ "$readme" = true ] || [ "$repocheck" = true ] || [ "$ps" = true ] || [ "$pins" = true ]; then
            lint_deploy_when=true
          fi
          {
            echo "go=$go"
            echo "web=$web"
            echo "deploy=$deploy"
            echo "docker=$docker"
            echo "release=$release"
            echo "site=$site"
            echo "tools=$tools"
            echo "desktop=$desktop"
            echo "native=$native"
            echo "update=$update"
            echo "ps=$ps"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### CI plan ($EVENT)"
            echo
            echo "Filters: go=$go, web=$web, deploy=$deploy, docker=$docker, release=$release, site=$site, tools=$tools, distro_tools=$distro_tools, readme=$readme, repocheck=$repocheck, desktop=$desktop, native=$native, update=$update, ps=$ps, pins=$pins, desktop_e2e=$desktop_e2e, desktop_protocol=$desktop_protocol"
            echo
            echo "| Job | Decision |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          # decide JOB WHEN INPUT...: JOB runs when WHEN is true and every INPUT exists. A
          # missing input is a part that has not landed yet, so its job is skipped (a pass).
          decide() {
            local job=$1 when=$2 missing='' input run why
            shift 2
            for input in "$@"; do
              [ -e "$input" ] || missing="$missing $input"
            done
            if [ "$when" != true ]; then
              run=false why='skipped: no matching changes'
            elif [ -n "$missing" ]; then
              run=false why="skipped: missing$missing"
            else
              run=true why='runs'
            fi
            echo "run-$job=$run" >> "$GITHUB_OUTPUT"
            echo "| $job | $why |" >> "$GITHUB_STEP_SUMMARY"
          }
          decide lint-go "$go" go.mod .golangci.yml .tool-versions Taskfile.yml tools/go.mod
          decide test-go "$go" go.mod Taskfile.yml .tool-versions
          decide web true web/package.json web/package-lock.json .tool-versions
          # The drift check needs the generator and the committed output, which land together
          # (README S10). Before that, `task gen` would write web/src/protocol/*.gen.ts as new
          # untracked files, and gen:check would fail on every go or web change. The desktop
          # bridge's generated codes and bindings count too (M2 06 §10.1).
          decide protocol "$protocol_when" Taskfile.yml .tool-versions tygo.yaml tools/go.mod \
            internal/protocol/gen/tsregistry
          # The site's npm packages (docs/) join the check when docs/package.json lands.
          decide licenses "$go_web_or_site" Taskfile.yml .tool-versions tools/go.mod tools/notices \
            web/scripts/licenses.mjs web/package.json web/package-lock.json
          decide build true Taskfile.yml .tool-versions cmd/isshoni web/package.json web/package-lock.json
          # 06 §8.2 runs e2e on go or web changes. The job's own inputs count too, as for acme
          # below: the servers' base config (deploy/dev/isshoni.e2e.toml), the Node pin and this
          # workflow, which the deploy filter covers. M2 adds the desktop e2e specs' host,
          # internal/desktop (M2 06 §10.1).
          decide e2e "$e2e_when" .tool-versions cmd/isshoni web/package.json web/package-lock.json \
            web/playwright.config.ts deploy/dev/isshoni.e2e.toml
          # lint:keys checks README.md against deploy/keys/allowed_signers (README F11), and
          # lint:keys and lint:pins are tools/repocheck: their changes run the job too, and so do
          # the PowerShell scripts (M2 06 §10.1; lint:ps and test:ps join the job with them) and
          # web/package.json and its lockfile, whose @wailsio/runtime lint:pins checks (M2 06 §3).
          decide lint-deploy "$lint_deploy_when" Taskfile.yml .tool-versions
          # The job's own inputs count too: Pebble's config (the go filter's tlsmgr/testdata
          # pattern) and this workflow, which pins the two images (the deploy filter).
          decide acme "$go_or_deploy" go.mod internal/server/tlsmgr/testdata/pebble-config.json
          # 06 §8.2 runs the Docker smoke test on docker, deploy or release changes: the image
          # and the compose files, the Taskfile and this workflow, and what a release builds
          # next to the image. A pull request that changes only the server does not run it;
          # the push to main does.
          decide docker-smoke "$docker_deploy_or_release" Taskfile.yml .tool-versions go.mod \
            cmd/isshoni tools/go.mod tools/notices web/package.json web/package-lock.json \
            deploy/docker/Dockerfile deploy/docker/test/docker-smoke.sh \
            deploy/compose.yaml deploy/compose.host.yaml
          # 06 §8.2 runs goreleaser-check on release changes. Its other inputs are deploy changes:
          # the files the archives and packages ship, install.sh (the before hook stamps it), the
          # release tasks in Taskfile.yml and this workflow; and the root README.md, which every
          # archive carries. README.md is no input that skips the job when missing: goreleaser
          # fails without it, which is the point.
          decide goreleaser-check "$goreleaser_when" Taskfile.yml .tool-versions go.mod .goreleaser.yaml \
            tools/goreleaser/go.mod cmd/isshoni tools/notices web/package.json web/package-lock.json \
            deploy/install.sh deploy/docker/Dockerfile
          # 06 §8.2 runs the distro scenarios on deploy or release changes. They install the
          # releases that task release:snapshot builds, served by tools/relserve, so a change to
          # relserve or to tools/notices (its output is in the archives) runs them too, as a
          # job's own inputs do for e2e (06 §8.2).
          decide distro "$distro_when" Taskfile.yml .tool-versions go.mod .goreleaser.yaml \
            tools/goreleaser/go.mod cmd/isshoni tools/notices tools/relserve web/package.json \
            web/package-lock.json deploy/install.sh deploy/test/distro-test.sh deploy/test/distro/Containerfile
          decide govulncheck "$go" Taskfile.yml .tool-versions tools/go.mod
          # 06 §8.2: the site on site or deploy changes (deploy covers this workflow and
          # .tool-versions); the site filter has web/src/conntest/codes.json for the anchor test.
          decide site "$site_or_deploy" docs/package.json docs/package-lock.json .tool-versions go.mod
          # M2 06 §10.1: the client core (and, as they land, the updater, the media packages and the
          # app's own packages) on Windows and macOS, and the portable C++ on Linux and macOS. The
          # C++ needs the CMake root and the vcpkg manifest of README WA03.
          decide windows-go "$desktop" go.mod internal/client
          decide desktop-macos "$desktop" go.mod internal/client
          decide native-host "$native" Taskfile.yml .tool-versions native/CMakePresets.json native/vcpkg.json
          # isshoni-media.dll (M2 06 §5.1) on any change to the app, its engine or its packaging: the
          # native code, the MSVC environment and its pins, and tools/desktoppkg (dll-check).
          decide windows-native "$desktop" go.mod native/CMakePresets.json native/vcpkg.json \
            native/windows/CMakeLists.txt deploy/windows/msvc-env.ps1 deploy/windows/tools.json \
            deploy/windows/dll-imports.txt tools/desktoppkg

          task_version=''
          if [ -e .tool-versions ]; then
            task_version=$(awk '$1 == "task" { sub(/^v/, "", $2); print $2; exit }' .tool-versions)
          fi
          if [ -e Taskfile.yml ] && [ -e .tool-versions ] && [ -z "$task_version" ]; then
            echo "::error file=.tool-versions::.tool-versions needs a task pin, a line 'task <version>' (06 §7.1)"
            exit 1
          fi
          echo "task-version=$task_version" >> "$GITHUB_OUTPUT"

  lint-go:
    # The checks of `task lint:go`, for the main module and the tools/ module, plus lint:pins:
    # a go.mod or tools/go.mod change must not leave .tool-versions behind (06 §7.1), and
    # only the go filter sees those files. M2 06 §10.1 adds golangci-lint with GOOS=windows (the
    # Windows-only files) and lint:go:cross: the Windows cross-build without cgo and the gomobile
    # check (package builds of internal/client and internal/media for android and ios).
    needs: changes
    if: needs.changes.outputs.run-lint-go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # one cache per job below: setup-go's key is shared by every job

      - name: Cache Go modules and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum', 'tools/go.mod', 'tools/go.sum', '.tool-versions') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ needs.changes.outputs.task-version }}

      - name: golangci-lint run
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .tool-versions

      - name: golangci-lint run (windows)
        # The x/sys/windows loader of internal/media/native, the updater's apply_windows.go and
        # the app's winos build only for Windows (M2 06 §10.1). The binary is the runner's own;
        # GOOS only picks the files it loads.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: windows
        with:
          version-file: .tool-versions

      - name: go mod tidy -diff
        run: go mod tidy -diff

      - name: go vet (darwin)
        run: GOOS=darwin go vet ./...

      - name: go vet (windows)
        run: GOOS=windows go vet ./...

      - name: task lint:go:cross (windows without cgo; android and ios package builds)
        run: task lint:go:cross

      - name: golangci-lint run (tools module)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: tools
          # Relative to working-directory. The action prefers the golangci-lint version that
          # tools/go.mod requires, which lint:pins keeps equal to this pin.
          version-file: ../.tool-versions

      - name: go mod tidy -diff (tools module)
        # Only a tools/ change can make tools/go.mod untidy, and tidy loads the tools' whole
        # module graph (about 1.6 GB of modules), which every other go change would then
        # download and cache.
        if: needs.changes.outputs.tools == 'true'
        run: go -C tools mod tidy -diff

      - name: go vet (tools module)
        run: go -C tools vet ./...

      - name: go vet (tools module, windows)
        # g2g's GDI capture builds only for Windows (M2 01 §12.2).
        run: GOOS=windows go -C tools vet ./...

      - name: task lint:pins
        run: task lint:pins

  test-go:
    needs: changes
    if: needs.changes.outputs.run-test-go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # one cache per job below: setup-go's key is shared by every job

      - name: Cache Go modules and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum', 'tools/go.mod', 'tools/go.sum', '.tool-versions') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ needs.changes.outputs.task-version }}

      - name: task test:go
        env:
          # test:go keeps the command line it has locally; coverage comes in through GOFLAGS,
          # which only go test acts on. The path is relative, so each of test:go's go test
          # runs writes its own profile where it runs: coverage.out for the main module and
          # tools/coverage.out for tools/ (an absolute path would keep only the last one).
          # .gitignore covers *.out.
          GOFLAGS: -coverprofile=coverage.out
        run: task test:go

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-go
          path: |
            coverage.out
            tools/coverage.out
          if-no-files-found: warn
          retention-days: 14

  web:
    # Runs on every change: the build job always needs its web-dist artifact.
    needs: changes
    if: needs.changes.outputs.run-web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from .tool-versions)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: npm run lint
        run: npm run lint

      - name: npm run typecheck
        run: npm run typecheck

      - name: npm test
        run: npm test -- --run

      - name: npm run check:i18n
        run: npm run check:i18n

      - name: npm run build
        run: npm run build

      - name: npm run check:size
        run: npm run check:size

      - name: Upload web/dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  protocol:
    needs: changes
    if: needs.changes.outputs.run-protocol == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # the tools cache below is the only one this job needs

      # gen:check depends on `task tools`, which builds every pinned tool (golangci-lint and
      # Task included) from source. This caches the built binaries in .bin/ and Task's checksum
      # of tools/go.mod and tools/go.sum in .task/, so on a hit `task tools` is up to date and
      # nothing is compiled. That is about 160 MB on disk, where the module and build caches
      # for the same tools take close to 3 GB: a cold run saves it in seconds, within the
      # 5-minute timeout, and it uses little of the repository's cache space. Shared with
      # govulncheck (same key; when both save at once, one of them skips with a note). No
      # restore-keys: binaries of other versions would only be rebuilt.
      - name: Cache the pinned Go tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .bin
            .task
          key: tools-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/go.mod', 'tools/go.sum') }}

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ needs.changes.outputs.task-version }}

      - name: task gen:check (generated TypeScript matches the Go types)
        run: task gen:check

  licenses:
    # The license gate of 06 §8.3: go-licenses over ./cmd/... for linux, darwin and windows,
    # and web/scripts/licenses.mjs over web/ (and docs/ once the site lands). Only what ships
    # is gated: the tools module (golangci-lint is GPL-3.0) is never linked into anything.
    # The build job's `task notices` is the second half (tools/notices, 06 §8.4).
    needs: changes
    if: needs.changes.outputs.run-licenses == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # one cache per job below: setup-go's key is shared by every job

      # Holds the build of go-licenses too, so a warm run only links it.
      - name: Cache Go modules and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum', 'tools/go.mod', 'tools/go.sum', '.tool-versions') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: Set up Node (version from .tool-versions)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ needs.changes.outputs.task-version }}

      # npm query reads the installed trees, so both projects are installed first.
      - name: npm ci (web)
        run: npm ci --prefix web --no-audit --no-fund

      - name: npm ci (docs)
        if: hashFiles('docs/package-lock.json') != ''
        run: npm ci --prefix docs --no-audit --no-fund

      - name: task licenses
        run: task licenses

      # The gate's own tests: a GPL-3.0 fixture dependency must fail both halves. The npm
      # script's tests run under Node's test runner (Vitest covers src/ and build/ only), and
      # the go-licenses test needs the .bin/go-licenses that task licenses just built (the
      # test-go job skips it).
      - name: The gate fails on a GPL-3.0 fixture dependency (npm)
        working-directory: web
        run: node --test scripts/licenses.test.mjs

      - name: The gate fails on a GPL-3.0 fixture dependency (go-licenses)
        run: |
          GO_LICENSES_BIN="$PWD/.bin/go-licenses" \
            go -C tools test -count=1 -run 'TestGoLicensesGate' -v ./notices

  build:
    needs: [changes, web]
    if: needs.changes.outputs.run-build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # No Node here: the SPA comes from the web job's artifact.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # one cache per job below: setup-go's key is shared by every job

      - name: Cache Go modules and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum', 'tools/go.mod', 'tools/go.sum', '.tool-versions') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ needs.changes.outputs.task-version }}

      - name: Download web/dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist

      - name: task notices
        run: task notices

      - name: task build:go
        run: task build:go

      - name: Check the version and the size of bin/isshoni
        run: |
          info=$(bin/isshoni version --json)
          printf '%s\n' "$info"
          commit=$(git rev-parse HEAD)
          if ! jq -e --arg v "$ISSHONI_VERSION" --arg c "$commit" \
            '.version == $v and .commit == $c' <<< "$info" > /dev/null; then
            echo "::error::isshoni version --json must report version $ISSHONI_VERSION and commit $commit"
            exit 1
          fi
          size=$(stat -c %s bin/isshoni)
          mib=$(( (size + 1048575) / 1048576 ))
          echo "bin/isshoni is $mib MiB"
          if [ "$size" -gt $(( 60 * 1048576 )) ]; then
            echo "::warning::bin/isshoni is $mib MiB, above the 60 MiB budget (06 §8.2)"
          fi

      - name: Check that THIRD_PARTY_NOTICES covers bin/isshoni
        # Every module that `go version -m` reports, and the Go runtime, has an entry (06 §8.4).
        # task notices lists the modules with go list -deps for each shipped GOOS and GOARCH;
        # this checks that list against what the build actually linked.
        run: |
          missing=0 count=0
          while read -r path version; do
            count=$((count + 1))
            if ! awk -v p="$path" -v v="$version" '$1 == p && $2 == v { found = 1 } END { exit !found }' THIRD_PARTY_NOTICES; then
              echo "::error::THIRD_PARTY_NOTICES has no entry for $path $version, which bin/isshoni links"
              missing=1
            fi
          done < <(go version -m bin/isshoni | awk '$1 == "dep" { print $2, $3 }')
          runtime=$(go version bin/isshoni | awk '{ print $2 }')
          if ! grep -qxF "Go standard library and runtime ($runtime)" THIRD_PARTY_NOTICES; then
            echo "::error::THIRD_PARTY_NOTICES has no entry for the Go runtime ($runtime)"
            missing=1
          fi
          if [ "$missing" = 0 ]; then
            echo "THIRD_PARTY_NOTICES lists the Go runtime ($runtime) and all $count modules that bin/isshoni links"
          fi
          exit "$missing"

      - name: Upload bin/isshoni
        # The e2e job downloads it (artifacts drop the mode bit: chmod +x after download).
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isshoni-linux-amd64
          path: bin/isshoni
          if-no-files-found: error
          retention-days: 7

      - name: Build bin/isshoni-loadtest
        # For the e2e job's decodable.spec (README S89), which otherwise builds it with whatever
        # Go the e2e runner has. Not a release artifact: goreleaser builds only ./cmd/isshoni.
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o bin/isshoni-loadtest ./cmd/isshoni-loadtest

      - name: Upload bin/isshoni-loadtest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isshoni-loadtest-linux-amd64
          path: bin/isshoni-loadtest
          if-no-files-found: error
          retention-days: 7

  e2e:
    # The browser tests of web/e2e (docs/m1/05-web-client.md §19.3) against the build job's
    # binary, which has the web job's SPA embedded. Google Chrome runs headful under Xvfb: only
    # a headful Chrome accepts the tab picker of getDisplayMedia. Each test's servers come from
    # the fixtures (web/e2e/fixtures.ts): free ports, a temporary data directory and a log file
    # per server.
    needs: [changes, build]
    if: needs.changes.outputs.run-e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Absolute: npm runs the e2e script from web/ (06 §7.2).
      ISSHONI_BIN: ${{ github.workspace }}/bin/isshoni
      # decodable.spec's tool (README S89); no Go is set up here to build it.
      LOADTEST_BIN: ${{ github.workspace }}/bin/isshoni-loadtest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from .tool-versions)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci --prefix web --no-audit --no-fund

      - name: Download bin/isshoni
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: isshoni-linux-amd64
          path: bin

      - name: Download bin/isshoni-loadtest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: isshoni-loadtest-linux-amd64
          path: bin

      - name: Make bin/isshoni and bin/isshoni-loadtest executable
        run: |
          # Artifacts drop the mode bit.
          chmod +x bin/isshoni bin/isshoni-loadtest
          bin/isshoni version

      - name: Google Chrome, and Playwright's ffmpeg
        run: |
          # The runner image has Google Chrome stable where Playwright's channel "chrome" looks
          # for it; it is installed only where it is missing. Playwright records the videos
          # with its own ffmpeg build, which `install chrome` brings along and a preinstalled
          # Chrome does not.
          if [ -x /opt/google/chrome/chrome ]; then
            /opt/google/chrome/chrome --version
            npx --prefix web playwright install ffmpeg
          else
            npx --prefix web playwright install chrome
          fi

      - name: Xvfb, a window manager and a PulseAudio null sink
        run: |
          # Xvfb is a bare X server. Chrome's capture picker also lists the windows, which reads
          # properties that only a window manager sets: without one, getDisplayMedia never
          # answers (an X BadAtom error in Chrome's log). openbox is a small one.
          # The null sink gives Chrome an audio output device (06 §8.2). In a container run of
          # these steps a captured tab's sound also reached a receiving PeerConnection without
          # any device, so the sink can go if the specs that play audio pass without it.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb openbox pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=isshoni-e2e
          pactl set-default-sink isshoni-e2e
          pactl get-default-sink

      - name: npm run e2e
        # A screen larger than the browser windows; -a picks a free display number. The window
        # manager runs inside the same X session and ends with it.
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            sh -c 'openbox & exec npm --prefix web run e2e'

      - name: Upload the traces, the videos, the server logs and the report
        # web/test-results has a failed test's trace and video and each server's log
        # (server-<worker>-<n>.log, JSON lines); web/playwright-report shows them together.
        # Not only when the job failed: a test that fails and then passes its one retry
        # (web/playwright.config.ts) leaves the job green, and the trace, the video and the
        # server log of its failed attempt are how the flake gets found. A run without any
        # failure uploads only the logs and the report, which are small.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: warn
          retention-days: 7

  lint-deploy:
    needs: changes
    if: needs.changes.outputs.run-lint-deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # one cache per job below: setup-go's key is shared by every job

      - name: Cache Go modules and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum', 'tools/go.mod', 'tools/go.sum', '.tool-versions') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ needs.changes.outputs.task-version }}

      - name: Install the pinned shellcheck, shfmt and actionlint
        run: |
          # The versions are the .tool-versions pins, as with mise on a dev machine (06 §7.1).
          pin() { awk -v tool="$1" '$1 == tool { sub(/^v/, "", $2); print $2; exit }' .tool-versions; }
          shellcheck_v=$(pin shellcheck) shfmt_v=$(pin shfmt) actionlint_v=$(pin actionlint)
          for entry in "shellcheck=$shellcheck_v" "shfmt=$shfmt_v" "actionlint=$actionlint_v"; do
            if [ -z "${entry#*=}" ]; then
              echo "::error file=.tool-versions::.tool-versions needs a ${entry%%=*} pin, a line '${entry%%=*} <version>' (06 §7.1)"
              exit 1
            fi
          done
          bin=$RUNNER_TEMP/bin
          mkdir -p "$bin"
          GOBIN=$bin go install "github.com/rhysd/actionlint/cmd/actionlint@v$actionlint_v"
          GOBIN=$bin go install "mvdan.cc/sh/v3/cmd/shfmt@v$shfmt_v"
          curl -fsSL --retry 3 \
            "https://github.com/koalaman/shellcheck/releases/download/v$shellcheck_v/shellcheck-v$shellcheck_v.linux.x86_64.tar.xz" |
            tar -xJ -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/shellcheck-v$shellcheck_v/shellcheck" "$bin/shellcheck"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/shellcheck" --version
          "$bin/shfmt" --version
          "$bin/actionlint" -version

      - name: Install busybox (test:sh runs the install.sh unit tests under it)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends busybox

      - name: task lint:sh lint:actions lint:keys lint:unit lint:pins test:sh
        run: task lint:sh lint:actions lint:keys lint:unit lint:pins test:sh

  acme:
    # The ACME tests of docs/m1/04-server-platform.md §17: the TLS manager, and `isshoni serve`
    # in auto mode, against Pebble with pebble-challtestsrv as its DNS. Pebble issues for a
    # domain and for an IP address (the shortlived profile), through http-01 and through
    # tls-alpn-01, and a certificate with a shortened lifetime is renewed.
    #
    # Pebble validates on 127.0.0.1:5002 (http-01) and 127.0.0.1:5001 (tls-alpn-01), the two
    # ports of internal/server/tlsmgr/testdata/pebble-config.json, where the tests listen. So
    # the two containers share the runner's network (--network host) and are started by a
    # step: a service container gets a network of its own and takes no arguments.
    needs: changes
    if: needs.changes.outputs.run-acme == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Pebble v2.10.1, both images by the digest of their multi-arch index.
      PEBBLE_IMAGE: ghcr.io/letsencrypt/pebble@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199
      CHALLTESTSRV_IMAGE: ghcr.io/letsencrypt/pebble-challtestsrv@sha256:12ce21884def456bcf9786542113949e1f19dc7738d2c70e156c2d0c38a1405b
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # one cache per job below: setup-go's key is shared by every job

      - name: Cache Go modules and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum', 'tools/go.mod', 'tools/go.sum', '.tool-versions') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: Start Pebble and pebble-challtestsrv
        run: |
          # challtestsrv is Pebble's DNS only: every name resolves to 127.0.0.1, and its own
          # challenge servers stay off, because the tests answer the challenges themselves.
          docker run -d --name challtestsrv --network host "$CHALLTESTSRV_IMAGE" \
            -defaultIPv4 127.0.0.1 -defaultIPv6 "" -http01 "" -https01 "" -tlsalpn01 "" -doh ""
          # No random waits before a validation and no rejected nonces: the tests are about
          # isshoni, not about a client's patience.
          docker run -d --name pebble --network host \
            -e PEBBLE_VA_NOSLEEP=1 -e PEBBLE_WFE_NONCEREJECT=0 \
            -v "$PWD/internal/server/tlsmgr/testdata/pebble-config.json:/test/config/isshoni.json:ro" \
            "$PEBBLE_IMAGE" -config /test/config/isshoni.json -dnsserver 127.0.0.1:8053
          # The CA behind Pebble's own HTTPS endpoints (tls.acme_ca_root).
          docker cp pebble:/test/certs/pebble.minica.pem "$RUNNER_TEMP/pebble.minica.pem"
          for _ in $(seq 1 60); do
            if curl -fsS --cacert "$RUNNER_TEMP/pebble.minica.pem" -o /dev/null https://127.0.0.1:14000/dir; then
              echo "Pebble is up"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::Pebble did not answer on https://127.0.0.1:14000/dir within 30 s"
          exit 1

      - name: go test -run ACME (the TLS manager, then the server)
        env:
          # The env names of the config keys tls.acme_ca and tls.acme_ca_root; the ACME tests
          # run when both are set and are skipped otherwise.
          ISSHONI_TLS_ACME_CA: https://127.0.0.1:14000/dir
          ISSHONI_TLS_ACME_CA_ROOT: ${{ runner.temp }}/pebble.minica.pem
        run: |
          # -p 1: both packages listen on Pebble's two validation ports.
          go test -race -count=1 -p 1 -run ACME -v ./internal/server/tlsmgr ./internal/server 2>&1 |
            tee "$RUNNER_TEMP/acme.log"
          # A skipped ACME test would leave this job green without having tested anything.
          if grep -E '^[[:space:]]*--- SKIP' "$RUNNER_TEMP/acme.log"; then
            echo "::error::an ACME test was skipped; this job exists to run them"
            exit 1
          fi

      - name: Show the logs of Pebble and pebble-challtestsrv
        if: failure()
        run: |
          docker logs pebble || true
          docker logs challtestsrv || true

  docker-smoke:
    # The Docker smoke test of 06 §11.3, on linux/amd64. `task docker:smoke` builds the web
    # app, THIRD_PARTY_NOTICES and the server binary for one version, and from them the image
    # with deploy/docker/Dockerfile, as goreleaser does at a release. Then
    # deploy/docker/test/docker-smoke.sh starts the image the way the docs do: compose.yaml
    # (bridge network) and compose.host.yaml (host network) with a throwaway certificate, a
    # start without a data volume (exit 78) and one without a .env file. On a failure the
    # script prints the container's last log lines.
    #
    # The runner is the Docker host: the test uses its ports 80, 443 and 7882, and reads the
    # owner of port 443 with `sudo ss`. Node is set up because the task builds the web app
    # itself, so the job waits for no artifact of the web job.
    needs: changes
    if: needs.changes.outputs.run-docker-smoke == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # one cache per job below: setup-go's key is shared by every job

      - name: Cache Go modules and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum', 'tools/go.mod', 'tools/go.sum', '.tool-versions') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: Set up Node (version from .tool-versions)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ needs.changes.outputs.task-version }}

      - name: npm ci
        run: npm ci --prefix web --no-audit --no-fund

      - name: Show the Docker versions
        run: |
          docker version
          docker compose version
          docker buildx version

      - name: task docker:smoke
        run: task docker:smoke

  goreleaser-check:
    # The release build of .goreleaser.yaml as a snapshot (06 §8.2, §9.2). `task release:snapshot`
    # builds the pinned goreleaser (tools/goreleaser) and the web app for the snapshot's version,
    # runs `goreleaser check`, then `goreleaser release --snapshot` without signing, SBOMs or
    # publishing: the two images are built and loaded here, never pushed. Then `task
    # release:assets` asserts the asset list of 06 §3: the names, checksums.txt, the archives'
    # contents, the packages' files and dependencies, and the version that this runner's binary
    # reports. The task's last step starts this runner's image and checks its version too.
    #
    # The snapshot carries this run's CI version (0.0.0-ci.<run>), not a dev version.
    needs: changes
    if: needs.changes.outputs.run-goreleaser-check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ISSHONI_SNAPSHOT_VERSION: 0.0.0-ci.${{ github.run_number }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # one cache per job below: setup-go's key is shared by every job

      - name: Cache Go modules and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum', 'tools/go.mod', 'tools/go.sum', '.tool-versions') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      # The pinned goreleaser and Task's checksum of its module: on a hit `task release:goreleaser`
      # is up to date, and goreleaser's large module graph is neither downloaded nor compiled. No
      # restore-keys: a binary of another version would only be rebuilt.
      - name: Cache the pinned goreleaser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .bin/goreleaser
            .task/checksum/release-goreleaser
          key: goreleaser-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/goreleaser/go.mod', 'tools/goreleaser/go.sum') }}

      - name: Set up Node (version from .tool-versions)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ needs.changes.outputs.task-version }}

      - name: npm ci
        run: npm ci --prefix web --no-audit --no-fund

      - name: Install rpm (release:assets lists the rpm packages and their dependencies with it)
        run: |
          if ! command -v rpm > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends rpm
          fi
          rpm --version

      - name: task release:snapshot
        run: task release:snapshot

  distro-release:
    # The two test releases of the install.sh scenarios (06 §11.2), built once for the distro
    # matrix below: `task release:snapshot` (goreleaser, without the images) as 0.0.1-ci.1 and
    # 0.0.1-ci.2, each with the web app built for its version first. deploy/test/distro-test.sh
    # -b keeps what the installer downloads: the linux archives, checksums.txt and the stamped
    # install.sh. Unsigned: every distro job signs them with a key of its own.
    needs: changes
    if: needs.changes.outputs.run-distro == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # one cache per job below: setup-go's key is shared by every job

      - name: Cache Go modules and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum', 'tools/go.mod', 'tools/go.sum', '.tool-versions') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      # The cache of goreleaser-check, by the same key (see there).
      - name: Cache the pinned goreleaser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .bin/goreleaser
            .task/checksum/release-goreleaser
          key: goreleaser-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/goreleaser/go.mod', 'tools/goreleaser/go.sum') }}

      - name: Set up Node (version from .tool-versions)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ needs.changes.outputs.task-version }}

      - name: npm ci
        run: npm ci --prefix web --no-audit --no-fund

      - name: Install rpm (release:snapshot's asset check lists the rpm packages with it)
        run: |
          if ! command -v rpm > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends rpm
          fi

      - name: Build the releases 0.0.1-ci.1 and 0.0.1-ci.2
        run: sh deploy/test/distro-test.sh -b "$RUNNER_TEMP/distro-releases"

      - name: Upload the releases
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distro-releases
          path: ${{ runner.temp }}/distro-releases
          if-no-files-found: error
          retention-days: 1

  distro:
    # The install.sh scenarios of 06 §11.2 on the six container distros of 06 §4.13, one job
    # each: deploy/test/distro-test.sh with the releases of distro-release, served by
    # tools/relserve on this runner. Per distro: C1-C6 and C8-C10 and C12 in one systemd
    # container, C7 and C13 in one each, C11 in the distro's plain image, and V3 with a running
    # firewall on Fedora (firewalld) and Ubuntu 24.04 (ufw). Docker, privileged, unlike
    # release.yml's verify job, which runs the runner's rootless podman with --cap-add SYS_ADMIN,
    # a systemd user session and relserve as host.containers.internal (06 §4.13).
    # distro-test.sh's podman path adds SYS_ADMIN and SYS_PTRACE and reaches relserve the same
    # way, but leaves the user session to its caller, and this job sets none up (README F16).
    needs: [changes, distro-release]
    if: needs.changes.outputs.run-distro == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro: [debian-12, debian-13, ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, fedora-44]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod; for tools/relserve)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # one cache per job below: setup-go's key is shared by every job

      - name: Cache Go modules and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum', 'tools/go.mod', 'tools/go.sum', '.tool-versions') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: Download the releases
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distro-releases
          path: ${{ runner.temp }}/distro-releases

      - name: The scenarios on ${{ matrix.distro }}
        env:
          CONTAINER_ENGINE: docker
          DISTRO: ${{ matrix.distro }}
        run: sh deploy/test/distro-test.sh -r "$RUNNER_TEMP/distro-releases" "$DISTRO"

  site:
    # The project site (06 §8.2, §10): vitepress build, the check that it loads nothing from
    # other origins (docs/scripts/check-site.mjs), and the anchor test, TestDocsAnchors: every
    # doctor check id, connection test code and cloud provider id has its section on the site
    # (06 §10.4). test-go runs the same test on Go changes; this job runs it for the changes
    # that test-go doesn't see, a docs-only or a codes.json-only pull request. Deploying is
    # site.yml's (on main and from release.yml), never this workflow's.
    needs: changes
    if: needs.changes.outputs.run-site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from .tool-versions)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: npm ci
        run: npm ci --prefix docs --no-audit --no-fund

      - name: vitepress build
        run: npx --prefix docs vitepress build docs

      - name: The site loads nothing from other origins (06 §10.1)
        run: node docs/scripts/check-site.mjs

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # one cache per job below: setup-go's key is shared by every job

      - name: Cache Go modules and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: The site's anchors for the product's links (TestDocsAnchors, 06 §10.4)
        run: go test -count=1 -run '^TestDocsAnchors$' -v ./internal/server/ops/doctor

  govulncheck:
    needs: changes
    if: needs.changes.outputs.run-govulncheck == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Not gating (and not in ci-ok's needs): a newly published vulnerability must not block
    # unrelated pull requests. The nightly and release workflows gate on it (06 §8.2, §8.5).
    continue-on-error: true
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # one cache per job below: setup-go's key is shared by every job

      - name: Cache Go modules and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum', 'tools/go.mod', 'tools/go.sum', '.tool-versions') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: Cache the pinned Go tools (shared with the protocol job, see there)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .bin
            .task
          key: tools-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/go.mod', 'tools/go.sum') }}

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ needs.changes.outputs.task-version }}

      - name: task tools (the pinned govulncheck into .bin/)
        run: task tools

      - name: govulncheck ./...
        run: .bin/govulncheck ./...

  windows-go:
    # The Go packages of the Windows app that need no engine DLL, on Windows (M2 06 §10.1): the
    # client core, the updater, the media packages with the fake engine and the app's own
    # packages (internal/desktop/..., cmd/isshoni-desktop/...), first with the race detector,
    # which needs cgo and so the image's MinGW-w64 gcc (as the nightly's go-cross-os), then with
    # CGO_ENABLED=0, the mode the app ships in. Every Go test on Windows runs here except the
    # engine DLL's (README §3 item 11, 06 §10.1's windows-desktop row, 03 §22): those skip without
    # ISSHONI_TEST_ENGINE_DLL, and windows-desktop runs them with the DLL. A directory that holds
    # no Go file yet (internal/update before README WA25, cmd/isshoni-desktop before WA22) is
    # left out.
    needs: changes
    if: needs.changes.outputs.run-windows-go == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # one cache per job below: setup-go's key is shared by every job

      - name: Find Go's module and build caches
        id: goenv
        run: |
          "modcache=$(go env GOMODCACHE)" >> $env:GITHUB_OUTPUT
          "gocache=$(go env GOCACHE)" >> $env:GITHUB_OUTPUT

      - name: Cache Go modules and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.goenv.outputs.modcache }}
            ${{ steps.goenv.outputs.gocache }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: gcc for cgo (MinGW-w64, for the race detector)
        run: |
          if (Get-Command gcc -ErrorAction SilentlyContinue) {
            gcc --version | Select-Object -First 1
            exit 0
          }
          # The runner images keep MinGW-w64 in one of these places; Chocolatey is the fallback.
          foreach ($dir in 'C:\mingw64\bin', 'C:\msys64\ucrt64\bin', 'C:\msys64\mingw64\bin') {
            if (Test-Path (Join-Path $dir 'gcc.exe')) {
              $dir >> $env:GITHUB_PATH
              & (Join-Path $dir 'gcc.exe') --version | Select-Object -First 1
              exit 0
            }
          }
          "::notice::no gcc on this runner image; installing MinGW-w64 with Chocolatey"
          choco install mingw --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C:\ProgramData\mingw64\mingw64\bin' >> $env:GITHUB_PATH

      - name: The packages to test
        id: pkgs
        run: |
          # A pattern counts once its directory holds a Go file; go test fails on a pattern that
          # matches no package. A directory alone is not enough: cmd/isshoni-desktop can hold only
          # build/windows/ (README WA22).
          $hasGo = { param($dir) [bool](Get-ChildItem -LiteralPath $dir -Recurse -File -Filter *.go -ErrorAction SilentlyContinue | Select-Object -First 1) }
          $race = @('internal/client', 'internal/update', 'internal/media', 'internal/desktop', 'cmd/isshoni-desktop') | Where-Object { & $hasGo $_ } | ForEach-Object { "./$_/..." }
          $nocgo = @('internal/client', 'internal/update', 'internal/desktop', 'cmd/isshoni-desktop') | Where-Object { & $hasGo $_ } | ForEach-Object { "./$_/..." }
          "race=$($race -join ' ')" >> $env:GITHUB_OUTPUT
          "nocgo=$($nocgo -join ' ')" >> $env:GITHUB_OUTPUT
          "go test -race: $($race -join ' ')"
          "go test with CGO_ENABLED=0: $($nocgo -join ' ')"

      - name: go env
        env:
          CGO_ENABLED: '1'
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED CC

      - name: go test -race (MinGW-w64)
        env:
          CGO_ENABLED: '1'
          PKGS: ${{ steps.pkgs.outputs.race }}
        run: |
          go test -race -count=1 -timeout 12m @(-split $env:PKGS)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: go test (CGO_ENABLED=0, as the app ships)
        env:
          CGO_ENABLED: '0'
          PKGS: ${{ steps.pkgs.outputs.nocgo }}
        run: |
          go test -count=1 -timeout 12m @(-split $env:PKGS)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  desktop-macos:
    # The Windows app's Go packages on macOS (M2 06 §10.1): the client core, the media packages,
    # the updater and the app's own packages (internal/desktop/..., cmd/isshoni-desktop/...) with
    # the race detector, then the darwin app itself (cgo, the fake engine until M3) once
    # cmd/isshoni-desktop exists (README WA22). Packages that do not exist yet are left out.
    needs: changes
    if: needs.changes.outputs.run-desktop-macos == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # one cache per job below: setup-go's key is shared by every job

      - name: Cache Go modules and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: go test -race (client core, media, updater, the app's packages)
        run: |
          # A pattern counts once its directory holds a Go file: cmd/isshoni-desktop can hold only
          # build/windows/ (README WA22). Here, darwin with cgo, the app's main package is the real
          # one (03 §4.5, D18), which ubuntu's test-go never builds.
          pkgs=()
          for dir in internal/client internal/media internal/update internal/desktop cmd/isshoni-desktop; do
            if [ -n "$(find "$dir" -name '*.go' -type f 2>/dev/null | head -n 1)" ]; then pkgs+=("./$dir/..."); fi
          done
          echo "go test -race ${pkgs[*]}"
          go test -race -count=1 -timeout 15m "${pkgs[@]}"

      - name: go build ./cmd/isshoni-desktop (darwin, cgo)
        if: hashFiles('cmd/isshoni-desktop/**/*.go') != ''
        run: go build -o "$RUNNER_TEMP/isshoni-desktop" ./cmd/isshoni-desktop

  native-host:
    # The portable C++ of native/ on Linux and macOS (M2 06 §10.1, docs/m2/04 §18.1): `task
    # native:test` for the presets host-debug and host-tsan, which fetches vcpkg at
    # native/vcpkg.json's baseline (shallow, into the runner's temp directory), bootstraps it
    # with metrics off and builds native/common and its tests with CMake, as on a Mac. vcpkg's
    # binary packages (libopus, speexdsp, gtest) are cached per OS, image and manifest, without
    # restore keys: vcpkg rebuilds a stale one anyway. On ubuntu also `task lint:native`
    # (clang-format --dry-run --Werror).
    needs: changes
    if: needs.changes.outputs.run-native-host == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ needs.changes.outputs.task-version }}

      - name: vcpkg's binary cache
        id: vcpkg
        run: |
          # The image version keys the cache, so a new compiler in a new image starts a new one.
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          echo "VCPKG_BINARY_SOURCES=clear;files,$RUNNER_TEMP/vcpkg-cache,readwrite" >> "$GITHUB_ENV"

      - name: Cache vcpkg's binary packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-host-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.image }}-${{ hashFiles('native/vcpkg.json', 'native/vcpkg-configuration.json') }}

      - name: task lint:native (clang-format 18)
        if: runner.os == 'Linux'
        run: |
          if ! command -v clang-format-18 > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends clang-format-18
          fi
          task lint:native CLANG_FORMAT=clang-format-18

      - name: task native:test PRESET=host-debug
        run: task native:test PRESET=host-debug VCPKG_DIR="$RUNNER_TEMP/vcpkg"

      - name: Let ThreadSanitizer map its shadow memory (ubuntu)
        # Ubuntu 24.04's kernel randomizes mmap with 32 bits, where TSan's fixed shadow layout
        # fails with "unexpected memory mapping"; 28 bits is the older default.
        if: runner.os == 'Linux'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: task native:test PRESET=host-tsan
        run: task native:test PRESET=host-tsan VCPKG_DIR="$RUNNER_TEMP/vcpkg"

  windows-native:
    # isshoni-media.dll (M2 06 §5.1, R3a; docs/m2/04 §13, §18.2): the MSVC environment of
    # deploy/windows/msvc-env.ps1 (toolset and SDK from deploy/windows/tools.json), vcpkg at
    # native/vcpkg.json's baseline with a binary cache, then the presets win-x64-ci (build and
    # ctest: 04 §18.2's Windows tests and native/common's tests under MSVC) and win-x64-release
    # (build); tools/desktoppkg dll-check on the release DLL only (exports, static: and delay:
    # imports, VERSIONINFO); the WebView2 bootstrapper's signature; and the Go tests that need
    # the engine DLL (ISSHONI_TEST_ENGINE_DLL), here until windows-desktop takes them over
    # (README WA72). Uploads windows-native, kept 1 day: release\ (the shipped DLL and PDB, the
    # vcpkg copyright files of the release tree, the bootstrapper, native-manifest.json) and ci\
    # (the test-hooks DLL, never staged). FFmpeg joins with README WA24: the locked zip as
    # IM_FFMPEG_ROOT, its staleness and hash checks, dll-check -ffmpeg and isshoni-native-tools.
    needs: changes
    if: needs.changes.outputs.run-windows-native == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_DISABLE_METRICS: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # one cache per job below: setup-go's key is shared by every job

      - name: Find Go's module and build caches
        id: goenv
        run: |
          "modcache=$(go env GOMODCACHE)" >> $env:GITHUB_OUTPUT
          "gocache=$(go env GOCACHE)" >> $env:GITHUB_OUTPUT

      - name: Cache Go modules and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.goenv.outputs.modcache }}
            ${{ steps.goenv.outputs.gocache }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum', 'tools/go.mod', 'tools/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: MSVC environment
        id: msvc
        run: ./deploy/windows/msvc-env.ps1

      - name: vcpkg at native/vcpkg.json's baseline
        id: vcpkg
        run: |
          $baseline = [string](Get-Content -Raw -LiteralPath native/vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          if ($baseline -notmatch '^[0-9a-f]{40}$') { throw 'native/vcpkg.json has no 40-hex builtin-baseline' }
          $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git init -q $root
          git -C $root remote add origin https://github.com/microsoft/vcpkg.git
          git -C $root fetch -q --depth 1 origin $baseline
          if ($LASTEXITCODE -ne 0) { throw "git fetch of vcpkg $baseline failed" }
          git -C $root checkout -q --detach FETCH_HEAD
          # Downloads the vcpkg tool release the checkout pins and checks its SHA-512.
          & (Join-Path $root 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "bootstrap-vcpkg.bat failed (exit code $LASTEXITCODE)" }
          $cache = Join-Path $env:RUNNER_TEMP 'vcpkg-cache'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite" >> $env:GITHUB_ENV
          "baseline=$baseline" >> $env:GITHUB_OUTPUT
          "cache=$cache" >> $env:GITHUB_OUTPUT

      - name: Cache vcpkg's binary packages
        # M2 06 §5.1: keyed on the manifest, the triplet and the toolset build, no restore keys.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.vcpkg.outputs.cache }}
          key: vcpkg-x64-windows-static-${{ steps.msvc.outputs.toolset }}-${{ hashFiles('native/vcpkg.json', 'native/vcpkg-configuration.json') }}

      - name: CMake and Ninja
        id: tools
        run: |
          # The ones on PATH (the image's, or Visual Studio's once msvc-env.ps1 ran), else the copies vcpkg
          # pins and verifies by SHA-512.
          foreach ($tool in 'cmake', 'ninja') {
            $cmd = Get-Command $tool -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($cmd) {
              $path = $cmd.Source
            } else {
              $path = [string](& (Join-Path $env:VCPKG_ROOT 'vcpkg.exe') fetch $tool | Select-Object -Last 1)
              if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $path.Trim())) { throw "vcpkg fetch $tool failed" }
              $path = $path.Trim()
            }
            "${tool}: $path ($(& $path --version | Select-Object -First 1))"
            "$tool=$path" >> $env:GITHUB_OUTPUT
            if ($tool -eq 'cmake') { "ctest=$(Join-Path (Split-Path -Parent $path) 'ctest.exe')" >> $env:GITHUB_OUTPUT }
          }

      - name: win-x64-ci - configure, build and test
        working-directory: native
        env:
          CMAKE: ${{ steps.tools.outputs.cmake }}
          CTEST: ${{ steps.tools.outputs.ctest }}
          NINJA: ${{ steps.tools.outputs.ninja }}
        run: |
          & $env:CMAKE --preset win-x64-ci "-DCMAKE_MAKE_PROGRAM=$env:NINJA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CMAKE --build --preset win-x64-ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CTEST --preset win-x64-ci --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: The delay-load helper and /DEPENDENTLOADFLAG (README WA11's verdict)
        if: always()
        run: |
          # Written by dll_search_test; it decides M2 06 §5.1's conditional load-config check.
          $file = 'native/build/win-x64-ci/windows/dependentloadflag-verdict.txt'
          if (-not (Test-Path -LiteralPath $file)) {
            '::warning::dll_search_test wrote no DEPENDENTLOADFLAG verdict'
            exit 0
          }
          $verdict = (Get-Content -Raw -LiteralPath $file).Trim()
          "DEPENDENTLOADFLAG verdict: $verdict"
          "### /DEPENDENTLOADFLAG:0x800 and the delay-load helper`n`n$verdict`n" >> $env:GITHUB_STEP_SUMMARY

      - name: win-x64-release - configure and build
        id: release
        working-directory: native
        env:
          CMAKE: ${{ steps.tools.outputs.cmake }}
          NINJA: ${{ steps.tools.outputs.ninja }}
          VERSION: ${{ env.ISSHONI_VERSION }}
        run: |
          # The four-part version of M2 06 §5.3 for CI's 0.0.0-ci.<run>: 0.0.0.<run mod 65000> (the rule
          # tools/desktoppkg winver implements from README WA67 on).
          if ($env:VERSION -notmatch '^(\d+)\.(\d+)\.(\d+)-ci\.(\d+)$') { throw "ISSHONI_VERSION '$env:VERSION' is not X.Y.Z-ci.N" }
          $winver = '{0}.{1}.{2}.{3}' -f $Matches[1], $Matches[2], $Matches[3], ([int64]$Matches[4] % 65000)
          $commit = [string](git rev-parse --short=7 HEAD)
          & $env:CMAKE --preset win-x64-release "-DCMAKE_MAKE_PROGRAM=$env:NINJA" "-DIM_VERSION=$env:VERSION" `
            "-DIM_WINVER=$winver" "-DIM_COMMIT=$($commit.Trim())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CMAKE --build --preset win-x64-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "winver=$winver" >> $env:GITHUB_OUTPUT

      - name: dumpbin of the release DLL (for the log)
        run: |
          $dll = 'native/build/win-x64-release/windows/isshoni-media.dll'
          dumpbin /nologo /dependents /exports $dll
          dumpbin /nologo /loadconfig $dll | Select-String -Pattern 'Dependent Load' -SimpleMatch
          exit 0

      - name: dll-check (the release DLL)
        env:
          VERSION: ${{ env.ISSHONI_VERSION }}
          WINVER: ${{ steps.release.outputs.winver }}
        run: |
          $dll = Join-Path $env:GITHUB_WORKSPACE 'native/build/win-x64-release/windows/isshoni-media.dll'
          go -C tools run ./desktoppkg dll-check -dll $dll -version $env:VERSION -winver $env:WINVER
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: The WebView2 bootstrapper (signature checked)
        id: webview2
        run: |
          # M2 06 §5.1: downloaded from tools.json's URL; Authenticode Valid with exactly the pinned signer.
          $pin = (Get-Content -Raw -LiteralPath deploy/windows/tools.json | ConvertFrom-Json).webview2Bootstrapper
          $file = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          $ProgressPreference = 'SilentlyContinue'
          for ($try = 1; ; $try++) {
            try {
              Invoke-WebRequest -UseBasicParsing -Uri $pin.url -OutFile $file
              break
            } catch {
              if ($try -ge 3) { throw }
              "download failed ($($_.Exception.Message)); trying again"
              Start-Sleep -Seconds (5 * $try)
            }
          }
          $sig = Get-AuthenticodeSignature -LiteralPath $file
          if ($sig.Status -ne 'Valid') { throw "the bootstrapper's signature is $($sig.Status): $($sig.StatusMessage)" }
          $subject = $sig.SignerCertificate.Subject
          if ($subject -cne $pin.signer) { throw "the bootstrapper is signed by '$subject', not '$($pin.signer)'" }
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
          "WebView2 bootstrapper: SHA-256 $sha, signed by $subject"
          "path=$file" >> $env:GITHUB_OUTPUT
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          "signer=$subject" >> $env:GITHUB_OUTPUT

      - name: gcc for cgo (MinGW-w64, for the race detector)
        run: |
          if (Get-Command gcc -ErrorAction SilentlyContinue) {
            gcc --version | Select-Object -First 1
            exit 0
          }
          foreach ($dir in 'C:\mingw64\bin', 'C:\msys64\ucrt64\bin', 'C:\msys64\mingw64\bin') {
            if (Test-Path (Join-Path $dir 'gcc.exe')) {
              $dir >> $env:GITHUB_PATH
              & (Join-Path $dir 'gcc.exe') --version | Select-Object -First 1
              exit 0
            }
          }
          "::notice::no gcc on this runner image; installing MinGW-w64 with Chocolatey"
          choco install mingw --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C:\ProgramData\mingw64\mingw64\bin' >> $env:GITHUB_PATH

      - name: go test -race ./internal/media/... with the engine DLL (win-x64-ci)
        # The DLL-dependent Go tests (04 §18.2); they skip without ISSHONI_TEST_ENGINE_DLL, so they
        # run here and nowhere else until windows-desktop exists (README WA72).
        env:
          CGO_ENABLED: '1'
          ISSHONI_TEST_ENGINE_DLL: ${{ github.workspace }}\native\build\win-x64-ci\windows\isshoni-media.dll
        run: |
          go test -race -count=1 -timeout 10m ./internal/media/...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: The windows-native artifact
        env:
          VERSION: ${{ env.ISSHONI_VERSION }}
          WINVER: ${{ steps.release.outputs.winver }}
          BASELINE: ${{ steps.vcpkg.outputs.baseline }}
          TOOLSET: ${{ steps.msvc.outputs.toolset }}
          VS_VERSION: ${{ steps.msvc.outputs.vs-version }}
          WINDOWS_SDK: ${{ steps.msvc.outputs.windows-sdk }}
          WEBVIEW2: ${{ steps.webview2.outputs.path }}
          WEBVIEW2_SHA256: ${{ steps.webview2.outputs.sha256 }}
          WEBVIEW2_SIGNER: ${{ steps.webview2.outputs.signer }}
        run: |
          # M2 06 §5.1: release\ is the win-x64-release output only; ci\ holds the test-hooks DLL.
          $out = Join-Path $env:RUNNER_TEMP 'windows-native'
          $rel = Join-Path $out 'release'
          $ci = Join-Path $out 'ci'
          New-Item -ItemType Directory -Force -Path $rel, $ci | Out-Null
          $build = 'native/build/win-x64-release'
          Copy-Item -LiteralPath "$build/windows/isshoni-media.dll", "$build/windows/isshoni-media.pdb" -Destination $rel
          Copy-Item -LiteralPath 'native/build/win-x64-ci/windows/isshoni-media.dll' -Destination $ci

          # The vcpkg ports of the release tree (built without the tests feature, so no gtest): their
          # copyright files and their versions from vcpkg's status database.
          $installed = "$build/vcpkg_installed"
          $ports = [ordered]@{}
          $stanzas = (Get-Content -Raw -LiteralPath "$installed/vcpkg/status") -split "(?:\r?\n){2,}"
          foreach ($stanza in $stanzas) {
            $f = @{}
            foreach ($line in $stanza -split "\r?\n") {
              if ($line -match '^([A-Za-z-]+): (.*)$') { $f[$Matches[1]] = $Matches[2] }
            }
            if ($f['Package'] -and -not $f['Feature'] -and $f['Status'] -eq 'install ok installed' -and
                $f['Architecture'] -eq 'x64-windows-static') {
              $v = $f['Version']
              if ($f['Port-Version'] -and $f['Port-Version'] -ne '0') { $v = "$v#$($f['Port-Version'])" }
              $ports[$f['Package']] = $v
            }
          }
          foreach ($port in $ports.Keys) {
            $copyright = "$installed/x64-windows-static/share/$port/copyright"
            if (-not (Test-Path -LiteralPath $copyright)) { throw "vcpkg port $port has no copyright file" }
            $dest = Join-Path $rel "licenses/vcpkg/$port"
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Copy-Item -LiteralPath $copyright -Destination $dest
          }
          # License files the native slices commit (README WA51: OpenH264's headers; WA50: C++/WinRT).
          foreach ($pair in @(@('native/windows/third_party/openh264/LICENSE', 'licenses/openh264'),
                              @('native/windows/third_party/cppwinrt/LICENSE', 'licenses/cppwinrt'))) {
            if (Test-Path -LiteralPath $pair[0]) {
              $dest = Join-Path $rel $pair[1]
              New-Item -ItemType Directory -Force -Path $dest | Out-Null
              Copy-Item -LiteralPath $pair[0] -Destination $dest
            }
          }
          Copy-Item -LiteralPath $env:WEBVIEW2 -Destination $rel

          $header = Get-Content -Raw -LiteralPath native/include/isshoni_media.h
          if ($header -notmatch '#define IM_ABI_MAJOR\s+(\d+)u' ) { throw 'no IM_ABI_MAJOR in the header' }
          $major = [int]$Matches[1]
          if ($header -notmatch '#define IM_ABI_MINOR\s+(\d+)u' ) { throw 'no IM_ABI_MINOR in the header' }
          $minor = [int]$Matches[1]
          $dllSha = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $rel 'isshoni-media.dll')).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version              = $env:VERSION
            winver               = $env:WINVER
            dll                  = [ordered]@{ name = 'isshoni-media.dll'; sha256 = $dllSha; abi = ($major * 65536 + $minor) }
            ffmpeg               = $null # README WA24
            vcpkg                = [ordered]@{ baseline = $env:BASELINE; ports = $ports }
            msvcToolset          = $env:TOOLSET
            vsInstance           = $env:VS_VERSION
            windowsSdk           = $env:WINDOWS_SDK
            webview2Bootstrapper = [ordered]@{ sha256 = $env:WEBVIEW2_SHA256; signer = $env:WEBVIEW2_SIGNER }
          }
          $json = $manifest | ConvertTo-Json -Depth 6
          [IO.File]::WriteAllText((Join-Path $rel 'native-manifest.json'), $json + "`n", (New-Object Text.UTF8Encoding($false)))
          $json
          Get-ChildItem -LiteralPath $out -Recurse -File | ForEach-Object { $_.FullName.Substring($out.Length + 1) }

      - name: Upload windows-native
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-native
          path: ${{ runner.temp }}/windows-native/
          retention-days: 1
          if-no-files-found: error

  ci-ok:
    # The only required check (06 §8.6). It fails when a gating job failed or was cancelled;
    # a skipped job counts as a pass. always(), so it also reports when a job it needs failed.
    if: always()
    needs:
      [
        changes,
        lint-go,
        test-go,
        web,
        protocol,
        licenses,
        build,
        e2e,
        lint-deploy,
        acme,
        docker-smoke,
        goreleaser-check,
        distro-release,
        distro,
        site,
        windows-go,
        desktop-macos,
        native-host,
        windows-native,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Check the results of the gating jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          bad=$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")' <<< "$NEEDS")
          if [ -n "$bad" ]; then
            echo "::error::these gating jobs failed or were cancelled: $bad"
            exit 1
          fi
          echo "Every gating job passed or was skipped."
