# Weekly version updates (docs/m1/06-deploy-and-ci.md §8.1, "06" below). Minor and patch
# updates are grouped per ecosystem; a major update gets a pull request of its own, unless an
# ignore list below holds it back.
#
# Target branch: during M1 every pull request goes to m1/server-web, where M1 work lands before
# it reaches main (docs/m1/README.md §4, "Branches and PRs"), so every ecosystem below sets
# target-branch: m1/server-web. After M1, when m1/server-web has been merged into main for the
# last time, switch every target-branch to main (or delete the lines: main is the default).
# Dependabot reads this file from the default branch, so a change here takes effect once it is
# merged into main.
#
# Not covered here: the tools pinned in .tool-versions, including the Task, golangci-lint and
# shfmt modules in tools/go.mod and goreleaser's own module, tools/goreleaser/go.mod (bumped by
# hand, monthly: 06 §7.1); the Dockerfile's `# syntax=` line, which the docker ecosystem does
# not read (bumped by hand with those pins); the image digests inside workflows, which no
# ecosystem reads (release.yml's verify matrix bases and its BuildKit driver image, and the
# Pebble images of ci.yml's acme job and deploy/test/vm/vm-test.sh; bumped by hand with those
# pins: 06 §4.13, §7.1); and spikes/, which is throwaway.
#
# Also by hand (docs/m2/06-windows-release.md §3, §10.6): Wails, which moves as one in go.mod,
# the wails3 CLI's own module tools/wails3/go.mod (no directory below lists it) and
# @wailsio/runtime in web/package.json, with a Windows smoke and the origin test (ignored below
# in both ecosystems; `task lint:pins` checks that the three agree); and, with the monthly tool
# pins, deploy/windows/tools.json (MSVC toolset, NSIS, the WebView2 bootstrapper, Pester,
# PSScriptAnalyzer), native/ffmpeg/pins.json and the vcpkg baseline in native/vcpkg.json and
# native/vcpkg-configuration.json.

version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /tools
    target-branch: m1/server-web # switch to main after M1 (see the top of this file)
    schedule:
      interval: weekly
    # Task, golangci-lint and shfmt are pinned in tools/go.mod and in .tool-versions, which must
    # agree (task lint:pins). They are bumped by hand, together (06 §7.1), not here. shfmt is the
    # mvdan.cc/sh/v3 module, which Task's shell uses too.
    #
    # Wails tags a beta almost daily, and a bump needs the Windows smoke, 03's checklist and the
    # origin test against the previous release's protocol.DesktopOrigins(), so it is a hand-made
    # pull request that moves the library, tools/wails3/go.mod and @wailsio/runtime together
    # (docs/m2/06-windows-release.md D19, §10.6).
    ignore:
      - dependency-name: github.com/go-task/task/v3
      - dependency-name: github.com/golangci/golangci-lint/v2
      - dependency-name: mvdan.cc/sh/v3
      - dependency-name: github.com/wailsapp/wails/v3
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - /web
      - /docs
    target-branch: m1/server-web # switch to main after M1
    schedule:
      interval: weekly
    # Major updates that wait for a lint tool (Dependabot PRs #3, #7 and #8; npm registry as of
    # 2026-10-08). Each one installs only with --force or --legacy-peer-deps, which we never use.
    # Minor and patch updates still arrive in the group below. Drop an entry when the blocking
    # package's published peerDependencies allow the new major, then take the update and bring the
    # version table of docs/m1/05-web-client.md §2 in line. The entries apply to /docs as well.
    ignore:
      # ESLint 10. eslint and @eslint/js move together (@eslint/js 10 has the peer eslint ^10).
      # Blocked by eslint-plugin-jsx-a11y: its latest release, 6.10.2, declares the peer range
      # eslint "^3 || ^4 || ^5 || ^6 || ^7 || ^8 || ^9".
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # TypeScript 7. Blocked by typescript-eslint: its latest release, 8.71.1, and the
      # @typescript-eslint/* packages it installs declare the peer range
      # typescript ">=4.8.4 <6.1.0", and it refuses to load under TypeScript 7.0. The main export
      # of typescript 7.0.2 also has no compiler API any more, which web/scripts/check-i18n.mjs
      # imports: that script has to be ported in the same change.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The Wails runtime moves only with the Go library (see the gomod entry), at its version
      # without the "v", so every update type is ignored; the npm-minor-patch group's "*" would
      # otherwise propose it alone (docs/m2/06-windows-release.md §10.6).
      - dependency-name: "@wailsio/runtime"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: m1/server-web # switch to main after M1
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The base image of deploy/docker/Dockerfile (06 §6.1): gcr.io/distroless/static-debian13:nonroot,
  # pinned by the digest of its multi-arch index. The tag is not a version, so an update here is a
  # new digest for the same tag.
  - package-ecosystem: docker
    directory: /deploy/docker
    target-branch: m1/server-web # switch to main after M1
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
