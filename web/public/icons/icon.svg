<!--
  isshoni's mark (src/app/AppMark.tsx: two screens, one in front of the other) on the manifest's background colour.
  Original artwork of this project, Apache-2.0 like the rest. The PNG icons next to this file are renders of the same
  shapes: icon-192 and icon-512 of this drawing, maskable-512 and apple-touch-icon without the rounded corners and
  with the mark inside the safe zone, badge-72 in white on transparent.
  Presentation attributes only (no <style>, no script): the server sends files with a strict CSP (04).
-->
