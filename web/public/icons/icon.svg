    <rect x="15.5" y="17.5" width="31" height="23" rx="5.5" fill="#101014"/>
    <rect x="17" y="19" width="28" height="20" rx="4" fill="#8e88ff"/>
    <path d="M27 44H35" fill="none" stroke="#8e88ff" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
