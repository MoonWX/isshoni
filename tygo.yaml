# tygo v0.2.21 (pinned in tools/go.mod): Go wire types → TypeScript. Run `task gen`; CI runs `task gen:check`.
# The content is owned by docs/m1/01-protocol.md §14.4.
packages:
  - path: "github.com/MoonWX/isshoni/internal/protocol"
    output_path: "web/src/protocol/types.gen.ts"
    enum_style: "union"
    type_mappings:
      time.Time: "string"
      json.RawMessage: "unknown"
    # tygo writes its own "Code generated by tygo. DO NOT EDIT." line above this one.
    frontmatter: "// Source: internal/protocol. Regenerate with \"task gen\".\n"
  - path: "github.com/MoonWX/isshoni/internal/protocol/api" # REST DTOs and error codes (03, plus 04's files)
    output_path: "web/src/protocol/api.gen.ts"
    enum_style: "union"
    type_mappings:
      time.Time: "string"
      json.RawMessage: "unknown"
    frontmatter: "// Source: internal/protocol/api. Regenerate with \"task gen\".\n"
  - path: "github.com/MoonWX/isshoni/internal/protocol/relay" # same-user relay kinds and payloads (docs/m2/01-client-core.md §11.11)
    output_path: "web/src/protocol/relay.gen.ts"
    enum_style: "union"
    type_mappings:
      # The relay's payloads use protocol's enums; relay.gen.ts imports them from types.gen.ts (the frontmatter).
      protocol.ClientOS: "ClientOS"
    frontmatter: "// Source: internal/protocol/relay. Regenerate with \"task gen\".\nimport type { ClientOS } from './types.gen';\n"
