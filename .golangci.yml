# golangci-lint v2 (pinned in tools/go.mod and .tool-versions). Run it through `task lint:go`.
# Linters and formatters: docs/m1/06-deploy-and-ci.md §8.2. The depguard rules encode the import table of
# docs/m1/04-server-platform.md §2, the single source for which package of this repository may import which, plus
# what that table leaves to 01, 02 and 03 (internal/protocol, internal/protocol/api, sfu) and the cmd/isshoni rule
# of 02 §15.1, and M2's import rules (docs/m2/01-client-core.md §4, docs/m2/03-desktop-app.md §4.5 and the rows
# of 05 and 06; see the M2 block below): change those docs first, then the rules here. The rules cover packages of
# this repository (and Prometheus for the SFU, Wails for M2) in non-test files, unless a rule says "test files too";
# third-party modules are governed by the license gate (`task licenses`).
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - depguard
    - errorlint
    - forbidigo
    - gosec
    - misspell
    - nilerr
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - usestdlibvars

  settings:
    depguard:
      rules:
        protocol: # test files too (06 §8.2)
          list-mode: lax
          files: ["**/internal/protocol/*.go", "**/internal/protocol/**/*.go"]
          deny:
            - pkg: github.com/MoonWX/isshoni/internal/server
              desc: internal/protocol must not import internal/server/... (06 §8.2)
        protocol-stdlib:
          list-mode: lax
          files: ["**/internal/protocol/*.go", "!$test"]
          deny:
            - pkg: github.com/MoonWX/isshoni
              desc: internal/protocol imports only the standard library (01 D12, §15.1)
        protocol-api:
          list-mode: lax
          files: ["**/internal/protocol/api/*.go", "!$test"]
          deny:
            - pkg: github.com/MoonWX/isshoni
              desc: internal/protocol/api imports only the standard library (03 §2.1)
        version:
          list-mode: lax
          files: ["**/internal/version/*.go", "!$test"]
          deny:
            - pkg: github.com/MoonWX/isshoni
              desc: internal/version is a leaf and imports no package of this repository (04 §2)
        logx:
          list-mode: lax
          files: ["**/internal/logx/*.go", "!$test"]
          allow:
            - github.com/MoonWX/isshoni/internal/version
          deny:
            - pkg: github.com/MoonWX/isshoni
              desc: internal/logx may import only internal/version from this repository (04 §2)
        config:
          list-mode: lax
          files: ["**/internal/server/config/*.go", "!$test"]
          allow:
            - github.com/MoonWX/isshoni/internal/logx
            - github.com/MoonWX/isshoni/internal/version
          deny:
            - pkg: github.com/MoonWX/isshoni
              desc: config may import only logx and version from this repository (04 §2)
        netx:
          list-mode: lax
          files: ["**/internal/server/netx/*.go", "!$test"]
          allow:
            - github.com/MoonWX/isshoni/internal/logx
            - github.com/MoonWX/isshoni/internal/version
            - github.com/MoonWX/isshoni/internal/protocol/api
          deny:
            - pkg: github.com/MoonWX/isshoni
              desc: netx may import only logx, version and internal/protocol/api from this repository; it takes plain option structs, never config (04 §2)
        store:
          list-mode: lax
          files: ["**/internal/server/store/*.go", "!$test"]
          allow:
            - github.com/MoonWX/isshoni/internal/protocol/api
          deny:
            - pkg: github.com/MoonWX/isshoni
              desc: store may import only internal/protocol/api from this repository (04 §2)
        auth:
          list-mode: lax
          files: ["**/internal/server/auth/*.go", "!$test"]
          allow:
            - github.com/MoonWX/isshoni/internal/server/store
            - github.com/MoonWX/isshoni/internal/protocol/api
          deny:
            - pkg: github.com/MoonWX/isshoni
              desc: auth may import only store and internal/protocol/api from this repository (04 §2)
        httpapi:
          list-mode: lax
          files: ["**/internal/server/httpapi/*.go", "!$test"]
          allow:
            - github.com/MoonWX/isshoni/internal/server/config
            - github.com/MoonWX/isshoni/internal/logx
            - github.com/MoonWX/isshoni/internal/version
            - github.com/MoonWX/isshoni/internal/server/store
            - github.com/MoonWX/isshoni/internal/server/auth
            - github.com/MoonWX/isshoni/internal/protocol
          deny:
            - pkg: github.com/MoonWX/isshoni
              desc: httpapi may import only config, logx, version, store, auth and internal/protocol(/api); ops, push, netx, tlsmgr, signal, sfu and sfuplane reach it through interfaces (04 §2)
        tlsmgr:
          list-mode: lax
          files: ["**/internal/server/tlsmgr/*.go", "!$test"]
          allow: &opsImports
            - github.com/MoonWX/isshoni/internal/server/config
            - github.com/MoonWX/isshoni/internal/logx
            - github.com/MoonWX/isshoni/internal/version
            - github.com/MoonWX/isshoni/internal/server/netx
            - github.com/MoonWX/isshoni/internal/protocol
          deny: &opsDeny
            - pkg: github.com/MoonWX/isshoni
              desc: tlsmgr, ops, ops/doctor and push may import only config, logx, version, netx and internal/protocol(/api); the wiring adapts store, auth, signal and sfu to their interfaces (04 §2)
        ops:
          list-mode: lax
          files: ["**/internal/server/ops/*.go", "!$test"]
          allow:
            - github.com/MoonWX/isshoni/internal/server/config
            - github.com/MoonWX/isshoni/internal/logx
            - github.com/MoonWX/isshoni/internal/version
            - github.com/MoonWX/isshoni/internal/server/netx
            - github.com/MoonWX/isshoni/internal/protocol
            - github.com/MoonWX/isshoni/internal/server/ops/doctor
          deny: *opsDeny
        doctor:
          list-mode: lax
          files: ["**/internal/server/ops/doctor/*.go", "!$test"]
          allow: *opsImports
          deny: *opsDeny
        push:
          list-mode: lax
          files: ["**/internal/server/push/*.go", "!$test"]
          allow: *opsImports
          deny: *opsDeny
        sfu:
          list-mode: lax
          files: ["**/internal/server/sfu/*.go", "**/internal/server/sfu/**/*.go", "!$test"]
          deny:
            - pkg: github.com/MoonWX/isshoni/internal/protocol
              desc: sfu and sfutest never import internal/protocol (or its api); 01's sfuplane translates (02 §2)
            - pkg: github.com/MoonWX/isshoni/internal/server/signal
              desc: sfu and sfutest never import signal; signal drives the SFU through 01's sfuplane (02 §2)
            - pkg: github.com/MoonWX/isshoni/internal/server/sfuplane
              desc: sfu and sfutest never import sfuplane, the adapter that imports sfu (02 §2)
            - pkg: github.com/prometheus
              desc: the SFU does not import Prometheus; 04 adapts sfu.Metrics (02 §4, §13)
        cmd: # test files too
          list-mode: lax
          files: ["**/cmd/isshoni/*.go", "**/cmd/isshoni/**/*.go"]
          deny:
            - pkg: github.com/MoonWX/isshoni/internal/media/fake
              desc: internal/media/fake is test code that no release artifact contains; cmd/isshoni never imports it (02 §15.1)
        config-importers:
          list-mode: lax
          files:
            - $all
            - "!$test"
            - "!**/cmd/isshoni/**"
            - "!**/internal/server/*.go"
            - "!**/internal/server/config/**"
            - "!**/internal/server/httpapi/**"
            - "!**/internal/server/tlsmgr/**"
            - "!**/internal/server/ops/**"
            - "!**/internal/server/push/**"
            - "!**/internal/server/servertest/**"
          deny:
            - pkg: github.com/MoonWX/isshoni/internal/server/config
              desc: only cmd/isshoni, the wiring, httpapi, tlsmgr, ops and push read config; pass a plain option struct instead (04 §2)

        # M2 (docs/m2/README.md §5: WA02 writes every M2 rule, then only the integrator changes them). "01 §4" is the
        # import table of docs/m2/01-client-core.md §4 (D1–D3), which also holds 05's rows (audiorules,
        # internal/desktop/audio); "03" is docs/m2/03-desktop-app.md (§3.1, §4.5); "06" is
        # docs/m2/06-windows-release.md. A trailing $ makes an allow entry match that package only, not its
        # subpackages. Only internal/media and internal/media/audiorules also restrict third-party modules: their
        # specs make them standard library only.
        media:
          list-mode: strict
          files: ["**/internal/media/*.go", "!$test"]
          allow:
            - $gostd
          deny:
            - pkg: github.com/MoonWX/isshoni
              desc: internal/media, the media contract, imports only the standard library (01 D1, §4)
        media-audiorules:
          list-mode: strict
          files: ["**/internal/media/audiorules/*.go", "!$test"]
          allow:
            - $gostd
          deny:
            - pkg: github.com/MoonWX/isshoni
              desc: internal/media/audiorules imports only the standard library (01 §4, 05 §5.4)
        media-fake:
          list-mode: lax
          files: ["**/internal/media/fake/*.go", "!$test"]
          allow:
            - github.com/MoonWX/isshoni/internal/media$
          deny:
            - pkg: github.com/MoonWX/isshoni
              desc: internal/media/fake imports only internal/media from this repository, never internal/client or internal/server (01 §4)
        media-mediatest:
          list-mode: lax
          files: ["**/internal/media/mediatest/*.go", "!$test"]
          allow:
            - github.com/MoonWX/isshoni/internal/media$
          deny:
            - pkg: github.com/MoonWX/isshoni
              desc: internal/media/mediatest imports only internal/media from this repository (01 §4)
        media-native:
          list-mode: lax
          files: ["**/internal/media/native/*.go", "**/internal/media/native/**/*.go", "!$test"]
          allow:
            - github.com/MoonWX/isshoni/internal/logx
            - github.com/MoonWX/isshoni/internal/media$
          deny:
            - pkg: github.com/MoonWX/isshoni
              desc: internal/media/native imports only internal/media and internal/logx from this repository, never internal/client or internal/server (01 §4, D3)
        client:
          list-mode: lax
          files: ["**/internal/client/*.go", "**/internal/client/**/*.go", "!$test"]
          allow:
            - github.com/MoonWX/isshoni/internal/client
            - github.com/MoonWX/isshoni/internal/logx
            - github.com/MoonWX/isshoni/internal/media$
            - github.com/MoonWX/isshoni/internal/protocol
            - github.com/MoonWX/isshoni/internal/version
          deny:
            - pkg: github.com/MoonWX/isshoni
              desc: internal/client imports from this repository only its sibling packages, internal/protocol (and /api, /relay), the internal/media root (never its subpackages), internal/version and internal/logx; never internal/server or internal/desktop; its test files may import the fakes (01 D2, §4)
        protocol-relay:
          list-mode: lax
          files: ["**/internal/protocol/relay/*.go", "!$test"]
          allow:
            - github.com/MoonWX/isshoni/internal/protocol$
          deny:
            - pkg: github.com/MoonWX/isshoni
              desc: internal/protocol/relay imports only internal/protocol from this repository (01 §4, §11.11)
        desktop-audio:
          list-mode: lax
          files: ["**/internal/desktop/audio/*.go", "**/internal/desktop/audio/**/*.go", "!$test"]
          allow:
            - github.com/MoonWX/isshoni/internal/logx
            - github.com/MoonWX/isshoni/internal/media$
            - github.com/MoonWX/isshoni/internal/media/audiorules
          deny:
            - pkg: github.com/MoonWX/isshoni
              desc: internal/desktop/audio imports only the internal/media root, internal/media/audiorules and internal/logx from this repository; never internal/client, internal/server, internal/media/native or internal/media/fake (01 §4, 05 §14)
        desktop-no-wails: # test files too
          list-mode: lax
          files: ["**/internal/desktop/**"]
          deny:
            - pkg: github.com/wailsapp/wails
              desc: only cmd/isshoni-desktop imports Wails; internal/desktop builds and tests on every OS (03 D2, §4.5)
        desktop-no-server:
          list-mode: lax
          files: ["**/internal/desktop/**", "**/cmd/isshoni-desktop/**", "!$test"]
          deny:
            - pkg: github.com/MoonWX/isshoni/internal/server
              desc: the app is a client; it never imports internal/server (03 §4.5)
        server-no-desktop: # test files too
          list-mode: lax
          files: ["**/internal/server/**", "**/cmd/isshoni/**"]
          deny:
            - pkg: github.com/MoonWX/isshoni/internal/desktop
              desc: the server binary never links the app (03 §4.5)
            - pkg: github.com/wailsapp/wails
              desc: the server binary never links the app (03 §4.5)
        desktop-no-engine-impl:
          list-mode: lax
          files: ["**/internal/desktop/**", "!**/internal/desktop/e2ehost/**", "!$test"]
          deny:
            - pkg: github.com/MoonWX/isshoni/internal/media/fake
              desc: engines enter through the app's main (cmd/isshoni-desktop); of internal/desktop only e2ehost links the fake (03 §4.5, 01 §4)
            - pkg: github.com/MoonWX/isshoni/internal/media/native
              desc: engines enter through the app's main (cmd/isshoni-desktop), never through internal/desktop (03 §4.5, 01 §4)
        desktop-main-no-fake: # test files too
          list-mode: lax
          files: ["**/cmd/isshoni-desktop/**"]
          deny:
            - pkg: github.com/MoonWX/isshoni/internal/media/fake
              desc: only engine_fake.go (build tags dev || e2e, which this lint run doesn't set) imports the fake engine; no release artifact links it (03 §4.5, 01 §6.3)
        wails: # test files too; internal/desktop, internal/server and cmd/isshoni have their own rules above
          list-mode: lax
          files:
            - $all
            - "!**/cmd/isshoni-desktop/**"
            - "!**/internal/desktop/**"
            - "!**/internal/server/**"
            - "!**/cmd/isshoni/**"
            - "!**/tools/wails3/**"
          deny:
            - pkg: github.com/wailsapp/wails
              desc: Wails is imported only by cmd/isshoni-desktop (03 D2, §3.1)
        deploy-importers:
          list-mode: lax
          files: [$all, "!$test", "!**/internal/server/*.go"]
          deny:
            - pkg: github.com/MoonWX/isshoni/deploy
              desc: only internal/server (the wiring) imports deploy, and passes its embedded files on (06 §7.4)
        update:
          list-mode: lax
          files: ["**/internal/update/*.go", "**/internal/update/**/*.go", "!$test"]
          allow:
            - github.com/MoonWX/isshoni/internal/logx
            - github.com/MoonWX/isshoni/internal/version
          deny:
            - pkg: github.com/MoonWX/isshoni
              desc: internal/update imports only internal/version and internal/logx from this repository, never internal/server (06 §8.9)

    forbidigo:
      analyze-types: true
      forbid:
        # Scoped to internal/server by the exclusion rule below.
        - pattern: ^fmt\.Print(f|ln)?$
          msg: internal/server logs through log/slog (internal/logx), never fmt.Print*
        - pattern: ^log\.
          pkg: ^log$
          msg: internal/server logs through log/slog (internal/logx), never the log package
        # Everywhere.
        - pattern: \.SetNAT1To1IPs$
          msg: use SettingEngine.SetICEAddressRewriteRules (docs/PLAN.md)

  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - linters: [forbidigo]
        path-except: ^internal/server/
        text: internal/server logs through log/slog
      # G115 (an integer conversion may overflow) is off only for the media code: RTP and RTCP code converts between
      # widths on purpose, because sequence numbers and timestamps wrap by design. It stays on everywhere else.
      - linters: [gosec]
        path: ^internal/(server/sfu|media|client/publish)/
        text: G115

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/MoonWX/isshoni
