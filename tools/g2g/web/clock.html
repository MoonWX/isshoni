<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>g2g clock</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
  #screen { position: fixed; left: 0; top: 0; }
  #start {
    position: fixed; padding: 8px 28px; border: 0; border-radius: 6px; cursor: pointer;
    font: 600 20px system-ui, sans-serif; color: #fff; background: #1565c0;
  }
  #start[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<button id="start" type="button">Start</button>
<script>
"use strict";
// The clock page of tools/g2g (docs/m2/01-client-core.md §12.2). At every animation frame it draws
// v = floor(performance.now()) mod 65536 as a 16-bit Gray code in the strip at the top-left, a readable counter
// under it, and moving content over a background that swaps every 5 s between two full-window images (the content
// cuts; ?cuts=0 turns them off). Start plays a quiet 440 Hz tone, so a share of this page carries real sound.
// ?freeze=<ms> draws one frame as at that time and stops (tools/g2g's decoder fixtures are recorded so).
(() => {
  // The strip, in device pixels; tools/g2g/decode.go reads it with the same numbers. CELLS cells of CELL x CELL:
  // a black-white guard at each end and BITS data cells (the Gray code of v, the most significant bit first,
  // black = 1), on a mid-grey frame MARGIN wide.
  const CELL = 48, CELLS = 18, BITS = 16, MARGIN = 24, GREY = "#808080";
  const PANEL_W = CELLS * CELL + 2 * MARGIN, TEXT_H = 44, PANEL_H = CELL + 2 * MARGIN + TEXT_H;
  const CUT_MS = 5000;   // the background swaps this often
  const SEED = 20261022; // the two background images come from this seed, so every run shows the same ones
  const NOISE_BLOCK = 32; // coarse, and not the strip's 48 px
  const TONE_HZ = 440, TONE_DBFS = -30;

  const params = new URLSearchParams(location.search);
  const cuts = params.get("cuts") !== "0";
  const freezeParam = params.get("freeze");
  const freeze = freezeParam !== null && /^\d+(\.\d+)?$/.test(freezeParam) ? Number(freezeParam) : null;

  const canvas = document.getElementById("screen");
  const ctx = canvas.getContext("2d", { alpha: false });
  const button = document.getElementById("start");
  let W = 1, H = 1;
  let backgrounds = [];
  let audio = null;
  let shown = { v: 0, cut: 0 };

  // mulberry32: a small seeded generator, so the images are the same on every machine.
  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function makeCanvas(w, h) {
    const c = document.createElement("canvas");
    c.width = w;
    c.height = h;
    return c;
  }

  // A dense page of small black text on white.
  function textPage(w, h) {
    const c = makeCanvas(w, h), g = c.getContext("2d", { alpha: false });
    const r = rng(SEED);
    g.fillStyle = "#fff";
    g.fillRect(0, 0, w, h);
    g.fillStyle = "#000";
    g.font = "11px monospace";
    g.textBaseline = "top";
    const chars = Math.ceil(w / Math.max(1, g.measureText("m").width)) + 2;
    for (let y = 2; y < h; y += 13) {
      let line = "";
      while (line.length < chars) {
        const n = 1 + Math.floor(r() * 9);
        for (let i = 0; i < n; i++) line += String.fromCharCode(97 + Math.floor(r() * 26));
        line += r() < 0.1 ? ", " : " ";
      }
      g.fillText(line, 2, y);
    }
    return c;
  }

  // Coarse noise of saturated colours: no grey, no black-white cells.
  function noise(w, h) {
    const c = makeCanvas(w, h), g = c.getContext("2d", { alpha: false });
    const r = rng(SEED ^ 0x5bd1e995);
    for (let y = 0; y < h; y += NOISE_BLOCK) {
      for (let x = 0; x < w; x += NOISE_BLOCK) {
        const hue = Math.floor(r() * 360), sat = 75 + Math.floor(r() * 25), light = 35 + Math.floor(r() * 25);
        g.fillStyle = `hsl(${hue}, ${sat}%, ${light}%)`;
        g.fillRect(x, y, NOISE_BLOCK, NOISE_BLOCK);
      }
    }
    return c;
  }

  // A gradient box that wanders over the window.
  function drawGradient(t) {
    const w = Math.round(W * 0.3), h = Math.round(H * 0.3);
    const x = Math.round((W - w) * (0.5 + 0.5 * Math.sin(t / 1700)));
    const y = Math.round((H - h) * (0.5 + 0.5 * Math.sin(t / 2300 + 1)));
    const hue = Math.floor(t / 20) % 360;
    const gr = ctx.createLinearGradient(x, y, x + w, y + h);
    gr.addColorStop(0, `hsl(${hue}, 90%, 55%)`);
    gr.addColorStop(0.5, `hsl(${(hue + 120) % 360}, 90%, 50%)`);
    gr.addColorStop(1, `hsl(${(hue + 240) % 360}, 90%, 45%)`);
    ctx.fillStyle = gr;
    ctx.fillRect(x, y, w, h);
  }

  // A band of scrolling text across the window.
  const BAND_TEXT = "isshoni glass-to-glass clock · the quick brown fox jumps over the lazy dog · ";
  function drawBand(t) {
    const bh = 2 * CELL, y = Math.round(H * 0.62);
    ctx.fillStyle = "#16245c";
    ctx.fillRect(0, y, W, bh);
    ctx.fillStyle = "#fff";
    ctx.font = `bold ${Math.round(bh * 0.45)}px sans-serif`;
    ctx.textBaseline = "middle";
    const tw = Math.max(1, ctx.measureText(BAND_TEXT).width);
    for (let x = -((t * 0.3) % tw); x < W; x += tw) ctx.fillText(BAND_TEXT, x, y + bh / 2);
  }

  // The grey panel with the strip and the counter.
  function drawPanel(v) {
    ctx.fillStyle = GREY;
    ctx.fillRect(0, 0, PANEL_W, PANEL_H);
    const g = v ^ (v >>> 1), half = CELL / 2, x0 = MARGIN, y0 = MARGIN, xr = MARGIN + (CELLS - 1) * CELL;
    const cell = (x, w, black) => {
      ctx.fillStyle = black ? "#000" : "#fff";
      ctx.fillRect(x, y0, w, CELL);
    };
    cell(x0, half, true); // left guard: black, white
    cell(x0 + half, half, false);
    for (let i = 0; i < BITS; i++) cell(x0 + (i + 1) * CELL, CELL, (g >>> (BITS - 1 - i)) & 1);
    cell(xr, half, false); // right guard: white, black
    cell(xr + half, half, true);
    ctx.fillStyle = "#000";
    ctx.font = "bold 24px monospace";
    ctx.textBaseline = "alphabetic";
    const text = `${String(v).padStart(5, "0")} ms   cuts ${cuts ? "on" : "off"}   tone ${toneOn() ? "on" : "off"}`;
    ctx.fillText(text, MARGIN, CELL + 2 * MARGIN + 30);
  }

  function draw(t) {
    const v = Math.floor(t) % 65536;
    const cut = cuts ? Math.floor(t / CUT_MS) % 2 : 0;
    ctx.drawImage(backgrounds[cut], 0, 0);
    drawGradient(t);
    drawBand(t);
    drawPanel(v);
    shown = { v, cut };
  }

  function frame() {
    draw(performance.now());
    requestAnimationFrame(frame);
  }

  // The canvas has one pixel per device pixel, so the strip is CELL device pixels a cell at any display scaling
  // or zoom, and at (MARGIN, MARGIN) on the screen when the page is full screen.
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = Math.max(1, Math.round(window.innerWidth * dpr));
    H = Math.max(1, Math.round(window.innerHeight * dpr));
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = `${W / dpr}px`;
    canvas.style.height = `${H / dpr}px`;
    backgrounds = [textPage(W, H), noise(W, H)];
    button.style.left = `${(PANEL_W + MARGIN) / dpr}px`;
    button.style.top = `${MARGIN / dpr}px`;
  }

  function toneOn() {
    return audio !== null && audio.state === "running";
  }

  function updateButton() {
    button.hidden = toneOn() || freeze !== null;
  }

  // Browsers start audio only after a user gesture: the tone starts with the Start button.
  button.addEventListener("click", async () => {
    try {
      if (audio === null) {
        audio = new AudioContext();
        const osc = new OscillatorNode(audio, { type: "sine", frequency: TONE_HZ });
        const gain = new GainNode(audio, { gain: Math.pow(10, TONE_DBFS / 20) });
        osc.connect(gain).connect(audio.destination);
        osc.start();
        audio.addEventListener("statechange", updateButton);
      }
      await audio.resume();
    } catch (err) {
      console.error("g2g clock: the tone did not start:", err);
    }
    updateButton();
  });

  // For checking the page from a browser's console or a test.
  window.g2gClock = Object.freeze({
    cuts,
    shown: () => shown,
    tone: () => (audio === null ? "off" : audio.state),
  });

  resize();
  updateButton();
  window.addEventListener("resize", () => {
    resize();
    if (freeze !== null) draw(freeze);
  });
  if (freeze !== null) draw(freeze);
  else requestAnimationFrame(frame);
})();
</script>
</body>
</html>
